<!--
  THE WRAPPER, AND ALL IT DOES IS GIVE THE PORTAL A VIEWPORT.

  The previous arrangement grew this frame to the height of its content. That is what broke
  the screen: an iframe as tall as its own content has no scrollport, so nothing inside it
  can stick — not the rail, not the page header, not a table's header row — and the
  scrolling was happening out here, in a page that knows nothing about any of them. It also
  raced its own measurement, which is what cut the bottom off on a phone.

  So the frame is a fixed viewport and the portal scrolls inside itself, the way any
  application does. There is no message to listen for and no height to compute. Do not put
  a resize script back in.

  THE ONLY LINE YOU EVER EDIT is the src below: the /exec URL of the Apps Script
  deployment. It must end in /exec, and that deployment must be "Execute as: Me" with
  "Who has access: Anyone". Every time Code.gs changes, publish a NEW VERSION — editing the
  code alone does nothing to this URL.
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;              /* the portal scrolls; this page never does */
    background: #12474C;
    -webkit-text-size-adjust: 100%;
  }
  #portal {
    display: block;
    border: 0;
    /* iOS sizes an iframe to its CONTENT, not to the width it is given, so a page a few
       pixels too wide made the whole frame wider than the phone and pushed the portal off
       the left edge. 1px + min-width 100% is the standard cure: the frame can never be
       wider than the screen, and the portal lays itself out to it. */
    width: 1px;
    min-width: 100%;
    max-width: 100%;
    height: 100vh;
  }
  /* On iOS 100vh is the height with the toolbars HIDDEN, so it is always a toolbar too
     tall and the portal's last row sits under the address bar. */
  @supports (height: 100dvh) {
    #portal { height: 100dvh; }
  }
</style>
</head>
<body>

<iframe id="portal"
        title="Taxi Sharm Settlement"
        src="https://script.google.com/macros/s/AKfycbzpTnUffvv6wn_Uv04n2lDF8wNwt-uUe0k1NglVsIXhLcjkPwtf2N0P9CmzfbO7NR4NxA/exec"
        allow="clipboard-write"></iframe>

<script>
  /* Registers sw.js, which only makes the portal installable. It caches nothing, so every
     deployment arrives the next time the app is opened. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
