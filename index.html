  */
  function pgSettle(d) {
    var pend = d.pending || [], await_ = d.awaiting || [], mism = d.mismatched || [];
    var p = pool();
    // Collected, owed, and too small to wire on its own. See the panel below.
    var belowMin = !pend.length && !!p.belowMinimum && Number(p.ready) > 0;
    var out = '';

    // Straight after settling, say plainly where the row went. It leaves this page the
    // instant it is logged, and without this it reads as though it disappeared.
    if (S.justSettled) {
      out += '<div class="alert" style="background:#E6F3EC;color:' + C.ok +
        ';border-color:#C4E3D2">' + esc(S.justSettled) + ' Now on <a class="lk" ' +
        'data-go="remit" style="color:' + C.ok + ';font-weight:600">eNovate Settlement</a>.' +
        '</div>';
    }

    // ---- 1. anything mismatched blocks everything, so it goes first
    if (mism.length) {
      out += panel('Fix these first — the bank deposit does not match the links',
        '<div class="scroll"><table class="data"><thead><tr>' + th('Day') +
        th('Bank: you typed', 1) + th('Bank: should be', 1) + th('Off by', 1) + th('Held back', 1) +
        th('What it looks like') + '</tr></thead><tbody>' + mism.map(function (r) {
          return '<tr><td class="num"><a class="lk" data-act="gotoday" data-day="' +
            esc(r.date) + '">' + esc(r.date) + '</a> <span style="color:' + C.muted +
            ';font-size:10.5px">' + dow(r.date) + '</span></td>' +
            '<td class="right num">' + fmt(r.deposit) + '</td>' +
            /* What the BANK should show: the link amounts less what Paymob kept. Showing the
               link total here, beside a Paymob deduction, read as "type the full amount". */
            '<td class="right num" style="color:' + C.muted + '">' +
            fmt(Number(r.expected) - Number(r.pmFee || 0) - Number(r.vatKept || 0) - Number(r.payout || 0)) +
            (Number(r.pmFee) > 0 ? '<div style="font-size:10.5px">' + fmt(r.expected) + ' \u2212 ' +
              fmt(r.pmFee) + ' Paymob</div>' : '') + '</td>' +
            '<td class="right num" style="font-weight:600;color:' + C.bad + '">' +
            fmt(r.variance) + '</td>' +
            '<td class="right num">' + fmt(r.entitlement) + '</td>' +
            '<td style="font-size:11px;color:' + C.soft + '">' +
            (Number(r.feeDoubled) > 0
              ? '<b>over by exactly the ' + fmt(r.feeDoubled) + ' Paymob fee.</b> \u201cYou ' +
                'typed\u201d must be what the <b>bank</b> received. Which is it?<div style="' +
                'display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' +
                '<button class="btn btn-primary" style="height:28px;padding:0 10px;font-size:11.5px" ' +
                'data-act="depfix" data-day="' + esc(r.date) + '" data-v="' +
                (Number(r.expected) - Number(r.feeDoubled)).toFixed(2) + '"' +
                (S.acting || !canWrite() ? ' disabled' : '') + '>The bank got ' +
                fmt(Number(r.expected) - Number(r.feeDoubled)) + ' \u2014 Paymob kept ' +
                fmt(r.feeDoubled) + '</button>' +
                '<button class="btn btn-ghost" style="height:28px;padding:0 10px;font-size:11.5px" ' +
                'data-act="pmfee" data-day="' + esc(r.date) + '" data-v="0"' +
                (S.acting || !canWrite() ? ' disabled' : '') + '>The bank got ' + fmt(r.deposit) +
                ' \u2014 Paymob kept nothing</button></div>'
              : Number(r.feeHint) > 0
              ? '<b>short by exactly ' + fmt(r.feeHint) + '</b> \u2014 Paymob\u2019s payout ' +
                'deduction. If the statement shows it: <button class="btn btn-ghost" ' +
                'style="height:26px;padding:0 9px;font-size:11px;margin-top:4px" ' +
                'data-act="pmfee" data-day="' + esc(r.date) + '" data-v="' +
                Number(r.feeHint).toFixed(2) + '"' + (S.acting || !canWrite() ? ' disabled' : '') +
                '>Record ' + fmt(r.feeHint) + ' as Paymob\u2019s</button>'
              : r.looksLikeBareDebt
              ? '<b>short by exactly ' + fmt(linkFee()) + ' per link</b> — the bare debt ' +
                'was almost certainly typed into Payments column D instead of the link ' +
                'amount as sent'
              : 'check the statement against the link amounts') + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="alert" style="margin-top:12px">Nothing goes out while a day is off.' +
        (mism.some(function (r) { return r.looksLikeBareDebt; })
          ? ' Column D on Payments is the <b>link amount as support sent it</b>, with the ' +
            fmt(linkFee()) + ' fee already inside \u2014 not the bare debt.'
          : ' A day matches when <b>what the bank received + what Paymob kept = expected</b>.') +
        '</div>' +
        depositRows(mism.map(function (r) {
          return { date: r.date, expected: r.expected, links: 0, current: r.deposit, fee: r.pmFee, vatKept: r.vatKept, payout: r.payout };
        })), mism.length + ' day(s)');
    }

    // ---- 2. deposits still to confirm, all in one place
    if (await_.length) {
      out += panel('Type in what the bank actually received',
        depositRows(await_.map(function (r) {
          return { date: r.date, expected: r.expected, links: r.links, current: '', fee: r.pmFee, vatKept: r.vatKept, payout: r.payout };
        })), await_.length + ' day(s) waiting');
    }

    /*
      ---- 3. what is due to go out, as TWO STEPS in the agreed order.

      eNovate approves before the money moves. So each day shows where it stands, and
      Settle is deliberately the quieter button until the approval sheet has gone out — the
      screen should make the right order the easy order rather than relying on memory.

      It is a nudge, not a lock. Approval sometimes comes by phone, and a portal that
      refuses to record a transfer that has genuinely left the bank would push the truth out
      of the book, which is worse than an out-of-order email.
    */
    if (pend.length) {
      out += panel('Ready to send to eNovate', '<div class="due">' + pend.map(function (r) {
        var appr = String(r.approvalAt || '').trim();
        return '<div class="duecard"><div class="eb" style="color:' + C.teal + '">' +
          esc(dow(r.date) + ' ' + dm(r.date)) + (isWorkDay(r.date) ? '' : ' \u00b7 day off') +
          '</div><div class="amt2 num">' + fmt(r.net) + '</div>' +
          '<div style="font-size:11px;color:' + C.muted + '">EGP to eNovate, after the ' +
          fmt(r.ach) + ' bank fee</div>' +
          /*
            The catch-up is measured on the GROSS due, and the figure above it is the NET
            after the bank fee — so "170.81 of this is from earlier days" under a 120.81
            wire read as impossible. And now that a wire is dated the day it goes out, the
            cash almost never lands on that same day, so the ordinary case is that ALL of it
            came from earlier days. Both are said plainly instead.
          */
          (Number(r.catchup) > 0 ? '<div style="font-size:11px;color:' + C.warn +
            ';margin-top:6px">' +
            (Number(r.catchup) >= Number(r.gross) - 0.005
              ? 'all of it was collected on earlier days'
              : fmt(r.catchup) + ' of the ' + fmt(r.gross) +
                ' collected came from earlier days') + '</div>' : '') +
          (Number(r.rem) > 0 ? '<div style="font-size:11px;color:' + C.change +
            ';margin-top:6px">' + fmt(r.rem) + ' of Remaining Amount also came in that day — ' +
            'that stays with Zed\u2019s and is <b>not</b> in the figure above</div>' : '') +
          /*
            Step 1 is sent from the eNovate Settlement page, so this card only REPORTS where
            the approval stands and links there. Two Send buttons on two pages for one email
            is how you end up sending it twice and trusting neither screen about whether it
            went.
          */
          '<div class="stepbox' + (appr ? ' done' : '') + '">' +
          (appr
            ? ic('tick') + '<span><b>Approval sheet sent</b> ' + esc(appr) +
              ' — waiting on eNovate\u2019s go-ahead.</span>'
            : ic('info') + '<span><b>Step 1 first:</b> send the approval sheet from ' +
              '<a class="lk" data-go="remit" style="color:#8A5A05;font-weight:700">eNovate ' +
              'Settlement</a>, get their go-ahead, then settle here.</span>') + '</div>' +
          '<div class="acts" style="margin-top:11px">' +
          '<button class="btn ' + (appr ? 'btn-primary' : 'btn-ghost') +
          '" data-act="settle" data-day="' + esc(r.date) + '"' +
          (S.acting || !canWrite() ? ' disabled' : '') + '>' + ic('send') + 'Settle ' + fmt(r.net) +
          '</button>' +
          '<button class="btn btn-ghost" data-act="copy" data-v="' +
          Number(r.net).toFixed(2) + '" title="Copy the amount">' + ic('copy') +
          '</button></div></div>';
      }).join('') + '</div>', pend.length + ' transfer(s)');
    } else if (belowMin) {
      /*
        MONEY COLLECTED, BUT TOO LITTLE TO WIRE — SAY SO IN WORDS.

        The engine holds a transfer whose net would fall under the minimum: sending it would
        cost a 50.00 bank fee to move less than that, so it waits and goes out with the next
        one. That is right, but the page used to answer it with "Nothing is due" — which
        reads as "nothing was collected" and is a completely different statement. This is
        the one case where a correct book and a silent screen add up to an operator
        wondering where their money went.
      */
      out += panel('Held back until it is worth sending',
        '<div class="loading" style="padding:26px;color:' + C.warn + '">' + ic('info') +
        '<div style="margin-top:8px;color:' + C.ink + ';font-weight:600">' +
        fmt(p.ready) + ' EGP is collected and owed to eNovate.</div>' +
        '<div style="margin-top:6px">After the ' + fmt(achFee()) + ' bank fee that leaves ' +
        fmt(p.wire) + ', which is under the ' + fmt(settings().minTransfer) +
        ' minimum transfer. It stays in the account and goes out with the next one \u2014 ' +
        'one wire, one fee.</div>' +
        '<div style="font-size:11.5px;margin-top:8px">It will send itself as soon as the ' +
        'total after the fee reaches ' + fmt(settings().minTransfer) + '.</div></div>');
    } else if (!await_.length && !mism.length) {
      out += panel('Ready to send to eNovate',
        '<div class="loading" style="padding:30px">' + ic('tick') +
        '<div style="margin-top:8px">Nothing is due. Every confirmed day has been sent ' +
        'and logged.</div></div>');
    } else {
      out += panel('Ready to send to eNovate',
        '<div class="loading" style="padding:26px">Nothing can be sent yet. ' +
        fmt(p.pending) + ' EGP is waiting on the deposits above' +
        (mism.length ? ', and ' + fmt(p.blocked) + ' is held by a day that does not match' : '') +
        '.</div>');
    }

    /*
      The cards. Plain words, and only what this page can act on. "In the pool altogether"
      and "Zed's side of the pool" used to sit here: both were true and neither was
      actionable on a page whose whole job is "what do I send, and what is stopping me".

      READY TO SEND is deliberately the sum of pend[].net — the SAME figures the Settle
      buttons below show — not pool.ready. pool.ready is the gross entitlement before its
      ACH fee (by design, for the Control & Checks KPI), and pool.wire only nets off ONE
      ACH fee, which is wrong the moment more than one day is ready at once. Summing what
      each button will actually send is correct in every case and can never disagree with
      the panel directly under it.
    */
    var readyTotal = readyNow();
    var unapproved = pend.filter(function (r) { return !String(r.approvalAt || '').trim(); });
    var cards = [['READY TO SEND', fmt(belowMin ? p.ready : readyTotal),
        pend.length ? pend.length + ' transfer(s) waiting on you'
          : (belowMin ? 'held \u2014 under the ' + fmt(settings().minTransfer) + ' minimum'
            : 'nothing due'), 0],
      ['WAITING ON THE BANK', fmt(p.pending),
        await_.length ? await_.length + ' day(s) — type the deposit' : 'all deposits in', 0],
      ['NEEDS FIXING', fmt(p.blocked),
        mism.length ? mism.length + ' day(s) do not match' : 'nothing stuck', 0],
      /*
        This was NEXT TRANSFER DAY, which never changes during a day's work and is already
        written under the figure in the rail. The thing an operator actually has to know
        here is where each ready day sits in the two-step order — the sheet goes to eNovate
        first, and the wire only after they come back — so the card is the step that is
        waiting on somebody.
      */
      ['TO SEND FOR APPROVAL', fmt(sum(unapproved, function (r) { return r.net; })),
        pend.length
          ? (unapproved.length
            ? unapproved.length + ' day(s) — send the sheet first'
            : 'all sent \u00b7 waiting on eNovate')
          : 'nothing to approve', 0]];
    if (Number(p.rem) > 0) {
      cards.push(["REMAINING AMOUNT IN THE POOL", fmt(p.rem),
        'recovered, stays with Zed\u2019s', 1]);
    }

    return strip(cards) + versionWarning() + out +
      '<div class="g2">' + weekStrip() + recentlySent(d) + '</div>' + trend(d);
  }

  /* If the deployment is still serving v25.8, every link figure on this page is wrong by
     the fee. Say it once, loudly, at the top of the page the operator lives on. */
  function versionWarning() {
    if (feeInside()) return '';
    return '<div class="alert"><b>This portal is v26 but the sheet is running an older ' +
      'engine.</b> In v25.9 the ' + fmt(linkFee()) + ' link fee is INSIDE the amount you ' +
      'type on Payments; the old engine adds it on top. Until you paste Code.gs v25.9 and ' +
      'publish <b>Deploy &gt; Manage deployments &gt; edit &gt; Version: New version</b>, ' +
      'every link amount and every expected deposit shown here is ' + fmt(linkFee()) +
      ' per link out. The figures in the book itself are unaffected.</div>';
  }

  /* "bank + Paymob kept = expected?" worked out as the boxes are typed in, so the mistake of
     typing the full amount as the deposit AND the deduction beside it shows before Save. */
  function depCheck(dep, fee, expected, kept) {
    var d = Number(dep), f = Number(fee) || 0, x = Number(expected), k = Number(kept) || 0;
    if (dep === '' || dep === null || dep === undefined || isNaN(d) || (!d && !f)) return '';
    var gap = Math.round((d + f + k - x) * 100) / 100;
    if (gap === 0) return '<b style="color:' + C.ok + '">\u2713 matches</b> \u00b7 ';
    return '<b style="color:' + C.bad + '">' + fmt(d) + (f ? ' + ' + fmt(f) : '') + ' is ' +
      fmt(Math.abs(gap)) + (gap > 0 ? ' over' : ' short') + '</b> \u00b7 ';
  }
  /* The deposit entry rows. One list, one Save, one recalculation — entering a week one day
     at a time was a page rebuild per day and invited a half-finished backlog. */
  function depositRows(rows) {
    var today = iso(new Date());
    return '<div class="dephead" style="display:flex;gap:6px;font-size:10.5px;letter-spacing:.06em;' +
      'text-transform:uppercase;color:' + C.muted + ';padding:0 0 4px 0">' +
      '<span style="width:120px"></span><span style="width:150px">In the bank \u00b7 statement</span>' +
      '<span>Paymob kept \u00b7 if any</span></div><div>' + rows.map(function (r) {
      /*
        A DAY THAT HAS NOT HAPPENED YET CANNOT HAVE A BANK DEPOSIT.

        A link paid today is deposited tomorrow, so tomorrow's row appears here as soon as
        the link is imported — before the money exists. Typing a figure into it, or filling
        it with the expected one, tells the book that cash landed which has not, and opens a
        transfer against it. The row stays visible because it is genuinely what is coming,
        but it says so, and Fill with expected leaves it alone.
      */
      var future = r.date > today;
      var tDep = S.typed['dep:' + r.date], tFee = S.typed['fee:' + r.date];
      if (tDep !== undefined) r = Object.assign({}, r, { current: tDep });
      if (tFee !== undefined) r = Object.assign({}, r, { fee: tFee });
      /* What should land: the link amounts, less the VAT Paymob kept on each, less the
         account charge typed beside it — worked out again as the charge is typed. (v26.16) */
      var land = Math.round((Number(r.expected) - Number(r.vatKept || 0) - Number(r.payout || 0) -
        Number(r.fee || 0)) * 100) / 100;
      return '<div class="dep" data-exp="' + Number(r.expected).toFixed(2) + '" data-kept="' +
        (Number(r.vatKept || 0) + Number(r.payout || 0)).toFixed(2) + '" data-payout="' +
        Number(r.payout || 0).toFixed(2) + '"><span class="dd">' + esc(r.date) + '</span>' +
        '<span style="color:' + C.muted + ';font-size:11px;width:30px">' + dow(r.date) +
        '</span><input type="number" step="0.01" inputmode="decimal"' +
        /* A day that has not come yet cannot have a deposit: the box is shut, and says when
           it opens, instead of taking a figure that Save then refuses. (v26.20) */
        (future ? ' readonly disabled title="Opens on ' + esc(dow(r.date) + ' ' + dm(r.date)) +
          ' \u2014 the money is not in the bank before then"' : (canWrite() ? '' : ' readonly')) + ' data-dep="' +
        esc(r.date) + '" placeholder="' + fmt(land) + '" value="' +
        (tDep !== undefined ? esc(tDep) : (r.current ? Number(r.current).toFixed(2) : '')) + '">' +
        /* What Paymob kept back from this payout, if it did — its 125.00 half-month charge.
           Optional; the day matches when deposit + this = expected. (v26.6) */
        '<input type="number" step="0.01" inputmode="decimal"' + (canWrite() ? '' : ' readonly') +
        ' data-fee="' + esc(r.date) +
        '" placeholder="Paymob kept (if any)" title="Paymob payout deduction, if the statement shows ' +
        'one (Zed\u2019s cost)" style="width:96px;margin-left:6px" value="' +
        (tFee !== undefined ? esc(tFee) : (Number(r.fee) > 0 ? Number(r.fee).toFixed(2) : '')) + '">' +
        '<span class="xp">' + (future
          ? '<b style="color:' + C.warn + '">not until ' + esc(dow(r.date)) + '</b> \u00b7 '
          : '') + '<span class="depchk">' + depCheck(r.current, r.fee, r.expected,
          Number(r.vatKept || 0) + Number(r.payout || 0)) + '</span>' +
        '<span class="depland">should land <b>' + fmt(land) + '</b>' +
        (Number(r.vatKept) > 0 || Number(r.fee) > 0 || Number(r.payout) > 0
          ? ' <span style="opacity:.7">(links ' + fmt(r.expected) +
          (Number(r.vatKept) > 0 ? ' \u2212 VAT ' + fmt(r.vatKept) : '') +
          (Number(r.payout) > 0 ? ' \u2212 payout ' + fmt(r.payout) : '') +
          (Number(r.fee) > 0 ? ' \u2212 Paymob ' + fmt(r.fee) : '') + ')</span>' : '') + '</span>' +
        (r.links ? ' \u00b7 ' + int(r.links) + ' link(s)' : '') + '</span></div>';
    }).join('') + '</div>' +
      '<div class="acts" style="margin-top:14px">' +
      '<button class="btn btn-primary" data-act="savedeps"' +
      (S.acting || !canWrite() ? ' disabled' : '') + '>Save these deposits</button>' +
      '<button class="btn btn-ghost" data-act="fillexpected"' + (!canWrite() ? ' disabled' : '') +
      '>Fill with expected</button>' +
      '</div>' +
      '<p class="note">' + ic('info') + '<span>The expected figure is the total of the ' +
      '<b>link amounts as sent</b> for that day, with the ' + fmt(linkFee()) +
      ' fee inside each one — that is exactly what Paymob deposits. It is NOT the debt ' +
      'collected.</span></p>';
  }

  function recentlySent(d) {
    // Same reasoning as the week strip: the last transfers that actually went out are not
    // a fact about the range you are looking at.
    var sent = (d.recent || sentDays()).slice(-6).reverse();
    if (!sent.length) {
      return panel('Recently sent',
        '<div class="loading" style="padding:22px">No transfer has been sent yet.</div>');
    }
    return panel('Recently sent', '<p class="note" style="margin:0 0 10px">' + ic('info') +
      '<span>Everything about a sent transfer — the payments it carried, the partner split, ' +
      'the eNovate Settlement email, and <b>Undo</b> — is on <a class="lk" data-go="remit" ' +
      'style="color:' + C.tealDeep + ';font-weight:600">eNovate Settlement</a>.</span></p>' +
      '<div class="scroll"><table class="data"><thead><tr>' +
      th('Day') + th('Sent', 1) + th('ACH', 1) + th('Margin', 1) + th('Transferred at') +
      '</tr></thead><tbody>' + sent.map(function (r) {
        return '<tr><td class="num">' + esc(r.date) + '</td>' +
          '<td class="right num" style="font-weight:600;color:' + C.tealDeep + '">' +
          fmt(r.net) + '</td><td class="right num">' + fmt(r.ach) + '</td>' +
          '<td class="right num" style="color:' + C.muted + '">' + fmtN(r.achMargin) + '</td>' +
          '<td class="num" style="font-size:11px;color:' + C.muted + '">' +
          esc(r.loggedAt || '\u2014') + '</td></tr>';
      }).join('') + '</tbody></table></div>');
  }

  /* The confirmation boxes. Their figures come from apiPreviewSettlement, i.e. from the
     live model, not from whatever this screen last rendered — the screen can be a minute
     stale and the money cannot. */
  function modalHtml() {
    /*
      A PRESS HAS TO LOOK LIKE A PRESS.

      Send and "Confirm and send" used to close their box the instant they were clicked and
      leave the page looking exactly as it did before, while the request ran for a few
      seconds in the background. From the operator's side that is indistinguishable from a
      click that missed — so the natural thing to do is press it again, on the one action
      where pressing twice is the last thing anybody wants.

      So the box stays up and says what it is doing until the sheet answers. It cannot be
      dismissed by the veil, by Escape or by anything else: it comes down when the action
      comes back, and the toast that follows says how it went.
    */
    if (S.sending) {
      /*
        An amount and an address are not the same kind of thing and cannot wear the same
        type. The big gold monospace is for money — it is read at a glance and it is short.
        An address is neither, so it gets ordinary weight, a size that yields on a narrow
        screen, and permission to wrap rather than running off the edge of the box.
      */
      var subject = S.sending.amount
        ? '<div class="big num">' + esc(S.sending.amount) + '</div>'
        : (S.sending.to
          ? '<div style="margin-top:7px;font-size:15.5px;font-weight:600;color:#DCEDED;' +
            'line-height:1.4;word-break:break-word">' + esc(S.sending.to) + '</div>'
          : '');
      return '<div class="veil" id="veil"><div class="modal" style="max-width:400px">' +
        '<div class="mh" style="padding:18px 24px">' +
        '<div class="eb">' + esc(S.sending.eb) + '</div>' + subject + '</div>' +
        '<div class="mb" style="display:flex;gap:14px;align-items:center;padding:20px 24px 24px">' +
        '<span class="spin spinBig" style="flex:0 0 auto"></span>' +
        '<span style="font-size:13px;line-height:1.55">' + esc(S.sending.note) +
        '<br><b>Do not press again.</b></span></div></div></div>';
    }
    if (S.imp) return importModal();
    var v = S.modal;
    if (!v) return '';

    /* Sending is its own small dialog rather than a one-click button, because the two
       things most often needed are the two a button cannot do: send it again when it did
       not arrive, and send it to somebody else. */
    if (v.kind === 'remit') {
      /* The same sheet does both jobs, so the dialog names the job it is doing. Before the
         transfer is logged it is a request for eNovate's approval of money that has not
         moved; afterwards it is the advice note for a wire that has. The engine decides
         which by the transferred stamp, not by anything typed here. */
      var pre = !v.wired;
      return '<div class="veil" id="veil"><div class="modal">' +
        '<div class="mh"><div class="eb">' +
        (pre ? 'For eNovate\u2019s approval \u00b7 ' : 'Advice note \u00b7 transferred ') +
        esc(v.day) + '</div>' +
        '<div class="big num">' + fmt(v.net) +
        '<span style="font-size:13px;margin-left:8px">EGP</span></div></div><div class="mb">' +
        '<div class="frm"><div class="fld"><label>Send to</label>' +
        '<input id="rmTo" type="text" style="width:300px" value="' + esc(v.to || '') +
        '" placeholder="name@company.com"></div></div>' +
        (pre
          ? '<p class="note">' + ic('info') + '<span>Sends the sheet of <b>which drivers ' +
            'paid</b> and <b>what eNovate is owed</b> — it says clearly that nothing has ' +
            'been transferred yet and asks them to confirm. Settle only after they ' +
            'approve.</span></p>'
          : '<p class="note">' + ic('info') + '<span>The advice note for a transfer already ' +
            'logged. Two sheets attached. <b>Sending this does not touch the approval ' +
            'stamp</b> for the day.</span></p>') +
        '<p class="note">' + ic('info') + '<span>Commas for several addresses. Sending again ' +
        'is safe.</span></p></div>' +
        '<div class="mf"><button class="btn btn-ghost" data-act="closemodal">Cancel</button>' +
        '<button class="btn btn-accent" data-act="remitsend" data-day="' + esc(v.day) + '"' +
        (S.acting ? ' disabled' : '') + '>' + ic('send') +
        (pre ? 'Send for approval' : 'Send the advice note') + '</button></div></div></div>';
    }

    /*
      UNDOING A TRANSFER LOGGED BY MISTAKE.

      This is the only destructive action in the portal, so it is the only one behind a
      confirmation that spells out exactly what it touches: the transferred stamp, and
      nothing else. It cannot change an amount, because no amount is stored — the transfer
      is derived as cumulative entitlement minus what has been sent, so clearing the stamp
      makes that entitlement unsent again and it goes out with the next wire.

      What it does NOT do is recall money from the bank. If the wire really left, undoing
      the log will make the engine send it a second time. That sentence is on the dialog for
      the same reason.
    */
    if (v.kind === 'unlog') {
      return '<div class="veil" id="veil"><div class="modal">' +
        '<div class="mh" style="background:linear-gradient(150deg,#7A2222,#4E1010)">' +
        '<div class="eb" style="color:#FFC9C6">Undo the log \u00b7 ' + esc(v.day) + '</div>' +
        '<div class="big num" style="color:#FFD9A8">' + fmt(v.net) +
        '<span style="font-size:13px;margin-left:8px">EGP</span></div></div>' +
        '<div class="mb">' +
        '<div class="ln"><span class="k">Marked transferred</span><span class="v">' +
        esc(v.loggedAt || '\u2014') + '</span></div>' +
        '<div class="ln"><span class="k">What this changes</span>' +
        '<span class="v">the transferred stamp, and nothing else</span></div>' +
        '<div class="alert" style="margin-top:14px">Use this only when the wire was ' +
        '<b>never actually sent</b>. The amount is not stored anywhere — it is derived — so ' +
        'clearing the stamp makes this entitlement unsent again and the next transfer will ' +
        'include it. If the money really did leave the bank, undoing the log will pay ' +
        'eNovate twice.</div>' +
        '<p class="note">' + ic('info') + '<span>Nothing else moves: no deposit, no trip, no ' +
        'Remaining Amount, no driver balance. Settle the day again once it is right.</span></p>' +
        '</div>' +
        '<div class="mf"><button class="btn btn-ghost" data-act="closemodal">Keep it</button>' +
        '<button class="btn btn-danger" data-act="confirmunlog" data-day="' + esc(v.day) +
        '"' + (S.acting ? ' disabled' : '') + '>' + ic('undo') +
        'Clear the log for ' + esc(v.day) + '</button></div></div></div>';
    }

    if (!v.ok) {
      return '<div class="veil" id="veil"><div class="modal">' +
        '<div class="mh" style="background:#5B1010"><div class="eb" style="color:#FFC9C6">' +
        'Cannot settle</div><div style="font-size:19px;font-weight:600;margin-top:6px">' +
        esc(v.message || 'Not ready') + '</div></div>' +
        '<div class="mf"><button class="btn btn-ghost" data-act="closemodal">Close</button>' +
        '</div></div></div>';
    }
    var lines = [
      ['Commission, fees & VAT collected', fmt(v.matched), 0, 0],
      ["Zed's commission", fmt(v.zedsCommission), 0, 0],
      ['Payment link fee \u00b7 our half', fmt(v.zedsLinkFee), 0, 0],
      ["ZED'S REVENUE — retained", fmt(v.zedsRevenue), 1, 0],
      ['eNovate share of the debt', fmt(v.enovShare), 0, 0],
      ['Payment link fee \u00b7 their half', fmt(v.enovFee), 0, 0],
      ['Caught up from earlier days', fmt(v.catchup), 0, 0],
      ['GROSS DUE TO eNOVATE', fmt(v.gross), 1, 0],
      ['Less ACH charged to eNovate', '\u2212 ' + fmt(v.ach), 0, 0]
    ];
    return '<div class="veil" id="veil"><div class="modal">' +
      '<div class="mh"><div class="eb">Confirm the transfer \u00b7 ' +
      esc(dow(v.day) + ' ' + v.day) + '</div>' +
      '<div class="big num">' + fmt(v.net) +
      '<span style="font-size:13px;margin-left:8px">EGP TO eNOVATE</span></div>' +
      '<div style="font-size:12px;color:#A9CFD0;margin-top:8px">' + int(v.links) +
      ' payment(s), covering cash landed after ' + esc(v.coversFrom) + '</div></div>' +
      '<div class="mb">' + lines.map(function (l) {
        return '<div class="ln' + (l[2] ? ' key' : '') + '"><span class="k">' + l[0] +
          '</span><span class="v">' + l[1] + '</span></div>';
      }).join('') +
      '<div class="ln key"><span class="k">NET LEAVING THE ACCOUNT</span><span class="v">' +
      fmt(v.net) + '</span></div>' +
      (Number(v.rem) > 0
        ? '<div class="ln chg"><span class="k">Remaining Amount recovered that day — ' +
          'stays with Zed\u2019s, <b>not</b> in the wire</span><span class="v">' +
          fmt(v.rem) + '</span></div>' : '') +
      '<div class="ln"><span class="k">Bank charge on this transfer</span>' +
      '<span class="v">' + fmtN(v.achCost) + '</span></div>' +
      '<div class="ln"><span class="k">ACH margin retained</span><span class="v" style="color:' +
      (v.achMargin !== null && Number(v.achMargin) < 0 ? C.bad : C.ok) + '">' +
      fmtN(v.achMargin) + '</span></div>' +
      '<div class="frm" style="margin-top:16px">' +
      '<div class="fld"><label>Override the bank charge \u00b7 optional</label>' +
      '<input id="mAch" type="number" step="0.01" inputmode="decimal" placeholder="' +
      (v.achCost === null ? 'not known' : Number(v.achCost).toFixed(2)) + '"></div></div>' +
      /*
        The order-of-business check, stated at the last possible moment.

        It BLOCKS by default: Confirm is disabled until the approval sheet has gone out,
        because clicking past a warning is exactly how a wire gets sent before eNovate has
        seen it. But it is not absolute — approval by phone is still approval, and a book
        that cannot record a wire which really left is a worse problem than a skipped
        email. So an explicit override sits next to it, which the operator has to tick
        deliberately, and which says what it means.
      */
      (String(v.approvalAt || '').trim()
        ? '<p class="note">' + ic('tick') + '<span>Approval sheet went to eNovate <b>' +
          esc(v.approvalAt) + '</b>. Only settle once they have come back to you.</span></p>'
        : '<div class="alert" style="margin-top:14px"><b>eNovate has not been sent this ' +
          'day yet.</b> The agreed order is to send them the sheet, wait for their ' +
          'approval, and then settle. Close this and use <b>Send for approval</b> first.' +
          '<label style="display:flex;align-items:center;gap:8px;margin-top:10px;' +
          'font-weight:600;cursor:pointer"><input type="checkbox" data-act="ovrappr"' +
          (S.apprOverride ? ' checked' : '') + '> They already approved it another way ' +
          '(phone, WhatsApp, in person)</label></div>') +
      '<p class="note">' + ic('info') + '<span>A settlement note goes to <b>' +
      esc(v.emailTo || '(no address set)') + '</b> with the sheet attached.</span></p></div>' +
      '<div class="mf"><button class="btn btn-ghost" data-act="closemodal">Cancel</button>' +
      (v.achMargin !== null && Number(v.achMargin) < 0
        ? '<span class="tag no" style="align-self:center;margin-right:auto">Margin is ' +
          'negative — the bank costs more than the ' + fmt(achFee()) + ' charged</span>' : '') +
      '<button class="btn btn-accent" data-act="confirmsettle" data-day="' + esc(v.day) +
      '"' + ((S.acting || !settleAllowed(v)) ? ' disabled' : '') + '>' + ic('send') +
      'Confirm and send</button>' +
      '</div></div></div>';
  }

  /*
    Settling is permitted once eNovate has actually been sent the sheet — or once the
    operator has explicitly stated they approved it by another route. Keeping this in one
    named function means the button's disabled state and any future check cannot drift
    apart from each other.
  */
  function settleAllowed(v) {
    if (String(v.approvalAt || '').trim()) return true;
    return !!S.apprOverride;
  }

  /* ==================================================================== REMAINING AMOUNT
    Its own page, because it is its own money and mixing it into the revenue screens is
    exactly the mistake this version exists to prevent.

    What it is: a rider is owed change the driver cannot break, so the platform credits it
    to the rider's wallet and the DRIVER owes it back. It is not revenue — it is Zed's own
    cash advanced on his behalf. No commission, no VAT, no eNovate share. It does not count
    toward the 200.00 block threshold, and it is collected on the same payment link.
  ==================================================================================== */
  function pgChange(d) {
    var k = K();
    var advanced = Number(k.remEarned || 0), recovered = Number(k.remRecovered || 0);
    var open = Number(k.remOpen || 0), held = Number(k.remHeld || 0);
    var owing = ((d.drivers) || []).filter(function (r) {
      return Number(r.remOpen) > 0;
    }).length;

    /*
      RECOVERY % NEEDS A CONSISTENT BASE.

      `advanced` is scoped to the date range on screen. `recovered` is not — it includes
      money collected in this range against advances made BEFORE it. Dividing one by the
      other produced figures like 1,287.5%, which is visibly wrong and makes every other
      number on the page look suspect.

      The honest denominator is the whole obligation these balances describe: what has come
      back, plus what is still owed, plus what is held on disputed trips. All three are
      driver balances measured the same way, so the ratio cannot exceed 100%.
    */
    var recoveryBase = recovered + open + held;
    var cards = [['ADVANCED TO RIDERS', fmt(advanced), 'in this range', 1],
      ['RECOVERED FROM DRIVERS', fmt(recovered), 'back in the account', 1],
      ['STILL OWED', fmt(open), 'across every driver', 1],
      ['DRIVERS OWING', int(owing), 'still carrying a balance', 1],
      ['HELD ON DISPUTED TRIPS', fmt(held), 'not being chased', 1],
      ['RECOVERY %', recoveryBase > 0 ? pct(recovered / recoveryBase * 100) : '\u2014',
        'of everything advanced', 0]];

    var out = strip(cards);

    // ---- by driver, only the ones who have any
    var withChange = ((d.drivers) || []).filter(function (r) {
      return Number(r.remEarned) > 0 || Number(r.remOpen) > 0;
    });
    if (withChange.length) {
      withChange.sort(function (a, b) { return Number(b.remOpen) - Number(a.remOpen); });
      var t = { a: 0, c: 0, o: 0 };
      out += panel('By driver',
        '<div class="scroll list"><table class="data" id="tblChange"><thead><tr>' +
        th('Driver') + th('Advanced', 1) + th('Recovered', 1) + th('Still owed', 1) +
        th('Commission, fees & VAT open', 1) + th('Owes altogether', 1) + th('Status', 1) +
        '</tr></thead><tbody>' + withChange.map(function (r) {
          t.a += Number(r.remEarned); t.c += Number(r.remCollected); t.o += Number(r.remOpen);
          var cls = r.status === 'Blocked' ? 'bad' : (r.status === 'Owing' ? 'wait' : 'good');
          return '<tr data-k="' + esc([r.id, r.name].join(' ').toLowerCase()) + '">' +
            '<td style="font-weight:500"><a class="lk" data-act="driver" data-v="' +
            esc(r.id) + '">' + esc(r.name) + '</a><span class="num" style="color:' +
            C.muted + ';font-size:10.5px;margin-left:8px">' + esc(r.id) + '</span></td>' +
            '<td class="right num chg">' + fmt(r.remEarned) + '</td>' +
            '<td class="right num">' + fmt(r.remCollected) + '</td>' +
            '<td class="right num chg" style="font-weight:600">' + fmt(r.remOpen) + '</td>' +
            '<td class="right num" style="color:' + C.muted + '">' + fmt(r.outstanding) +
            '</td>' +
            '<td class="right num" style="font-weight:600">' + fmt(r.owedTotal) + '</td>' +
            '<td class="right"><span class="bdg ' + cls + '">' + esc(r.status) +
            '</span></td></tr>';
        }).join('') +
        '<tr class="tot"><td>TOTAL</td><td class="right num">' + fmt(t.a) +
        '</td><td class="right num">' + fmt(t.c) + '</td><td class="right num">' + fmt(t.o) +
        '</td><td></td><td></td><td></td></tr></tbody></table></div>' +
        hardNote('<b>Owes altogether</b> is the two balances added \u2014 what a driver ' +
          'actually owes us. The <b>Status</b> column reads the same figure: at or above ' +
          'the threshold he is Blocked and a link goes out.'), withChange.length + ' driver(s)');
    } else {
      out += empty('By driver', 'No Remaining Amount on any trip in this range.');
    }

    // ---- the trips that carried it
    var tr = ((d.trips) || []).filter(function (x2) { return Number(x2.rem) > 0; });
    if (tr.length) {
      out += panel('The trips it came from',
        '<div class="scroll list"><table class="data"><thead><tr>' +
        th('Trip') + th('Date') + th('Driver') + th('Rider fare', 1) +
        th('Commission, fees & VAT', 1) + th('Change advanced', 1) + th('Change recovered', 1) +
        th('Owed on the trip', 1) + th('Status') + '</tr></thead><tbody>' +
        tr.slice().reverse().map(function (x2) {
          return '<tr' + (x2.dispute ? ' class="dim"' : '') + '>' +
            '<td class="num">' + esc(x2.id) + '</td>' +
            '<td class="num">' + esc(x2.date) + '</td>' +
            '<td>' + esc(x2.name || x2.driver) + '</td>' +
            '<td class="right num">' + fmt(x2.gross) + '</td>' +
            '<td class="right num">' + fmt(x2.debt) + '</td>' +
            '<td class="right num chg" style="font-weight:600">' + fmt(x2.rem) + '</td>' +
            '<td class="right num">' + fmt(x2.remCollected) + '</td>' +
            '<td class="right num" style="font-weight:600">' + fmt(x2.owed) + '</td>' +
            '<td><span class="bdg ' + (x2.dispute ? 'bad'
              : (x2.status === 'Settled' ? 'good' : 'wait')) + '">' +
            esc(x2.dispute ? 'On hold' : x2.status) + '</span></td></tr>';
        }).join('') + '</tbody></table></div>', tr.length + ' trip(s)');
    }

    return out;
  }

  /* ------------------------------------------------------------------ REVENUE */
  function pgRevenue(d) {
    var rv = d.revenue;
    if (!rv) {
      return empty('Revenue split',
        'This Apps Script deployment is running an engine older than v15, which does not ' +
        'send the revenue split. Paste the current Code.gs and publish a NEW VERSION of ' +
        'the deployment.');
    }
    var e = rv.earned, lk = rv.links, bk = rv.bank;
    var row = function (label, o, bold) {
      return '<tr' + (bold ? ' class="tot"' : '') + '><td' +
        (bold ? ' style="font-weight:600"' : '') + '>' + esc(label) + '</td>' +
        ['total', 'ssg', 'traffic', 'enov', 'zeds'].map(function (k2) {
          var v = o[k2];
          return '<td class="right num"' +
            (k2 === 'zeds' ? ' style="font-weight:600;color:' + C.tealDeep + '"' : '') + '>' +
            (v === 0 && k2 !== 'total' ? '\u2014' : fmt(v)) + '</td>';
        }).join('') + '</tr>';
    };
    var earned = panel('Earned from trips — the driver debt',
      '<div class="scroll"><table class="data"><thead><tr>' + th('Component') +
      th('Total', 1) + th('SSG', 1) + th('Traffic Dept', 1) + th('eNovate own', 1) +
      th("Zed's", 1) + '</tr></thead><tbody>' +
      row('Service commission', e.commission) +
      row('Fixed platform fee', e.fixed) +
      row('VAT (on the eNovate slice only)', e.vat) +
      row('COMMISSION, FEES & VAT', e.debt, 1) +
      '</tbody></table></div>' +
      hardNote('The Governorate (SSG) and the Traffic Department are <b>inside</b> the ' +
        'eNovate amount. eNovate receives one lump sum and distributes them onward — a ' +
        'separate transfer to either of them would be paying twice. The full eNovate file ' +
        'is on <a class="lk" data-go="remit" style="color:' + C.tealDeep +
        ';font-weight:600">eNovate Settlement</a>.') +
      hardNote('<b>The DRIVER DEBT line is exact; a component line above it can sit a ' +
        'piaster apart from its own parts.</b> The rounding is done where the money ' +
        'actually moves — on each party\u2019s total — so Zed\u2019s share and the eNovate ' +
        'share are right to the piaster and the leftover has to land inside one of the ' +
        'components. It cancels out by the time you reach the debt line, which is the line ' +
        'a transfer is built from.'));

    var collected = panel('Collected on the payment links',
      '<div class="scroll"><table class="data"><thead><tr>' + th('Line') + th('Total', 1) +
      th('eNovate', 1) + th("Zed's", 1) + '</tr></thead><tbody>' +
      [['Share of the collected debt', lk.collectedDebt, lk.collectedEnov, lk.collectedZeds, 0],
       ['Payment link fees (inside each link)', lk.total, lk.enov, lk.zeds, 0],
       ['TOTAL FROM THE LINKS', Number(lk.collectedDebt) + Number(lk.total),
        Number(lk.collectedEnov) + Number(lk.enov),
        Number(lk.collectedZeds) + Number(lk.zeds), 1]]
        .map(function (r) {
          return '<tr' + (r[4] ? ' class="tot"' : '') + '><td' +
            (r[4] ? ' style="font-weight:600"' : '') + '>' + esc(r[0]) + '</td>' +
            '<td class="right num">' + fmt(r[1]) + '</td>' +
            '<td class="right num">' + fmt(r[2]) + '</td>' +
            '<td class="right num" style="font-weight:600;color:' + C.tealDeep + '">' +
            fmt(r[3]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
      hardNote('The fee is <b>inside</b> the link amount support sends, not added to it. ' +
        'From 12 Oct 2026 it is <b>2.00</b>: the declared 1.50, split 0.75 / 0.75 with ' +
        'eNovate, plus 0.50 that is Zed\u2019s own. A link of ' + fmt(202) + ' carries ' +
        fmt(200) + ' of cash. Links sent before keep their 1.50.'));

    /*
      ZED'S REVENUE, LINE BY LINE.  (v26.18)  What Zed's earns, then what Paymob and the bank
      take back, then what is left. Every figure is the engine's; nothing is worked out here
      but the layout.
    */
    var kr = K();
    var revLines = [
      ['Zed\u2019s commission', kr.zedsRel, 'its share of the commission, fees & VAT collected', 0],
      ['+ Link fees: our half of the declared 1.50', kr.zedsFeesDeclared, '0.75 a link', 0],
      ['+ Link fees: our own 0.50', kr.zedsFeesUndeclared, 'on links sent from 12 Oct', 0],
      ['+ ACH margin', kr.zedsAchMargin === null ? 0 : kr.zedsAchMargin, 'none from 12 Oct: the bank charges the full 50.00', 0],
      ['ZED\u2019S GROSS REVENUE', kr.zedsGross, '', 1],
      ['\u2212 VAT Paymob keeps on its fees', -Number(kr.paymobVat || 0), 'per payment, from Paymob\u2019s report', 0],
      ['\u2212 Paymob payout fee', -Number(kr.paymobPayout || 0), '3.00 a payout, from 12 Oct', 0],
      ['\u2212 Other Paymob deductions', -Number(kr.paymobFees || 0), 'typed on Settle', 0],
      ['ZED\u2019S NET REVENUE', kr.zedsGrand, '', 2]];
    var bank = panel('Zed\u2019s revenue \u2014 how it adds up',
      '<div class="scroll"><table class="data"><tbody>' +
      revLines.map(function (r) {
        var strong = r[3] > 0;
        return '<tr' + (strong ? ' class="tot"' : '') + '><td' +
          (strong ? ' style="font-weight:600"' : '') + '>' + esc(r[0]) +
          (r[2] ? '<div style="font-size:11px;color:' + C.muted + ';font-weight:400">' + esc(r[2]) + '</div>' : '') +
          '</td><td class="right num" style="font-weight:600;color:' +
          (r[3] === 2 ? C.tealDeep : (Number(r[1]) < 0 ? C.bad : C.ink)) + '">' + fmt(r[1]) +
          '</td></tr>';
      }).join('') + '</tbody></table></div>');

    var k = K(), p2p = pool();
    var cards = [["Zed's commission", fmt(k.zedsRel), 'on collected debt', 0],
      ['Link fees \u00b7 ours', fmt(k.zedsFees), 'declared half + our 0.50', 0],
      ['Paymob & bank costs', fmt(Number(k.paymobVat || 0) + Number(k.paymobPayout || 0) +
        Number(k.paymobFees || 0)), 'VAT, payout fee, deductions', 0],
      ["ZED'S NET REVENUE", fmt(k.zedsGrand), 'after Paymob, in this range', 0],
      ['eNovate entitlement', fmt(k.enovEnt), 'from landed cash', 0],
      ['Transferred', fmt(k.transferred), 'net to eNovate', 0]];

    var inAcct = panel('Sitting in the account right now',
      '<div class="scroll"><table class="data"><tbody>' +
      [['Link cash landed and not yet settled', p2p.cash, 1, 0],
       ['\u00b7 commission, fees & VAT collected', p2p.debt, 0, 0],
       ['\u00b7 Remaining Amount recovered', p2p.rem, 0, 1],
       ['\u00b7 Zed\u2019s half of the link fees', p2p.zedsFee, 0, 0],
       ['\u00b7 eNovate half of the link fees', p2p.enovFee, 0, 0],
       ['\u00b7 driver credit held — their money, not ours', p2p.credit, 0, 0],
       ["ZED'S SIDE — stays in the account", p2p.zedsTotal, 1, 0],
       ['eNOVATE SIDE — goes out', p2p.enovTotal, 1, 0]].map(function (r) {
        return '<tr' + (r[2] ? '' : ' class="dim"') + '><td' +
          (r[2] ? ' style="font-weight:600"' : ' style="padding-left:12px"') + '>' +
          esc(r[0]) + '</td><td class="right num' + (r[3] ? ' chg' : '') + '"' +
          (r[2] ? ' style="font-weight:600"' : '') + '>' + fmt(r[1]) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      hardNote('The two sides are not meant to be equal: <b>Zed\u2019s side is revenue and ' +
        'stays</b>, and the change is our own money coming home. Only the eNovate side is a ' +
        'liability. Settle it on <a class="lk" data-go="today" style="color:' + C.tealDeep +
        ';font-weight:600">the Settle page</a>.'));

    return strip(cards) + earned + collected +
      '<div class="g2">' + inAcct + bank + '</div>';
  }

  /* ------------------------------------------------------------------ HISTORY */
  function pgHistory(d) {
    var k = K();
    var cards = [['Trips', int(k.trips), '', 0], ['Rider fares', fmt(k.gross), 'EGP', 0],
      ['Debt collected', fmt(k.matched), 'from drivers', 0],
      ["Remaining Amount", fmt(k.remRecovered), 'recovered', 1],
      ["Zed's revenue", fmt(k.zedsCash), 'retained', 0],
      ['Sent to eNovate', fmt(k.transferred), int(k.transfers || 0) + ' transfers', 0],
      ['ACH margin', fmtN(k.achMargin), 'charged minus cost', 0]];
    if (Number(k.paymobFees) > 0) {
      cards.push(['Paymob deductions', fmt(k.paymobFees), 'Zed\u2019s cost, not eNovate\u2019s', 0]);
    }
    /* Guard the array itself, not just its length: a truncated or partial payload (a
       dropped connection mid-response, an action reply that carries only its own result)
       would otherwise throw here and blank the page, instead of showing the empty state
       that correctly describes "nothing to show". */
    if (!d.days || !d.days.length) {
      return strip(cards) + empty('Settlement history', 'No settlement day in this range.');
    }
    var t = { dep: 0, x: 0, vr: 0, m: 0, rm: 0, kp: 0, e: 0, f: 0, a: 0, n: 0, mg: 0, pf: 0 };
    var rows = d.days.map(function (r) {
      t.dep += +r.deposit; t.x += +r.expected; t.m += +r.matched; t.rm += +r.rem;
      t.pf += Number(r.pmFee || 0);
      /*
        THE VARIANCE TOTAL IS THE SUM OF THE VARIANCES, not "in the bank minus expected".
        The two are not the same the moment a day has links whose deposit has not been typed
        in yet: that day contributes its whole expected figure and nothing to the deposit, so
        the bottom of the column showed a large negative on a book that has nothing wrong
        with it — while the row above it correctly read "—". Only a confirmed day has a
        variance at all, which is exactly what each row already says.
      */
      t.vr += r.confirmed ? +r.variance : 0;
      t.kp += +r.zedsRevenue; t.e += +r.enov; t.f += +r.fees; t.a += +r.ach; t.n += +r.net;
      t.mg += Number(r.achMargin || 0);
      var sent = String(r.loggedAt || '').trim();
      var work = isWorkDay(r.date);
      var bd = sent ? 'good'
        : (Number(r.net) > 0 ? 'wait'
          : (r.confirmed ? (Number(r.variance) !== 0 ? 'bad' : 'mute') : 'wait'));
      return '<tr' + (work ? '' : ' class="dim"') + '><td class="num">' +
        '<a class="lk" data-act="gotoday" data-day="' + esc(r.date) + '" style="color:' +
        C.tealDeep + ';font-weight:600">' + esc(r.date) + '</a>' +
        '<span style="color:' + C.muted + ';font-size:10.5px;margin-left:7px">' +
        dow(r.date) + '</span></td>' +
        '<td class="right num">' + (r.confirmed ? fmt(r.deposit) : '\u2014') + '</td>' +
        '<td class="right num" style="color:' + C.muted + '">' +
        (Number(r.pmFee) > 0 ? fmt(r.pmFee) : '\u2014') + '</td>' +
        '<td class="right num" style="color:' + C.muted + '">' + fmt(r.expected) + '</td>' +
        '<td class="right num" style="font-weight:600;color:' +
        (Number(r.variance) === 0 ? C.ok : C.bad) + '">' +
        (r.confirmed ? fmt(r.variance) : '\u2014') + '</td>' +
        '<td class="right num">' + fmt(r.matched) + '</td>' +
        '<td class="right num chg">' + fmt(r.rem) + '</td>' +
        '<td class="right num" style="font-weight:600">' + fmt(r.zedsRevenue) + '</td>' +
        '<td class="right num" style="font-weight:600">' + fmt(r.enov) + '</td>' +
        '<td class="right num" style="color:' + C.muted + '">' + fmt(r.fees) + '</td>' +
        '<td class="right num">' + fmt(r.ach) + '</td>' +
        '<td class="right num" style="color:' + C.muted + '">' + fmtN(r.achMargin) + '</td>' +
        '<td class="right num" style="font-weight:600;color:' + C.tealDeep + '">' +
        fmt(r.net) + '</td>' +
        '<td><span class="bdg ' + bd + '">' + esc(r.state) + '</span></td>' +
        '<td class="num" style="color:' + C.muted + ';font-size:11px">' +
        esc(sent || '\u2014') + '</td>' +
        /*
          The advice note can only be sent for a day that has actually been transferred —
          there is no advice to give about a wire that has not left. An empty cell made that
          read as the button randomly missing.
        */
        '<td class="right">' + (sent
          ? '<button class="btn btn-ghost" style="height:28px;padding:0 10px;' +
            'font-size:11.5px" data-act="remitask" data-day="' + esc(r.date) +
            '" data-net="' + Number(r.net).toFixed(2) + '"' +
            (S.acting || !canWrite() ? ' disabled' : '') + '>' + ic('send') + 'Advice</button>'
          : '<span style="color:' + C.muted + ';font-size:11px" title="An advice note needs ' +
            'a transfer to describe. Send this day for approval on eNovate Settlement.">' +
            'not wired yet</span>') + '</td></tr>';
    }).join('');
    var tbl = '<div class="scroll list"><table class="data"><thead><tr>' +
      th('Date') + th('In the bank', 1) + th('Paymob fee', 1) + th('Expected', 1) + th('Variance', 1) +
      th('Debt collected', 1) + th("Remaining Amount", 1) + th("Zed's revenue", 1) +
      th('eNovate', 1) + th('Link fee', 1) + th('ACH charged', 1) + th('ACH margin', 1) +
      th('Sent', 1) + th('State') + th('Transferred at') + th('', 1) +
      '</tr></thead><tbody>' + rows +
      '<tr class="tot"><td>TOTAL</td><td class="right num">' + fmt(t.dep) +
      '</td><td class="right num">' + fmt(t.pf) +
      '</td><td class="right num">' + fmt(t.x) + '</td><td class="right num">' +
      fmt(t.vr) + '</td><td class="right num">' + fmt(t.m) +
      '</td><td class="right num chg">' + fmt(t.rm) + '</td><td class="right num">' +
      fmt(t.kp) + '</td><td class="right num">' + fmt(t.e) + '</td><td class="right num">' +
      fmt(t.f) + '</td><td class="right num">' + fmt(t.a) + '</td><td class="right num">' +
      fmt(t.mg) + '</td><td class="right num">' + fmt(t.n) +
      '</td><td></td><td></td><td></td></tr></tbody></table></div>' +
      hardNote('<b>Expected</b> is the total of the link amounts as sent, fee inside — ' +
        'which is what Paymob deposits. It is not the debt collected, and the two columns ' +
        'are deliberately side by side so the difference is visible.') +
      hardNote('<b>Paymob fee</b> is the payout deduction Paymob keeps back (125.00 a ' +
        'half-month). A day matches when <b>in the bank + Paymob fee = expected</b>. It is ' +
        'Zed\u2019s cost: it comes off Zed\u2019s total, never off eNovate\u2019s share or ' +
        'the transfer.');
    return strip(cards) + panel('Settlement history', tbl,
      'Click a date to focus it on Settle') + trend(d);
  }

  /* ------------------------------------------------------------------ DRIVERS */
  function pgDrivers(d) {
    if (!d.drivers || !d.drivers.length) return empty('Drivers', 'No drivers yet.');
    var t = { tr: 0, e: 0, c: 0, o: 0, ra: 0, ro: 0, cr: 0, h: 0 };
    var rows = d.drivers.map(function (r) {
      t.tr += +r.trips; t.e += +r.earned; t.c += +r.collected; t.o += +r.outstanding;
      t.ra += +r.remEarned; t.ro += +r.remOpen; t.cr += +r.credit; t.h += +r.held;
      var cls = r.status === 'Blocked' ? 'bad' : (r.status === 'Owing' ? 'wait' : 'good');
      return '<tr data-k="' + esc([r.id, r.name, r.phone || ''].join(' ').toLowerCase()) +
        '" data-s="' + esc(r.status) + '">' +
        '<td style="font-weight:500"><a class="lk" data-act="driver" data-v="' + esc(r.id) +
        '">' + esc(r.name) + '</a><span class="num" style="color:' + C.muted +
        ';font-size:10.5px;margin-left:8px">' + esc(r.id) + '</span></td>' +
        '<td class="num" style="color:' + C.soft + '">' + esc(r.phone || '\u2014') + '</td>' +
        '<td class="right num" style="color:' + C.soft + '">' + int(r.trips) + '</td>' +
        '<td class="right num">' + fmt(r.earned) + '</td>' +
        '<td class="right num">' + fmt(r.collected) + '</td>' +
        '<td class="right num" style="font-weight:600;color:' +
        (Number(r.outstanding) > 0 ? C.bad : C.ok) + '">' + fmt(r.outstanding) + '</td>' +
        '<td class="right num chg">' + fmt(r.remEarned) + '</td>' +
        '<td class="right num chg" style="font-weight:600">' + fmt(r.remOpen) + '</td>' +
        '<td class="right num">' + fmt(r.credit) + '</td>' +
        '<td class="right num">' + fmt(r.held) + '</td>' +
        '<td class="right"><span class="bdg ' + cls + '">' + esc(r.status) +
        '</span></td></tr>';
    }).join('');
    var n = function (s) { return d.drivers.filter(function (r) { return r.status === s; }).length; };
    var tbl = panel('Drivers',
      tools('drvSearch', 'tblDrivers', 'ID, name or mobile\u2026',
        [['All ' + d.drivers.length, 'all'], ['Blocked ' + n('Blocked'), 'Blocked'],
         ['Owing ' + n('Owing'), 'Owing'], ['Clear ' + n('Clear'), 'Clear']]) +
      '<div class="scroll list"><table class="data" id="tblDrivers"><thead><tr>' +
      th('Driver') + th('Mobile') + th('Trips', 1) + th('Commission, fees & VAT earned', 1) +
      th('Debt collected', 1) + th('DEBT OPEN', 1) + th('Change advanced', 1) +
      th('REMAINING OPEN', 1) + th('Credit', 1) + th('Disputed', 1) + th('Status', 1) +
      '</tr></thead><tbody>' + rows +
      '<tr class="tot"><td>TOTAL</td><td></td><td class="right num">' + int(t.tr) +
      '</td><td class="right num">' + fmt(t.e) + '</td><td class="right num">' + fmt(t.c) +
      '</td><td class="right num">' + fmt(t.o) + '</td><td class="right num chg">' +
      fmt(t.ra) + '</td><td class="right num chg">' + fmt(t.ro) +
      '</td><td class="right num">' + fmt(t.cr) + '</td><td class="right num">' + fmt(t.h) +
      '</td><td></td></tr></tbody></table></div>' +
      hardNote('<b>Two balances, tracked apart.</b> They distribute differently — the ' +
        'commission, fees & VAT splits Zed\u2019s / eNovate, the Remaining Amount comes back to ' +
        'Zed\u2019s whole — so they are never added in the money path. For BLOCKING they are ' +
        'one obligation: the ' + fmt(settings().block || 200) + ' threshold reads DEBT OPEN ' +
        '+ REMAINING OPEN, which is what the Status column shows and what a payment link ' +
        'has to collect.'));
    var top = d.drivers.slice(0, 8), max = 1;
    top.forEach(function (r) { if (+r.outstanding > max) max = +r.outstanding; });
    var bars = panel('Highest commission, fees & VAT outstanding', top.map(function (r) {
      var col = r.status === 'Blocked' ? C.red : (+r.outstanding > 0 ? C.orange : C.ok);
      return '<div class="wf"><div class="lb">' + esc(r.name) + '</div><div class="tk">' +
        '<div style="width:' + w(r.outstanding, max) + ';background:' + col + '"></div></div>' +
        '<div class="vl">' + fmt(r.outstanding) + '</div></div>';
    }).join(''));
    return tbl + bars;
  }

  /* ------------------------------------------------------------------ LINKS */
  function pgLinks(d) {
    if (!d.payments || !d.payments.length) {
      return empty('Payment links', 'No paid link in this range. Use Import a file in the ' +
        'header to bring links in from an .xlsx or .csv.');
    }
    var t = { link: 0, cash: 0, rem: 0, z: 0, e: 0, c: 0 };
    var rows = d.payments.map(function (l) {
      t.link += +l.link; t.cash += +l.cash; t.rem += +l.rem; t.z += +l.zeds;
      t.e += +l.enov; t.c += +l.credit;
      /*
        THE ROW CHECK, under the new rule. The link amount is what lands, and it has to
        break down exactly into: the Remaining Amount recovered, Zed's side, eNovate's side, and
        any driver credit. Under v25.8 this was checked against a link amount the portal had
        worked out itself by ADDING the fee; now the link amount is the given and the parts
        are what must reconcile to it.
      */
      var ok = Math.abs((+l.rem + +l.zeds + +l.enov + +l.credit) - +l.link) < 0.005;
      return '<tr data-k="' +
        esc([l.id, l.driver, l.name || '', l.paid, l.deposit].join(' ').toLowerCase()) +
        '" data-s="' + (l.tooSmall ? 'Bad' : (l.landed ? 'Deposited' : 'In transit')) + '">' +
        '<td class="num">' + esc(l.id) + '</td>' +
        '<td style="font-weight:500">' + esc(l.name || l.driver) + '</td>' +
        '<td class="right num" style="font-weight:600;color:' + C.tealDeep + '">' +
        fmt(l.link) + '</td>' +
        '<td class="right num">' + fmt(l.cash) + '</td>' +
        '<td class="num">' + esc(l.paid) + '</td>' +
        '<td class="num">' + esc(l.deposit) + '</td>' +
        '<td class="right num chg">' + fmt(l.rem) + '</td>' +
        '<td class="right num">' + fmt(l.zeds) + '</td>' +
        '<td class="right num">' + fmt(l.enov) + '</td>' +
        '<td class="right num">' + fmt(l.credit) + '</td>' +
        '<td class="right" style="color:' + (ok ? C.ok : C.bad) + '">' +
        ic(ok ? 'tick' : 'bang') + '</td>' +
        '<td class="right"><span class="bdg ' +
        (l.tooSmall ? 'bad' : (l.landed ? 'good' : 'wait')) + '">' +
        (l.tooSmall ? 'below the fee' : (l.landed ? 'In the bank' : 'In transit')) +
        '</span></td></tr>';
    }).join('');
    var landed = d.payments.filter(function (x2) { return x2.landed; }).length;
    var small = d.payments.filter(function (x2) { return x2.tooSmall; }).length;
    var chips = [['All ' + d.payments.length, 'all'], ['In the bank ' + landed, 'Deposited'],
      ['In transit ' + (d.payments.length - landed), 'In transit']];
    if (small) chips.push(['Below the fee ' + small, 'Bad']);
    return panel('Payment links',
      tools('lnkSearch', 'tblLinks', 'Link, driver or date\u2026', chips) +
      '<div class="scroll list"><table class="data" id="tblLinks"><thead><tr>' +
      th('Link') + th('Driver') + th('LINK AMOUNT SENT', 1) +
      th('Cash after the fee', 1) + th('Paid') + th('Deposit') +
      th("Remaining Amount", 1) + th("Zed's", 1) + th('eNovate', 1) + th('Credit', 1) +
      th('Foots', 1) + th('State', 1) + '</tr></thead><tbody>' + rows +
      '<tr class="tot"><td>TOTAL</td><td></td><td class="right num">' + fmt(t.link) +
      '</td><td class="right num">' + fmt(t.cash) + '</td><td></td><td></td>' +
      '<td class="right num chg">' + fmt(t.rem) + '</td><td class="right num">' + fmt(t.z) +
      '</td><td class="right num">' + fmt(t.e) + '</td><td class="right num">' + fmt(t.c) +
      '</td><td></td><td></td></tr></tbody></table></div>' +
      hardNote('<b>LINK AMOUNT SENT</b> is column D on Payments — the figure support put on ' +
        'the Paymob link, with the ' + fmt(linkFee()) + ' fee already inside it, and exactly ' +
        'what Paymob deposits. <b>Foots</b> is the row check: Remaining Amount + ' +
        'Zed\u2019s + eNovate + driver credit must equal the link amount to the piaster. ' +
        'Paymob\u2019s own commission is charged to the driver at checkout and never touches ' +
        'the account, which is why the full link amount must land in the bank.') +
      (small ? '<div class="alert" style="margin-top:10px">' + int(small) + ' link(s) are at ' +
        'or below the ' + fmt(linkFee()) + ' fee, so they carry no cash for the driver at ' +
        'all. That is a typo every time — check column D against the real Paymob link.</div>'
        : ''));
  }

  /* ==================================================================== eNOVATE
    This page answers one question — "what does eNovate get, and has it been agreed?" — for
    whatever range is on the header, and it is where the approval sheet is sent from.

    Step 1 of the agreed order lives HERE, not on Settle: eNovate is sent the sheet of who
    paid and what they are owed, they approve, and only then is the money moved on Settle.
    Sending is a partner conversation about a period; settling is a bank instruction about
    one day, and they happen hours or days apart.

    Every figure is scoped to the range. The SEND is always per settlement day, because a
    day is what eNovate approves and what one wire carries.

    THE ONE THING THIS PAGE MUST KEEP SAYING: the Governorate and the Traffic Department are
    INSIDE eNovate's single amount. This is the page where somebody would be tempted to pay
    them directly, and doing that pays twice.
  ==================================================================================== */
  function pgRemit(d) {
    var days = d.days || [], k = K();
    var due = dueDays(), wired = sentDays();
    var dueTotal = sum(due, function (r) { return r.net; });
    var wiredTotal = sum(wired, function (r) { return r.net; });

    /*
      THE CARDS HAVE TO ADD UP, AND THEY DID NOT.

      The top card was fed from revenue.earned.debt.total — the debt EARNED on the trips in
      range — while being labelled "one wire". Earned is not owed until the cash is in the
      bank, so it overstated what eNovate gets. It now reads the ENTITLEMENT.

      The three partner cards were then apportioned over due + wired days only, while the
      entitlement above them covered the whole range — so on any range holding a day that is
      neither, the three did not sum to the one they sat under. The entitlement also carries
      eNovate's half of the link fees, which had no card at all.

      Each day's three-way split is largest-remainder against that day's own eNovate share,
      so summing across every day in range gives exactly k.enovRel; adding the link fees
      gives exactly k.enovEnt. Five cards that foot, rather than four that do not.
    */
    var ent = Number(k.enovEnt || 0), feesE = Number(k.enovFees || 0);
    var own = sum(days, function (r) { return r.enovOwn; });
    var ssg = sum(days, function (r) { return r.enovSsg; });
    var trf = sum(days, function (r) { return r.enovTraffic; });

    var out = strip([
      ['TO eNOVATE — ENTITLEMENT', fmt(ent),
        'from cash in the bank, incl. SSG + Traffic', 0],
      ['eNovate, their own share', fmt(own), 'inside the entitlement', 0],
      ['Governorate (SSG)', fmt(ssg), 'inside the entitlement', 0],
      ['Traffic Department', fmt(trf), 'inside the entitlement', 0],
      ['Payment link fees, their half', fmt(feesE), 'the rest of the entitlement', 0]
    ]) + strip([
      ['DUE, NOT YET WIRED', fmt(dueTotal),
        due.length ? due.length + ' settlement day(s) in range' : 'nothing outstanding', 0],
      ['WIRED IN THIS RANGE', fmt(wiredTotal),
        wired.length ? wired.length + ' transfer(s) sent and logged' : 'no transfer yet', 0],
      ['BANK FEES ON THOSE', fmt(sum(wired, function (r) { return r.ach; })),
        'one ACH per transfer day', 0],
      ['APPROVALS SENT', int(days.filter(function (r) {
        return String(r.approvalAt || '').trim(); }).length),
        'of ' + int(due.length + wired.length) + ' day(s) with money', 0]
    ]);

    out += hardNote('The <b>entitlement</b> card is what eNovate is owed out of cash that ' +
      'has actually landed — not what was earned on the trips. Earned is not owed until the ' +
      'driver has paid. eNovate earned ' + fmt(k.enovEarned) + ' on the trips in this range, ' +
      'and ' + fmt(Number(k.enovEarned || 0) - Number(k.enovRel || 0)) +
      ' of that is still sitting on the drivers.') +
      hardNote('The four cards under it foot to it exactly: eNovate\u2019s own share + the ' +
        'Governorate + the Traffic Department is their share of the collected debt, and ' +
        'adding their half of the payment link fees gives the entitlement.');

    // ---- STEP 1. The approval sheet, per day, for everything still unwired in range.
    if (due.length) {
      out += panel('Send eNovate the approval sheet',
        '<p class="note" style="margin:0 0 12px">' + ic('info') +
        '<span>Sends the sheet of <b>which drivers paid</b> and <b>what eNovate is owed</b>, ' +
        'saying plainly that nothing has moved yet. Settle the day on <a class="lk" ' +
        'data-go="today" style="color:' + C.tealDeep + ';font-weight:600">Settle</a> only ' +
        'after they approve. One email per settlement day — that is what they sign off and ' +
        'what one wire carries.</span></p>' +
        '<div class="scroll"><table class="data"><thead><tr>' +
        th('Settlement day') + th('To eNovate', 1) + th('Their own', 1) +
        th('Governorate', 1) + th('Traffic', 1) + th('Approval') + th('', 1) +
        '</tr></thead><tbody>' +
        due.map(function (r) {
          var appr = String(r.approvalAt || '').trim();
          return '<tr><td class="num">' + esc(r.date) + ' <span style="color:' + C.muted +
            ';font-size:10.5px">' + dow(r.date) + '</span></td>' +
            '<td class="right num" style="font-weight:600;color:' + C.tealDeep + '">' +
            fmt(r.net) + '</td>' +
            '<td class="right num" style="color:' + C.muted + '">' + fmt(r.enovOwn) + '</td>' +
            '<td class="right num" style="color:' + C.muted + '">' + fmt(r.enovSsg) + '</td>' +
            '<td class="right num" style="color:' + C.muted + '">' + fmt(r.enovTraffic) +
            '</td>' +
            '<td>' + (appr
              ? '<span class="bdg good">sent ' + esc(appr) + '</span>'
              : '<span class="bdg wait">not sent</span>') + '</td>' +
            '<td class="right" style="white-space:nowrap">' +
            '<button class="btn ' + (appr ? 'btn-ghost' : 'btn-primary') +
            '" style="height:30px;padding:0 12px;font-size:11.5px" data-act="remitask" ' +
            'data-day="' + esc(r.date) + '" data-net="' + Number(r.net).toFixed(2) + '"' +
            (S.acting || !canWrite() ? ' disabled' : '') + '>' + ic('exp') +
            (appr ? 'Send again' : 'Send for approval') + '</button></td></tr>';
        }).join('') +
        '<tr class="tot"><td>TOTAL AWAITING APPROVAL</td>' +
        '<td class="right num">' + fmt(dueTotal) + '</td>' +
        '<td class="right num">' + fmt(sum(due, function (r) { return r.enovOwn; })) + '</td>' +
        '<td class="right num">' + fmt(sum(due, function (r) { return r.enovSsg; })) + '</td>' +
        '<td class="right num">' + fmt(sum(due, function (r) { return r.enovTraffic; })) +
        '</td><td></td><td></td></tr>' +
        '</tbody></table></div>', due.length + ' day(s) to agree');
    }

    /*
      ---- STEP 2 already done. THE UNDO BUTTON LIVES HERE, and this is the v26 bug fix.

      apiUnlogTransfer has been in the engine since v25.2 and the dialog has been in this
      file since v17, but no button anywhere rendered it — it was lost when this page was
      rebuilt in v23. Meanwhile the engine's own double-settle refusal told the operator to
      "undo the log on eNovate Settlement", where there was nothing to press. So the one
      recovery from a mis-logged transfer lived nowhere at all.

      The handler passes the transferred stamp too, so the dialog can show WHAT it is about
      to clear rather than an em dash.
    */
    if (wired.length) {
      out += panel('Wired in this range',
        '<div class="scroll"><table class="data"><thead><tr>' +
        th('Settlement day') + th('Sent', 1) + th('Bank fee', 1) + th('Their own', 1) +
        th('Governorate', 1) + th('Traffic', 1) + th('Transferred at') + th('', 1) +
        '</tr></thead><tbody>' +
        wired.slice().reverse().map(function (r) {
          return '<tr><td class="num">' + esc(r.date) + ' <span style="color:' + C.muted +
            ';font-size:10.5px">' + dow(r.date) + '</span></td>' +
            '<td class="right num" style="font-weight:600;color:' + C.tealDeep + '">' +
            fmt(r.net) + '</td>' +
            '<td class="right num" style="color:' + C.muted + '">' + fmt(r.ach) + '</td>' +
            '<td class="right num" style="color:' + C.muted + '">' + fmt(r.enovOwn) + '</td>' +
            '<td class="right num" style="color:' + C.muted + '">' + fmt(r.enovSsg) + '</td>' +

        hardNote('<b>Undo</b> clears the transferred stamp and nothing else — no deposit, no ' +

  /* ==================================================================== CALCULATOR
     THE ARITHMETIC BELOW IS THE ENGINE'S, PORTED LINE FOR LINE.

     It is duplicated here on purpose so the calculator answers instantly instead of making
     a round trip to Apps Script for every keystroke. Duplication is a real risk — two
     copies of a money rule drift — so this copy is a literal transcription of lr_() and
     computeTrip_(), and it was checked against the engine across thousands of fares. If the
     rate card changes, nothing here changes: the rates come from d.model, read live.

     THE REMAINING AMOUNT IS NOT IN HERE, and that is deliberate: it is not part of the fare
     and carries no VAT. It appears only where it belongs — on the payment link.
  ==================================================================================== */
  function toP(x) { var n = Number(x) || 0; return Math.round(n * 100 + (n >= 0 ? 1e-9 : -1e-9)); }
  function egp(p) { return (Number(p) || 0) / 100; }

  function lr(vals, target) {
    var n = vals.length, floors = [], rem = [], s = 0, i;
    for (i = 0; i < n; i++) {
      var f = Math.floor(vals[i]);
      floors.push(f); rem.push(vals[i] - f); s += f;
    }
    var short = target - s, order = [];
    for (i = 0; i < n; i++) order.push(i);
    var desc = order.slice().sort(function (a, b) { return rem[b] - rem[a] || a - b; });
    var asc = order.slice().sort(function (a, b) { return rem[a] - rem[b] || a - b; });
    i = 0; while (short > 0) { floors[desc[i % n]] += 1; short--; i++; }
    i = 0; while (short < 0) { floors[asc[i % n]] -= 1; short++; i++; }
    return floors;
  }

  function riderFromMeter(meter, r) {
    var T = Number(meter) || 0;
    return T + T * r.commRate + r.fixedFee +
      r.vatRate * (T * r.commRate * r.eShareComm + r.fixedFee * r.eShareFixed);
  }

  function tripSplit(totalEgp, r) {
    var E = Number(totalEgp) || 0;
    var meterX = (E - r.fixedFee * (1 + r.vatRate * r.eShareFixed)) /
      (1 + r.commRate + r.vatRate * r.commRate * r.eShareComm);
    var commX = meterX * r.commRate;
    var eGrossX = commX * r.eShareComm + r.fixedFee * r.eShareFixed;
    var vatX = r.vatRate * eGrossX;
    var debtX = commX + r.fixedFee + vatX;

    var p = {};
    p.grossP = toP(E);
    p.debtP = toP(debtX);
    p.meterP = p.grossP - p.debtP;
    p.vatP = toP(vatX);
    p.fixedP = toP(r.fixedFee);
    p.commP = p.debtP - p.vatP - p.fixedP;

    var zedsX = r.zedsShare * eGrossX * (1 + r.vatRate);
    var two = lr([zedsX * 100, (debtX - zedsX) * 100], p.debtP);
    p.zedsP = two[0]; p.enovP = two[1];

    var z3 = lr([r.zedsShare * commX * r.eShareComm * 100,
                 r.zedsShare * r.fixedFee * r.eShareFixed * 100,
                 r.zedsShare * vatX * 100], p.zedsP);
    p.zedsCommP = z3[0]; p.zedsFixedP = z3[1]; p.zedsVatP = z3[2];

    var e6 = lr([(1 - r.zedsShare) * commX * r.eShareComm * 100,
                 commX * r.ssgShareComm * 100,
                 (1 - r.zedsShare) * r.fixedFee * r.eShareFixed * 100,
                 r.fixedFee * r.ssgShareFixed * 100,
                 r.fixedFee * r.trafficShareFixed * 100,
                 (1 - r.zedsShare) * vatX * 100], p.enovP);
    p.enovCommP = e6[0]; p.ssgCommP = e6[1]; p.enovFixedP = e6[2];
    p.ssgFixedP = e6[3]; p.trafficFixedP = e6[4]; p.enovVatP = e6[5];
    p.enovOwnP = p.enovCommP + p.enovFixedP + p.enovVatP;
    p.ssgP = p.ssgCommP + p.ssgFixedP;
    p.trafficP = p.trafficFixedP;
    p.ok = (p.zedsP + p.enovP === p.debtP) &&
           (p.commP + p.fixedP + p.vatP === p.debtP) &&
           (p.meterP + p.debtP === p.grossP) && (p.meterP > 0) && (p.commP > 0);
    return p;
  }

  function rateFrom(m) {

      eShareComm: m.eShareComm / 100, ssgShareComm: m.ssgShareComm / 100,
      zedsShare: m.zedsShare / 100, eShareFixed: m.eShareFixed / 100,
      ssgShareFixed: m.ssgShareFixed / 100, trafficShareFixed: m.trafficShareFixed / 100,
      vatRate: m.vatRate / 100 };

  function pgCalc(d) {

      '" inputmode="decimal" style="width:190px;font-size:17px;height:44px" placeholder="' +
      (S.calcMode === 'total' ? '121.68' : (S.calcMode === 'meter' ? '100.00' : '5.0')) +

      'data-v="total">Rider total</button>' +
      '<button class="chip' + (S.calcMode === 'meter' ? ' on' : '') + '" data-act="calcmode" ' +
      'data-v="meter">Meter fare</button>' +
      '<button class="chip' + (S.calcMode === 'km' ? ' on' : '') + '" data-act="calcmode" ' +
      'data-v="km">Distance</button></div>' +
      (S.calcMode === 'km' ? hardNote('Meter tariff: <b>' + fmt(st.meterOpen || 29) +
        '</b> on the clock before the car moves, plus <b>' + fmt(st.meterKm || 14) +
        '</b> a kilometre. Both are on Control &amp; Checks. This is a calculator only — no ' +
        'settlement is ever worked out from a distance.') : '') +
      hardNote('Rates in force from <b>' + esc(m.effectiveFrom) + '</b>: commission ' +
        pct(m.commRate) + ', fixed fee ' + fmt(m.fixedFee) + ', VAT ' + pct(m.vatRate) +
        ', eNovate ' + pct(m.eShareComm) + ' of the commission and ' + pct(m.eShareFixed) +
        ' of the fixed fee, Zed\u2019s ' + pct(m.zedsShare) + ' of the eNovate slice.'));

    if (S.calc.error) return form + '<div class="alert">' + esc(S.calc.error) + '</div>';

    /*
      THE LINK, UNDER THE v25.9 RULE. It is the debt, plus any Remaining Amount, plus the fee —

    var chain = '<div class="calcCard">' +

      '<div class="calcBig">' + fmt(egp(p.grossP)) + '<span>EGP</span></div>' +
      [['Meter fare \u2014 the driver keeps this', egp(p.meterP)],
       ['Service commission ' + pct(m.commRate), egp(p.commP)],
       ['Fixed platform fee', egp(p.fixedP)],
       ['VAT ' + pct(m.vatRate) + ' on the eNovate slice only', egp(p.vatP)]]
        .map(function (l) {
          return '<div class="calcRow"><span>' + esc(l[0]) + '</span><b>' + fmt(l[1]) +
            '</b></div>';
        }).join('') +
      '<div class="calcRow calcTot"><span>THE DRIVER OWES US</span><b>' + fmt(egp(p.debtP)) +
      '</b></div></div>';

    var split = '<div class="calcCard">' +
      '<div class="calcEyebrow">That debt splits two ways</div>' +
      '<div class="calcRow calcTot"><span>Retained by Zed\u2019s</span><b>' +
      fmt(egp(p.zedsP)) + '</b></div>' +
      [['commission slice', egp(p.zedsCommP)],
       ['fixed fee slice', egp(p.zedsFixedP)],
       ['VAT slice', egp(p.zedsVatP)]].map(function (l) {
        return '<div class="calcRow calcSub"><span>' + esc(l[0]) + '</span><b>' + fmt(l[1]) +
          '</b></div>';
      }).join('') +
      '<div class="calcRow calcTot"><span>TRANSFERRED TO eNOVATE</span><b>' +
      fmt(egp(p.enovP)) + '</b></div>' +
      '<div class="calcNote">Inside that: eNovate ' + fmt(egp(p.enovOwnP)) + ' \u00b7 ' +
      'Governorate ' + fmt(egp(p.ssgP)) + ' \u00b7 Traffic ' + fmt(egp(p.trafficP)) +
      ' \u2014 one lump sum, never split in the money path.</div></div>';

    var link = panel('The payment link support would send',
      '<div class="scroll"><table class="data"><tbody>' +
      [['Commission, fees & VAT', egp(p.debtP), 0, 0],
       ['Payment link fee', egp(feeP), 0, 0],
       ['LINK AMOUNT — type THIS into Payments column D', egp(linkP), 1, 0]]
        .map(function (l) {
          return '<tr' + (l[2] ? ' class="tot"' : '') + '><td' +
