<!-- =====================================================================
     CONFIG — the only part of this repo you ever edit by hand.
     =====================================================================
     apiUrl  The /exec URL of the Apps Script deployment.
             MUST end in /exec (not /dev), and the deployment must be set to
             "Execute as: Me" + "Who has access: Anyone". Every time Code.gs
             changes you have to publish a NEW VERSION, otherwise this URL
             keeps serving the old engine.

     There is deliberately no demo data anywhere in this build. The previous
     version fell back to a built-in fake book whenever it could not reach
     Apps Script, which on GitHub Pages was ALWAYS — so the portal showed
     invented figures that looked completely real. If this URL is wrong or
     unreachable now, the portal says so in red and shows nothing.
-->
<script>
window.TAXI_CFG = {
  apiUrl: 'https://script.google.com/macros/s/AKfycbzpTnUffvv6wn_Uv04n2lDF8wNwt-uUe0k1NglVsIXhLcjkPwtf2N0P9CmzfbO7NR4NxA/exec',

<script>
/* =====================================================================================
 * TAXI SHARM — MINIMAL XLSX WRITER
 * No library, no CDN, no server round trip: builds a real .xlsx (a stored-entry ZIP of
 * SpreadsheetML) in the browser.
 *
 *   TaxiXlsx.save('name.xlsx', [
 *     { name:'Sheet 1', cols:[24,14], rows:[ ['Header','A'], ['Row', {v:3, b:true}] ] }
 *   ]);
 *
 * A cell is a string, a number, or { v:value, b:bold, m:money, t:'title'|'head' }.
 * Numbers carry the 2-decimal money format unless m:false is passed.
 * ===================================================================================== */
(function () {
  'use strict';

  var enc = new TextEncoder();
  function bytes(s) { return enc.encode(s); }

  /* The XML declaration is assembled at runtime. Apps Script's HTML templating reads an
     angle-bracket-question-mark pair as a SCRIPTLET, so a literal declaration anywhere in
     a file it serves is parsed as JavaScript and throws. Splitting the two characters
     means that sequence never appears in the source while the string produced is
     byte-identical. Never write that sequence literally in this file — not even inside a
     comment, because the template engine scans the raw text and does not know what a
     JavaScript comment is. */
  var XMLHEAD = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?' + '>';

  var TBL = (function () {
    var t = new Uint32Array(256), c, n, k;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = TBL[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function zip(files) {
    var parts = [], central = [], offset = 0;
    function u16(n) { return [n & 0xFF, (n >>> 8) & 0xFF]; }
    function u32(n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }
    files.forEach(function (f) {
      var name = bytes(f.name), data = bytes(f.data), crc = crc32(data);
      var local = [].concat([0x50, 0x4B, 0x03, 0x04], u16(20), u16(0x0800), u16(0), u16(0),
        u16(0), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
      parts.push(new Uint8Array(local), name, data);
      central.push({ name: name, crc: crc, len: data.length, off: offset });
      offset += local.length + name.length + data.length;
    });
    var cd = [], cdLen = 0;
    central.forEach(function (c) {
      var head = [].concat([0x50, 0x4B, 0x01, 0x02], u16(20), u16(20), u16(0x0800), u16(0),
        u16(0), u16(0), u32(c.crc), u32(c.len), u32(c.len), u16(c.name.length), u16(0),
        u16(0), u16(0), u16(0), u32(0), u32(c.off));
      cd.push(new Uint8Array(head), c.name);
      cdLen += head.length + c.name.length;
    });
    var end = new Uint8Array([].concat([0x50, 0x4B, 0x05, 0x06], u16(0), u16(0),
      u16(central.length), u16(central.length), u32(cdLen), u32(offset), u16(0)));
    return new Blob(parts.concat(cd, [end]),
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function x(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  }
  function col(n) {
    var s = '';
    while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
    return s;
  }

  /* style ids: 0 text · 1 bold text · 2 money · 3 bold money · 4 title · 5 header */
  var STYLES = XMLHEAD +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00"/></numFmts>' +
    '<fonts count="4">' +
    '<font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="14"/><color rgb="FF12474C"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF12474C"/>' +
    '<bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="6">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="3" fillId="2" borderId="0" xfId="0" applyFill="1"/>' +
    '</cellXfs><cellStyles count="1">' +
    '<cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  function cellXml(ref, cell) {
    if (cell === null || cell === undefined || cell === '') return '';
    var v = cell, bold = false, money = null, kind = '';
    if (typeof cell === 'object') {
      v = cell.v; bold = !!cell.b; money = cell.m; kind = cell.t || '';
    }
    if (v === null || v === undefined || v === '') return '';
    var isNum = typeof v === 'number' && isFinite(v);
    var s;
    if (kind === 'title') s = 4;
    else if (kind === 'head') s = 5;
    else if (isNum && money !== false) s = bold ? 3 : 2;
    else s = bold ? 1 : 0;
    if (isNum) return '<c r="' + ref + '" s="' + s + '"><v>' + v + '</v></c>';
    return '<c r="' + ref + '" s="' + s + '" t="inlineStr"><is>' +
      '<t xml:space="preserve">' + x(v) + '</t></is></c>';
  }

  function sheetXml(sh) {
    var cols = '';
    if (sh.cols && sh.cols.length) {
      cols = '<cols>' + sh.cols.map(function (wd, i) {
        return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + (wd || 14) +
          '" customWidth="1"/>';
      }).join('') + '</cols>';
    }
    var rows = (sh.rows || []).map(function (r, i) {
      var cells = (r || []).map(function (c, j) {
        return cellXml(col(j + 1) + (i + 1), c);
      }).join('');
      return '<row r="' + (i + 1) + '">' + cells + '</row>';
    }).join('');
    return XMLHEAD +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView workbookViewId="0"' +
      (sh.freeze ? '><pane ySplit="' + sh.freeze + '" topLeftCell="A' + (sh.freeze + 1) +
        '" activePane="bottomLeft" state="frozen"/></sheetView>' : '/>') +
      '</sheetViews>' + cols + '<sheetData>' + rows + '</sheetData></worksheet>';
  }

  function build(sheets) {
    var names = sheets.map(function (s, i) {
      return String(s.name || ('Sheet' + (i + 1))).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31);
    });
    var files = [
      { name: '[Content_Types].xml', data: XMLHEAD +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        sheets.map(function (s, i) {
          return '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
            '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
        }).join('') +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
      { name: '_rels/.rels', data: XMLHEAD +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', data: XMLHEAD +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
        'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
        names.map(function (n, i) {
          return '<sheet name="' + x(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
        }).join('') + '</sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: XMLHEAD +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        sheets.map(function (s, i) {
          return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
        }).join('') +
        '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/styles.xml', data: STYLES }
    ];
    sheets.forEach(function (s, i) {
      files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXml(s) });
    });
    return zip(files);
  }

  function save(filename, sheets) {
    var blob = build(sheets);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  window.TaxiXlsx = { build: build, save: save };
})();

</script>

<script>
/* =====================================================================================
 * TAXI SHARM — SETTLEMENT PORTAL  ·  v16
 *
 * WHAT v16 FIXES — THE PORTAL WAS NEVER TALKING TO THE SHEET
 * ----------------------------------------------------------
 * The GitHub Pages build had no Apps Script URL in it at all. Its transport read:
 *
 *      var live = !!(google && google.script && google.script.run);
 *      function call(fn,args,ok,fail){
 *        if (live) { ...google.script.run... ; return; }
 *        setTimeout(function(){ ok(window.TAXI_DEMO.run(fn,args)); }, 180);
 *      }
 *
 * On GitHub Pages `google.script` does not exist, so `live` was always false and EVERY
 * call was answered by the built-in demo book. The portal was showing invented figures
 * that looked entirely real — right shapes, right colours, identities all closing at
 * 0.00 — while the actual workbook was never read. That is why nothing ever synced.
 *
 * Three things changed, and the third matters most:
 *   1. The Apps Script URL lives in TAXI_CFG in index.html and is used by fetch().
 *   2. The demo book is DELETED. Not disabled — deleted. There is no code path left
 *      that can put a made-up number on this screen.
 *   3. A failure now FAILS. If the URL is wrong, the deployment is stale, or the network
 *      is down, the portal says so in red and shows nothing. Silently plausible data is
 *      far more dangerous than a visible error, because you act on it.
 *
 * WHAT v16 FIXES — THE LAG
 * ------------------------
 *   a. Only the page you are looking at is built. The old render() rebuilt all seven
 *      pages of HTML on every refresh — hundreds of table rows parsed and thrown away.
 *   b. Switching pages no longer hits the network. It used to call load() every time,
 *      even when the range and the data were identical.
 *   c. Polling moved from 20s to 60s, and a poll is skipped if the last one finished
 *      less than 30s ago, if the tab is hidden, or if a field has focus.
 *   d. The last payload is cached in localStorage, so opening the portal paints
 *      immediately from cache and then refreshes in the background. The cache is
 *      stamped and clearly labelled as cached until the live answer lands.
 *   e. Requests have a 25s timeout and one automatic retry, so a single cold start of
 *      the Apps Script container no longer leaves the screen stuck on "Loading".
 *
 * WHAT v16 ADDS — the v15 engine's new figures
 * --------------------------------------------
 *   · The COLLECTION POOL comes from the engine now, not from a guess on screen. The old
 *     rule counted any day that did not transfer as still holding money, which
 *     double-counted a Friday whose cash left inside Sunday's wire.
 *   · A REVENUE page: the same money by component and by party, both sides.
 *   · The ACH margin — what is charged to eNovate against what the bank actually takes.
 *   · Formal naming throughout: ZED'S COMMISSION, ZED'S LINK FEE, ZED'S REVENUE.
 *
 * REQUIRES engine v15 or later. Publish a NEW VERSION of the Apps Script deployment
 * after pasting Code.gs, or this URL keeps serving the old engine.
 * ===================================================================================== */
(function () {
  'use strict';

  var CFG = window.TAXI_CFG || {};
  var API = String(CFG.apiUrl || '').trim();
  var SYNC_MS = Number(CFG.syncMs) || 60000;
  var MIN_GAP_MS = 30000;          /* never poll twice inside this window */
  var REQ_TIMEOUT = 25000;

  var CSS = [
    '@keyframes tp-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}',
    '@keyframes tp-spin{to{transform:rotate(360deg)}}',
    '.tp{--teal-deep:#12474C;--teal:#1F6E74;--teal-bright:#35939A;--teal-pale:#E9F1F1;',
    '--navy:#182643;--red:#C40202;--orange:#EB9F0B;--sand:#F2C230;--sand-deep:#D9A614;',
    '--ok:#1B7A4A;--warn:#9A6108;--bad:#C40202;--ink:#111D1C;--muted:#6E7A79;--soft:#48524F;',
    '--line:#E1E6E4;--canvas:#F3F6F4;--card:#FFFFFF;--r:12px;--r-lg:18px;',
    '--shadow:0 1px 2px rgba(17,29,28,.05),0 8px 24px rgba(17,29,28,.06);',
    '--pop:0 20px 50px rgba(17,29,28,.18);box-sizing:border-box;display:block;min-height:100vh;',
    'background:var(--canvas);color:var(--ink);',
    'font:400 14px/1.45 Outfit,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}',
    '.tp *{box-sizing:border-box}',
    '.tp .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}',
    '.tp button{font-family:inherit}',
    '.tp ::selection{background:var(--sand);color:#2A1C00}',
    '.tp :focus-visible{outline:2px solid var(--teal-bright);outline-offset:2px;border-radius:6px}',
    '.tp svg.ic{width:16px;height:16px;flex-shrink:0}',
    '.tp .shell{display:flex;min-height:100vh}',

    /* rail */
    '.tp .rail{width:236px;flex-shrink:0;background:linear-gradient(172deg,#17575C,#0C3438 72%);',
    'display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20;transition:width .18s}',
    '.tp.tight .rail{width:74px}',
    '.tp .brand{padding:16px 15px 13px;display:flex;align-items:center;gap:12px}',
    '.tp .plate{width:52px;height:52px;border-radius:14px;background:#FFF;flex-shrink:0;overflow:hidden;',
    'box-shadow:0 4px 14px rgba(0,0,0,.28);display:block;cursor:pointer}',
    '.tp .plate img{width:100%;height:100%;object-fit:cover;display:block}',
    '.tp .wordmark b{display:block;color:#FFF;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}',
    '.tp .wordmark span{display:block;color:#8CC0C2;font-size:9px;font-weight:700;letter-spacing:.18em;',
    'text-transform:uppercase;margin-top:3px;white-space:nowrap}',

    '.tp .railBtn{position:absolute;top:32px;left:222px;width:24px;height:24px;border-radius:50%;',
    'background:#FFF;border:1px solid var(--line);color:var(--teal-deep);cursor:pointer;display:flex;',
    'align-items:center;justify-content:center;padding:0;z-index:22;box-shadow:0 2px 8px rgba(17,29,28,.18);transition:left .18s}',
    '.tp.tight .railBtn{left:60px}',
    '.tp .railBtn svg{width:13px;height:13px;transition:transform .18s}',
    '.tp.tight .railBtn svg{transform:rotate(180deg)}',
    '.tp .railBtn:hover{background:var(--teal-deep);color:#FFF;border-color:var(--teal-deep)}',
    '.tp nav{padding:6px 0;display:flex;flex-direction:column;gap:1px}',

    '.tp nav a:hover{background:rgba(255,255,255,.07);color:#FFF}',
    '.tp nav a.on{background:rgba(255,255,255,.13);color:#FFF;border-left-color:var(--sand);font-weight:600}',
    '.tp nav a.on svg.ic{color:var(--sand)}',
    '.tp nav a .kb{margin-left:auto;font-size:9.5px;font-weight:700;color:#5E8E90;font-family:"IBM Plex Mono",monospace}',
    '.tp nav a .cnt{margin-left:auto;font-size:10px;font-weight:700;background:var(--red);color:#FFF;border-radius:20px;padding:1px 7px}',
    '.tp.tight nav a{padding:12px 0;justify-content:center;border-left:none;border-right:3px solid transparent}',

    '.tp.tight nav a .tx,.tp.tight nav a .kb,.tp.tight nav a .cnt{display:none}',
    '.tp .railFoot{margin-top:auto;padding:14px 16px 16px;border-top:1px solid rgba(255,255,255,.14);cursor:pointer}',
    '.tp .railFoot:hover{background:rgba(255,255,255,.05)}',
    '.tp .railFoot .l{font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sand)}',
    '.tp .railFoot .v{font-size:25px;font-weight:600;color:#FFF;margin-top:3px;letter-spacing:-.03em}',
    '.tp .railFoot .n{font-size:10.5px;color:#8FBCBE;margin-top:3px;line-height:1.4}',
    '.tp.tight .railFoot{display:none}',
    '.tp .weave{height:8px;display:flex;flex-shrink:0}.tp .weave i{flex:1}',

    /* header + sync pill */
    '.tp main{flex:1;min-width:0;display:flex;flex-direction:column}',
    '.tp header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px 13px;',
    'display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:15}',
    '.tp header .ht{min-width:0}',
    '.tp header .eyebrow{font-size:8.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--teal-bright)}',
    '.tp header h1{margin:3px 0 0;font-size:23px;font-weight:600;letter-spacing:-.03em;line-height:1.05}',
    '.tp header p.sub{margin:5px 0 0;font-size:12.5px;color:var(--muted);max-width:70ch}',
    '.tp header .hr{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}',
    '.tp .sync{display:inline-flex;align-items:center;gap:7px;height:37px;padding:0 12px;border-radius:20px;',
    'font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}',
    '.tp .sync.live{background:#E6F3EC;color:var(--ok)}',
    '.tp .sync.busy{background:var(--teal-pale);color:var(--teal-deep)}',
    '.tp .sync.stale{background:#FDF3DF;color:var(--warn)}',
    '.tp .sync.err{background:#FBE6E5;color:var(--bad)}',
    '.tp .sync i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}',
    '.tp .sync.busy i{border-radius:50%;border:2px solid currentColor;border-top-color:transparent;',

        : 'The engine on this deployment is older than v15 and does not send the split yet.';
    }
    if (p.k === 'drivers') {
      return int((d.drivers || []).length) + ' drivers \u00b7 ' + fmt(k.outstanding) +
        ' outstanding \u00b7 ' + int(k.blocked) + ' blocked.';
    }
    if (p.k === 'links') {
      var l = d.payments || [], landed = l.filter(function (x2) { return x2.landed; }).length;
      return int(l.length) + ' paid links in range \u00b7 ' + landed + ' in the bank \u00b7 ' +
        (l.length - landed) + ' in transit.';
    }
    if (p.k === 'remit') {
      var lp = landedPayments();
      return int(lp.length) + ' payments landed in range \u00b7 eNovate share ' +
        fmt(k.enovRel) + ' + fees ' + fmt(k.enovFees) + '.';
    }
    if (p.k === 'history') {
      return int((d.days || []).length) + ' days \u00b7 ' + int(k.transfers || 0) +
        ' transfers sent \u00b7 ' + fmt(k.transferred) + ' to eNovate.';
    }
    if (p.k === 'recon') {
      var bad = (d.checks || []).filter(function (c) { return !c.pass; }).length;
      return bad ? bad + ' identity check(s) failing \u2014 do not transfer until they close at 0.00.'
        : 'All ' + (d.checks || []).length + ' identities close at 0.00.';
    }
    if (p.k === 'today') {
      var f = d.focus;
      if (!f) return p.sub;
      return (f.isToday ? 'Today, ' : '') + dow(f.date) + ' ' + dm(f.date) +
        (isWorkDay(f.date) ? ' is a working day \u2014 a transfer can go out.'
          : ' is not a working day \u2014 its cash carries to ' + dow(nextWorkDay(f.date)) +
            ' ' + dm(nextWorkDay(f.date)) + '.');
    }
    return p.sub;
  }

  function drawHeader() {
    var p = PAGEMAP[S.page], el = q('hdr');

    el.innerHTML = '<div class="ht"><div class="eyebrow">' + esc(p.eb) + '</div><h1>' +
      esc(p.t) + '</h1><p class="sub">' + esc(headerSub(p)) + '</p></div>' +
      '<div class="hr">' + headerControls(p) + '</div>';

  /* ------------------------------------------------------------------ bits */
  function panel(title, inner, note) {
    return '<section class="panel"><h2>' + esc(title) +
      (note ? '<em>' + esc(note) + '</em>' : '') + '</h2>' + inner + '</section>';
  }
  function empty(title, msg) {
    return '<section class="panel"><h2>' + esc(title) +
      '</h2><div class="loading" style="padding:26px">' + esc(msg) + '</div></section>';
  }
  function noteLine(txt) { return '<p class="note">' + ic('info') + '<span>' + txt + '</span></p>'; }
  function th(label, right) {
    return '<th class="s' + (right ? ' right' : '') + '" data-sort="1">' + label + '</th>';
  }
  function tools(inputId, tableId, placeholder, chips) {
    var c = (chips || []).map(function (x2, i) {
      return '<button class="chip' + (i === 0 ? ' on' : '') + '" data-chip="' + esc(x2[1]) +
        '" data-table="' + tableId + '">' + esc(x2[0]) + '</button>';
    }).join('');
    return '<div class="tools"><div class="search">' + ic('find') + '<input id="' + inputId +
      '" type="search" placeholder="' + esc(placeholder) + '" data-table="' + tableId +
      '"></div>' + c + '<span class="hits" id="hits-' + tableId + '"></span></div>';
  }
  function acc(id, title, tag, tagCls, inner) {
    return '<details class="acc" id="' + id + '"' + (S.open[id] ? ' open' : '') +
      '><summary>' + esc(title) + '<span class="tag ' + tagCls + '">' + esc(tag) +
      '</span><span class="caret">' + ic('down') + '</span></summary><div class="in">' +
      inner + '</div></details>';
  }
  function legend(defs) {
    return '<p class="lg">' + defs.map(function (d) {
      return '<b><i style="background:' + d[2] + '"></i>' + esc(d[1]) + '</b>';
    }).join('') + '</p>';
  }
  function niceMax(v) {
    if (!(v > 0)) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    return (n <= 1 ? 1 : (n <= 2 ? 2 : (n <= 2.5 ? 2.5 : (n <= 5 ? 5 : 10)))) * p;
  }
  function barChart(rows, defs) {
    var W = 760, H = 232, L = 56, R = 12, T = 12, B = 32;
    var iw = W - L - R, ih = H - T - B, max = 0;
    rows.forEach(function (r) {
      defs.forEach(function (d) { max = Math.max(max, Math.abs(Number(r[d[0]]) || 0)); });
    });
    var top = niceMax(max);
    var lab = top >= 100000
      ? function (v) { return Math.round(v / 1000).toLocaleString('en-US') + 'k'; }
      : function (v) { return Math.round(v).toLocaleString('en-US'); };
    var gw = iw / rows.length, bw = Math.max(5, Math.min(16, (gw - 8) / defs.length));
    var span = bw * defs.length + (defs.length - 1) * 2, grid = '';
    [0, .25, .5, .75, 1].forEach(function (f) {
      var yy = T + ih - f * ih;
      grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy.toFixed(1) + '" y2="' +
        yy.toFixed(1) + '" stroke="' + (f === 0 ? C.line : C.grid) + '" stroke-width="1"/>' +
        '<text x="' + (L - 9) + '" y="' + (yy + 3.4).toFixed(1) + '" text-anchor="end" ' +
        'font-size="9.5" fill="' + C.muted + '" font-family="IBM Plex Mono,monospace">' +
        lab(top * f) + '</text>';
    });
    var bars = rows.map(function (r, i) {
      var x0 = L + i * gw + gw / 2 - span / 2;
      return defs.map(function (d, j) {
        var v = Number(r[d[0]]) || 0, hh = Math.max((Math.abs(v) / top) * ih, v > 0 ? 1.5 : 0);
        return '<rect x="' + (x0 + j * (bw + 2)).toFixed(1) + '" y="' + (T + ih - hh).toFixed(1) +
          '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="2.5" fill="' +
          d[2] + '"><title>' + esc(r.date) + ' \u00b7 ' + esc(d[1]) + ' ' + fmt(v) +
          '</title></rect>';
      }).join('');
    }).join('');
    var every = rows.length > 10 ? Math.ceil(rows.length / 9) : 1;
    var xlab = rows.map(function (r, i) {
      return i % every ? '' : '<text x="' + (L + i * gw + gw / 2).toFixed(1) + '" y="' +
        (T + ih + 17) + '" text-anchor="middle" font-size="9.5" fill="' + C.muted +
        '" font-family="IBM Plex Mono,monospace">' + esc(dm(r.date)) + '</text>';
    }).join('');
    return '<div class="cw"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
      grid + bars + xlab + '</svg></div>';
  }
  function weekStrip() {
    var t = iso(new Date()), ws = weekStart(t), days = [], i;
    for (i = 0; i < 7; i++) days.push(addD(ws, i));
    var byDay = {};
    ((S.data && S.data.days) || []).forEach(function (r) { byDay[r.date] = r; });
    return panel('This work week', '<div class="wk">' + days.map(function (x2) {
      var r = byDay[x2], work = isWorkDay(x2);
      var cl = (work ? 'pay' : 'off') + (x2 === t ? ' today' : '');
      var v = r ? (Number(r.net) > 0 ? fmt(r.net)
        : (Number(r.enov) + Number(r.fees) > 0 ? '\u00b7' : '\u2014')) : '\u2014';
      return '<div class="' + cl + '" title="' +
        esc(x2 + (work ? ' \u2014 working day' : ' \u2014 no transfer')) + '">' +
        '<div class="d">' + dow(x2) + '</div><div class="m">' + v + '</div></div>';
    }).join('') + '</div>' +
      noteLine('Working week: <b>' + esc(weekText(S.week)) + '</b>. Friday and Saturday cash ' +
        'is collected but carried \u2014 it leaves with Sunday\u2019s single transfer, so one ' +
        fmt(achFee()) + ' bank charge is paid, not three.'));
  }
  function trend(d) {
    var s = (d.series || []).slice(-21);
    if (!s.length) return '';
    var defs = [['gross', 'Rider fares', C.tealBright], ['matched', 'Collected', C.navy],
      ['net', 'Sent to eNovate', C.tealDeep]];
    return panel('Day by day', legend(defs) + barChart(s, defs));
  }

  /* ------------------------------------------------------------------ TODAY */
  function pgToday(d) {
    var t = d.focus;
    if (!t) return empty('Today', 'Nothing on this day.');
    var work = isWorkDay(t.date), cls, st;
    if (!t.hasRow && Number(t.pending) === 0) { cls = 'hold'; st = 'No paid link landed on this day.'; }
    else if (!t.confirmed) {
      cls = 'hold';
      st = 'Type the bank deposit below \u2014 ' + fmt(t.pending) + ' is waiting on it.';
    } else if (Number(t.variance) !== 0) {
      cls = 'stop';
      st = 'The deposit is off by ' + fmt(t.variance) + '. Fix it before sending anything.';
    } else if (!work) {
      cls = 'hold';
      st = dow(t.date) + ' is not a working day. This money leaves on ' +
        dow(nextWorkDay(t.date)) + ' ' + dm(nextWorkDay(t.date)) + ', with one ACH fee.';
    } else if (Number(t.net) === 0) {
      cls = 'hold';
      st = 'Under the ' + fmt(minTransfer()) + ' minimum after the ' + fmt(achFee()) +
        ' charge. It stays in the pool.';
    } else if (t.loggedAt) { cls = 'go'; st = 'Already sent \u00b7 ' + esc(t.ref); }
    else { cls = 'go'; st = 'Clear to send.'; }

    var lines = [['Trips', int(t.trips), 0], ['Rider fares', fmt(t.gross), 0],
      ['Debt earned', fmt(t.debt), 1],
      ['In the bank', fmt(t.deposit), 0], ['Collected from drivers', fmt(t.matched), 0],
      ['Driver credit', fmt(t.credit), 1],
      ["ZED'S COMMISSION", fmt(t.zeds), 0], ["ZED'S LINK FEE", fmt(t.zedsFee), 0],
      ["ZED'S REVENUE", fmt(t.kept), 1],
      ['eNovate share', fmt(t.enov), 0], ['eNovate link fee', fmt(t.fees), 0],
      ['ACH charged to eNovate', '\u2212 ' + fmt(t.ach), 0]];

    var ticket = '<section class="ticket"><div class="stub">' +
      '<div class="eb">' + (t.isToday ? 'Today' : 'Selected day') + ' \u00b7 ' +
      esc(dow(t.date) + ' ' + t.date) + '</div>' +
      '<div class="amt num">' + fmt(t.net) + '<sup>EGP</sup></div>' +
      '<div class="st ' + cls + '">' + ic(cls === 'go' ? 'tick' : 'bang') + '<span>' + st +
      '</span></div><div class="acts">' +
      (Number(t.net) > 0 ? '<button class="btn btn-accent" data-act="copy" data-v="' +
        Number(t.net).toFixed(2) + '">' + ic('copy') + 'Copy amount</button>' : '') +
      '<button class="btn btn-ghost" data-go="pool">' + ic('pool') + 'Open the pool</button>' +
      '</div></div><div class="side"><div class="eb" style="color:#8DBABC">How it adds up</div>' +
      '<div class="meter" style="margin-top:10px">' + lines.map(function (l) {
        return '<div class="ln' + (l[2] ? ' gap' : '') + '"><span class="k">' + l[0] +
          '</span><span class="v num">' + l[1] + '</span></div>';
      }).join('') + '<div class="ln key"><span class="k">Send to eNovate</span>' +
      '<span class="v num">' + fmt(t.net) + '</span></div></div></div></section>';

    var okDep = t.confirmed && Number(t.variance) === 0;
    var settle = panel('Match the bank \u00b7 ' + t.date,
      '<div class="frm"><div class="fld"><label>Bank deposit \u00b7 expected ' +
      fmt(t.expected) + '</label><input id="depAmt" type="number" step="0.01" ' +
      'inputmode="decimal" placeholder="' + fmt(t.expected) + '" value="' +
      (t.confirmed ? Number(t.deposit).toFixed(2) : '') + '"></div>' +
      '<button class="btn btn-primary" data-act="savedep" data-day="' + esc(t.date) + '"' +
      (S.busy ? ' disabled' : '') + '>Save deposit</button>' +
      '<button class="btn btn-ghost" data-act="useexp" data-v="' +
      Number(t.expected).toFixed(2) + '">Use expected</button>' +
      (t.confirmed ? '<span class="tag ' + (okDep ? 'ok' : 'no') +
        '" style="height:37px;display:inline-flex;align-items:center">' +
        (okDep ? 'Variance 0.00' : 'Off by ' + fmt(t.variance)) + '</span>' : '') + '</div>' +
      (t.canSend ? '<div class="frm" style="margin-top:14px;padding-top:14px;border-top:1px dashed ' +
        C.line + '"><div class="fld"><label>Amount actually sent \u00b7 suggested ' +
        fmt(t.net) + '</label><input id="trAmt" type="number" step="0.01" inputmode="decimal" ' +
        'value="' + Number(t.net).toFixed(2) + '"></div>' +
        '<div class="fld"><label>Bank reference</label><input id="trRef" type="text" ' +
        'placeholder="ACH-' + t.date.replace(/-/g, '') + '-01" value="' + esc(t.ref || '') +
        '"></div><button class="btn btn-primary" data-act="logtr" data-day="' + esc(t.date) +
        '" data-net="' + Number(t.net).toFixed(2) + '"' + (S.busy ? ' disabled' : '') + '>' +
        ic('send') + 'Confirm &amp; log</button></div>' : '') +
      (Number(t.net) > 0 ? '<div class="frm" style="margin-top:14px;padding-top:14px;' +
        'border-top:1px dashed ' + C.line + '"><div class="fld">' +
        '<label>What the bank actually charged \u00b7 optional</label>' +
        '<input id="achCost" type="number" step="0.01" inputmode="decimal" placeholder="' +
        (t.achCost === null || t.achCost === undefined ? 'from the tariff band'
          : Number(t.achCost).toFixed(2)) + '" value="' +
        (t.achCostTyped ? Number(t.achCost).toFixed(2) : '') + '"></div>' +
        '<button class="btn btn-ghost" data-act="saveach" data-day="' + esc(t.date) + '"' +
        (S.busy ? ' disabled' : '') + '>Save bank charge</button>' +
        '<span class="pill">Margin ' + fmtN(t.achMargin) + '</span></div>' +
        noteLine('The <b>50.00 charged to eNovate</b> and <b>what the bank takes from ' +

        : '') +
      noteLine('Paymob deposits the <b>link amounts</b> (debt + ' +

        'expected figure is higher than what the drivers owed.'));

    return ticket + '<div class="g2">' + settle + weekStrip() + '</div>' + trend(d);
  }

  /* ------------------------------------------------------------------ POOL */
  function pgPool(d) {

      '<div><i style="background:' + C.sand + '"></i>Zed\u2019s side <b>' + fmt(p.zedsTotal) +
      '</b></div><div><i style="background:' + C.teal + '"></i>eNovate side <b>' +
      fmt(p.enovTotal) + '</b></div></div></div>' +
      '<div><div style="font-size:8.5px;font-weight:700;letter-spacing:.16em;' +
      'text-transform:uppercase;color:' + C.teal + ';margin-bottom:7px">Owed out of it</div>' +
      '<div class="bar">' + segs.map(function (x2) {

      }).join('') + '</div><div class="keys">' + segs.map(function (x2) {

      '</tr></thead><tbody>' + rows.map(function (r) {
        var wr = why[r.poolReason] || ['Held', 'wait'], work = isWorkDay(r.date);
        return '<tr><td class="num"><a class="lk" data-act="gotoday" data-day="' + esc(r.date) +

  /* ------------------------------------------------------------------ REVENUE */
  function pgRevenue(d) {
    var rv = d.revenue;
    if (!rv) {
      return empty('Revenue split',
        'This Apps Script deployment is running an engine older than v15, which does not ' +
        'send the revenue split. Paste TaxiSharm_v15.gs and publish a NEW VERSION of the ' +
        'deployment.');
    }
    var e = rv.earned, lk = rv.links, bk = rv.bank;
    var row = function (label, o, bold) {
      return '<tr' + (bold ? ' class="tot"' : '') + '><td' +
        (bold ? ' style="font-weight:600"' : '') + '>' + esc(label) + '</td>' +
        ['total', 'ssg', 'traffic', 'enov', 'zeds'].map(function (k2) {
          var v = o[k2];
          return '<td class="right num"' +
            (k2 === 'zeds' ? ' style="font-weight:600;color:' + C.tealDeep + '"' : '') + '>' +

      rr.push([]);
      rr.push(H(['Collected on the links', 'Total', '', '', 'eNovate', "Zed's"]));
      rr.push([txt('Share of the collected debt'), n2(rv.links.collectedDebt), '', '',
        n2(rv.links.collectedEnov), n2(rv.links.collectedZeds)]);
      rr.push([txt('Link fee added to each link'), n2(rv.links.total), '', '',
        n2(rv.links.enov), n2(rv.links.zeds)]);
      rr.push([B('TOTAL FROM THE LINKS'),
        B(n2(Number(rv.links.collectedDebt) + Number(rv.links.total))), '', '',
        B(n2(Number(rv.links.collectedEnov) + Number(rv.links.enov))),
        B(n2(Number(rv.links.collectedZeds) + Number(rv.links.zeds)))]);
      rr.push([]);
      rr.push(H(['The bank', 'Amount (EGP)']));
      rr.push([txt('ACH charged to eNovate'), n2(rv.bank.charged)]);
      rr.push([txt('ACH actually paid to the bank'),
        rv.bank.cost === null ? txt('not known') : n2(rv.bank.cost)]);
      rr.push([B('ACH MARGIN'), rv.bank.margin === null ? txt('not known') : B(n2(rv.bank.margin))]);
      rr.push([]);
      rr.push([B("ZED'S TOTAL REVENUE IN THIS RANGE"), B(n2(k.zedsGrand))]);
      sheets.push({ name: 'Revenue split', cols: [42, 16, 14, 14, 16, 16], rows: rr, freeze: 6 });

    } else if (S.page === 'history') {
      var h = meta();
      h.push(H(['Date', 'Weekday', 'Working day', 'Links', 'In the bank', 'Expected', 'Variance',
        'Collected', "Zed's commission", "Zed's link fee", "ZED'S REVENUE", 'eNovate share',
        'eNovate fee', 'ACH charged', 'ACH cost', 'ACH margin', 'SENT TO eNOVATE',
        'Driver credit', 'In the pool', 'State', 'Bank reference']));
      var tot = { dep: 0, ex: 0, m: 0, kp: 0, e: 0, f: 0, a: 0, n: 0, mg: 0 };
      d.days.forEach(function (x) {
        tot.dep += +x.deposit; tot.ex += +x.expected; tot.m += +x.matched; tot.kp += +x.kept;
        tot.e += +x.enov; tot.f += +x.fees; tot.a += +x.ach; tot.n += +x.net;
        tot.mg += Number(x.achMargin || 0);
        h.push([txt(x.date), txt(dow(x.date)), txt(isWorkDay(x.date) ? 'Yes' : 'No'),
          { v: Number(x.links) || 0, m: false }, n2(x.deposit), n2(x.expected), n2(x.variance),
          n2(x.matched), n2(x.zeds), n2(x.zedsFee), n2(x.kept), n2(x.enov), n2(x.fees),
          n2(x.ach), x.achCost === null ? txt('not known') : n2(x.achCost),
          x.achMargin === null ? txt('not known') : n2(x.achMargin), n2(x.net), n2(x.credit),
          x.inPool ? n2(x.entitlement) : n2(0), txt(x.state), txt(x.ref || '')]);
      });
      h.push([B('TOTAL'), '', '', '', B(n2(tot.dep)), B(n2(tot.ex)), B(n2(tot.dep - tot.ex)),
        B(n2(tot.m)), '', '', B(n2(tot.kp)), B(n2(tot.e)), B(n2(tot.f)), B(n2(tot.a)), '',
        B(n2(tot.mg)), B(n2(tot.n))]);
      sheets.push({ name: 'Settlement history',
        cols: [13, 9, 11, 7, 14, 14, 11, 13, 16, 15, 15, 14, 13, 13, 13, 13, 17, 13, 13, 40, 22],
        rows: h, freeze: 6 });

    } else if (S.page === 'drivers') {
      var dr = meta();
      dr.push(H(['Driver ID', 'Driver name', 'Mobile', 'Trips', 'Debt earned', 'Collected',
        'Outstanding', 'Credit held', 'Held for dispute', 'Status']));
      var td = { t: 0, e: 0, c: 0, o: 0, cr: 0, hd: 0 };
      d.drivers.forEach(function (x) {
        td.t += +x.trips; td.e += +x.earned; td.c += +x.collected; td.o += +x.outstanding;
        td.cr += +x.credit; td.hd += +x.held;
        dr.push([txt(x.id), txt(x.name), txt(x.phone || ''), { v: Number(x.trips) || 0, m: false },
          n2(x.earned), n2(x.collected), n2(x.outstanding), n2(x.credit), n2(x.held), txt(x.status)]);
      });
      dr.push([B('TOTAL'), '', '', B(td.t), B(n2(td.e)), B(n2(td.c)), B(n2(td.o)), B(n2(td.cr)),
        B(n2(td.hd))]);
      sheets.push({ name: 'Drivers', cols: [13, 26, 16, 8, 14, 14, 14, 13, 16, 22],
        rows: dr, freeze: 6 });

    } else if (S.page === 'links') {
      var lk = meta();
      lk.push(H(['Link ID', 'Driver ID', 'Driver name', 'Debt requested', 'LINK AMOUNT',
        'Date paid', 'In bank on', "Zed's side", 'eNovate side', 'Driver credit', 'State']));
      d.payments.forEach(function (x) {
        lk.push([txt(x.id), txt(x.driver), txt(x.name || ''), n2(x.base), n2(x.link),
          txt(x.paid), txt(x.deposit), n2(x.zeds), n2(x.enov), n2(x.credit),
          txt(x.landed ? 'In the bank' : 'In transit')]);
      });
      sheets.push({ name: 'Payment links',
        cols: [16, 13, 26, 15, 15, 13, 13, 14, 14, 13, 15], rows: lk, freeze: 6 });

    } else if (S.page === 'remit') {
      var lp = CH.landedPayments(), idx = CH.driverIndex(), tt = { l: 0, e: 0, z: 0 };
      var s = meta([[txt('Sheet'), txt('Drivers whose cash is confirmed in the bank account')],
        [txt('Excluded'), txt('Payments still in transit')]]);
      s.push(H(['Driver ID', 'Driver name', 'Mobile', 'Link ID', 'Date paid',
        'Link amount (EGP)', 'eNovate share (EGP)', "Zed's share (EGP)"]));
      lp.forEach(function (x) {
        var dv = idx[x.driver] || {};
        tt.l += +x.link; tt.e += +x.enov; tt.z += +x.zeds;
        s.push([txt(x.driver), txt(x.name || ''), txt(dv.phone || ''), txt(x.id), txt(x.paid),
          n2(x.link), n2(x.enov), n2(x.zeds)]);
      });
      s.push([B('TOTAL'), B(lp.length + ' payments'), '', '', '', B(n2(tt.l)), B(n2(tt.e)),
        B(n2(tt.z))]);
      s.push([]);
      s.push([txt('Transferred to eNovate in this range'), '', '', '', '', '', n2(k.transferred)]);
      s.push([txt('ACH charged to eNovate'), '', '', '', '', '', n2(k.ach)]);
      s.push([txt('Still in the collection pool'), '', '', '', '', '', n2(k.poolTotal)]);
      sheets.push({ name: 'eNovate remittance', cols: [13, 26, 16, 20, 13, 18, 19, 17],
        rows: s, freeze: 8 });

    } else {
      var rc = meta();
      rc.push(H(['Identity \u2014 every difference must be 0.00', 'Left', 'Right', 'Difference',
        'Result']));
      (d.checks || []).forEach(function (c) {
        rc.push([txt(c.label), n2(c.left), n2(c.right), n2(c.diff), txt(c.pass ? 'OK' : 'FAIL')]);
      });
      sheets.push({ name: 'Identities', cols: [62, 15, 15, 14, 10], rows: rc, freeze: 6 });
      var kp = [H(['KPI', 'Value'])];
      [['Trips', k.trips], ['Rider fares', k.gross], ['Driver debt earned', k.debt],
       ['Collected from drivers', k.matched], ['Driver credit held', k.credit],
       ['Outstanding on drivers', k.outstanding], ["Zed's revenue from the links", k.zedsCash],
       ["Zed's ACH margin", k.zedsAchMargin], ["ZED'S TOTAL REVENUE", k.zedsGrand],
       ['eNovate entitlement from landed cash', k.enovEnt], ['Sent to eNovate', k.transferred],
       ['ACH charged to eNovate', k.achCharged], ['ACH paid to the bank', k.achCost],
       ['Transfers actually sent', k.transfers], ['In the collection pool', k.poolTotal],
       ['Bank variance (must be 0.00)', k.variance], ['Unreadable trip dates', k.badDate],
       ['Trips with no rate card row', k.noRate], ['Trips failing their own check', k.badTrip],
       ['Duplicate link IDs', k.dupLinks], ['Open disputes', k.disputes]].forEach(function (x) {
        kp.push([txt(x[0]), (x[1] === null || x[1] === undefined) ? txt('not known') : n2(x[1])]);
      });
      sheets.push({ name: 'KPIs', cols: [44, 16], rows: kp, freeze: 1 });
    }

    var name = 'taxi_sharm_' + S.page + '_' + (r.start || 'all') + '_' + (r.end || 'all') + '.xlsx';
    try { window.TaxiXlsx.save(name, sheets); toast('Exported ' + name, 'good'); }
    catch (err) { toast('Export failed: ' + (err && err.message ? err.message : err), 'bad'); }
  }

  /* ------------------------------------------------------------------ events */
  function bind() {
    var el0 = root();
    el0.addEventListener('click', function (e) {
      var el = e.target;
      var goEl = el.closest ? el.closest('[data-go]') : null;
      var actEl = el.closest ? el.closest('[data-act]') : null;
      var chipEl = el.closest ? el.closest('[data-chip]') : null;
      var presetEl = el.closest ? el.closest('[data-preset]') : null;
      var thEl = el.closest ? el.closest('th[data-sort]') : null;

      if (presetEl) {
        var cfg = S.rng[S.page];
        if (cfg) { cfg.preset = presetEl.getAttribute('data-preset'); cfg.start = ''; cfg.end = ''; }
        S.pop = false; X.persist(); CH.drawHeader(); load();
        return;
      }
      if (chipEl) {
        var tid = chipEl.getAttribute('data-table');
        var box = chipEl.parentNode.querySelectorAll('.chip');
        for (var i = 0; i < box.length; i++) box[i].classList.remove('on');
        chipEl.classList.add('on');
        var tb = root().querySelector('#' + tid);
        if (tb) tb.setAttribute('data-chip', chipEl.getAttribute('data-chip'));
        applyFilter(tid);
        return;
      }
      if (thEl) { sortTable(thEl); return; }
      if (actEl) {
        var a = actEl.getAttribute('data-act');
        if (a === 'rail') { S.tight = !S.tight; root().classList.toggle('tight', S.tight); X.persist(); return; }
        if (a === 'home') { S.focus = ''; S.driver = 'all'; go('today'); return; }
        if (a === 'pop') { S.pop = !S.pop; CH.drawHeader(); return; }
        if (a === 'export') { exportPage(); return; }
        if (a === 'refresh') { S.err = ''; load(); return; }
        if (a === 'opendirect') { window.open(X.API, '_blank'); return; }
        if (a === 'copy') {
          var v = actEl.getAttribute('data-v');
          var ta = document.createElement('textarea');
          ta.value = v; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (err) {}
          document.body.removeChild(ta);
          toast('Copied ' + v, 'good');
          return;
        }
        if (a === 'useexp') {
          var f = q('depAmt');
          if (f) { f.value = actEl.getAttribute('data-v'); f.focus(); }
          return;
        }
        if (a === 'savedep') {
          act('apiSetDeposit', [actEl.getAttribute('data-day'),
            q('depAmt') ? q('depAmt').value : '', opts()]);
          return;
        }
        if (a === 'saveach') {
          act('apiSetAchCost', [actEl.getAttribute('data-day'),
            q('achCost') ? q('achCost').value : '', opts()]);
          return;
        }
        if (a === 'logtr') {
          var ref = q('trRef') ? q('trRef').value.trim() : '';
          if (!ref) { toast('Type the bank reference first.', 'bad'); return; }
          var net = Number(actEl.getAttribute('data-net')) || 0;
          var sent = q('trAmt') ? Number(q('trAmt').value) : net;
          var note = ref;
          if (Math.abs(sent - net) > 0.005) {
            note = ref + ' \u00b7 sent ' + sent.toFixed(2) + ' (engine ' + net.toFixed(2) + ')';
            toast('Logged ' + sent.toFixed(2) + ', but the engine derived ' + net.toFixed(2) +
              '. The difference stays in the pool and goes out with the next transfer \u2014 ' +
              'nothing is lost.', 'bad');
          }
          act('apiLogTransfer', [actEl.getAttribute('data-day'), note, opts()]);
          return;
        }
        if (a === 'gotoday') {
          S.focus = actEl.getAttribute('data-day');
          S.rng.today.preset = 'day';
          go('today');
          if (optsKey() !== S.loadedKey) load(true);
          return;
        }
        if (a === 'dayprev' || a === 'daynext') {
          var cur = S.focus || (S.data && S.data.focus && S.data.focus.date) || iso(new Date());
          S.focus = addD(cur, a === 'dayprev' ? -1 : 1);
          CH.drawHeader(); load();
          return;
        }
        if (a === 'dayreset') { S.focus = ''; CH.drawHeader(); load(); return; }
        if (a === 'driver') { S.driver = actEl.getAttribute('data-v'); go('links'); load(true); return; }
        if (a === 'cleardriver') { S.driver = 'all'; CH.drawHeader(); load(); return; }
      }
      if (goEl) { go(goEl.getAttribute('data-go')); return; }
      if (S.pop && !(el.closest && el.closest('.rangebox'))) { S.pop = false; CH.drawHeader(); }
    });

    el0.addEventListener('input', function (e) {
      var t = e.target;
      if (t.getAttribute && t.getAttribute('data-table')) {
        var tb = root().querySelector('#' + t.getAttribute('data-table'));
        if (tb) tb.setAttribute('data-q', (t.value || '').toLowerCase().trim());
        applyFilter(t.getAttribute('data-table'));
      }
    });
    el0.addEventListener('change', function (e) {
      var t = e.target;
      if (t.getAttribute && t.getAttribute('data-date')) {
        var cfg = S.rng[S.page];
        if (!cfg) return;
        var r = activeRange();
        cfg.start = t.getAttribute('data-date') === 'start' ? t.value : r.start;
        cfg.end = t.getAttribute('data-date') === 'end' ? t.value : r.end;
        cfg.preset = 'custom';
        X.persist(); CH.drawHeader(); load();
      }
    });
    el0.addEventListener('toggle', function (e) {
      if (e.target && e.target.className === 'acc' && e.target.id) {
        S.open[e.target.id] = e.target.open;
      }
    }, true);

    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var a = document.activeElement;
      if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= PAGES.length) { go(PAGES[n - 1].k); e.preventDefault(); }
      else if (e.key === 'e') exportPage();
      else if (e.key === 'r') load();
    });

    /* A poll is skipped when the tab is hidden, when one is already running, when a menu
       or a field is open, and when the last successful read is still fresh. Between them
       an idle tab costs nothing and a busy one is never fighting itself. */
    setInterval(function () {
      if (document.hidden || S.busy || S.pop) return;
      var a = document.activeElement;
      if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
      if (S.lastOk && Date.now() - S.lastOk < X.MIN_GAP_MS) return;
      load(true);
    }, X.SYNC_MS);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (S.lastOk && Date.now() - S.lastOk < X.MIN_GAP_MS) return;
      load(true);
    });
  }

  /* ------------------------------------------------------------------ mount */
  function boot(el) {
    X.setRoot(el);
    el.className = 'tp' + (S.tight ? ' tight' : '');
    el.innerHTML =
      '<div class="shell"><div id="rail" style="display:contents"></div><main>' +
      '<div class="weave"><i style="background:#C40202"></i><i style="background:#EB9F0B"></i>' +
      '<i style="background:#F2C230"></i><i style="background:#35939A"></i>' +
      '<i style="background:#182643"></i><i style="background:#1F6E74"></i></div>' +
      '<header id="hdr"></header><div id="content"></div></main></div>' +
      '<div class="toast" id="toast"></div>';
    el.querySelector('#rail').innerHTML = CH.drawRail();
    CH.drawHeader();
    bind();
    load();
  }

  if (!document.getElementById('taxi-portal-css')) {
    var st = document.createElement('style');
    st.id = 'taxi-portal-css';
    st.textContent = X.CSS;
    document.head.appendChild(st);
  }

  /* Any uncaught error goes on the screen. A blank white page tells you nothing, and this
     portal is mostly read on a phone where there is no console to open. */
  window.addEventListener('error', function (ev) {
    var el = document.querySelector('taxi-portal');
    if (!el || el.getAttribute('data-crashed')) return;
    el.setAttribute('data-crashed', '1');
    el.innerHTML = '<div style="font:14px/1.6 system-ui,sans-serif;color:#C40202;padding:40px 22px;' +
      'max-width:680px;margin:0 auto"><b style="font-size:17px">The portal hit an error</b>' +
      '<p style="color:#111d1c">' + String(ev.message || ev.error || 'unknown') + '</p>' +
      '<p style="color:#6E7A79;font-size:12px">' + String((ev.filename || '') + ' line ' +
      (ev.lineno || '?')) + '</p><p style="color:#6E7A79;font-size:12px">Send this text on ' +
      'and reload the page.</p></div>';
  });

  /* Mount. Custom elements are the normal path; the direct call is the safety net for an
     older in-app browser or WebView where customElements is missing, because without it
     the page would sit on "Loading" forever with no clue why. */
  function mountAll() {
    var list = document.querySelectorAll('taxi-portal');
    for (var i = 0; i < list.length; i++) {
      if (!list[i]._up) { list[i]._up = 1; boot(list[i]); }
    }
  }
  if (typeof customElements !== 'undefined' && customElements.define) {
    if (!customElements.get('taxi-portal')) {
      try {
        customElements.define('taxi-portal', class extends HTMLElement {
          connectedCallback() { if (!this._up) { this._up = 1; boot(this); } }
        });
      } catch (e) { mountAll(); }
    }
    // If the upgrade never ran, mount by hand rather than leaving a dead page.
    setTimeout(mountAll, 400);
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountAll);
  } else {
    mountAll();
  }
})();

</script>
