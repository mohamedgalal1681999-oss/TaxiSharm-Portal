<script>
/* =====================================================================================
 * TAXI SHARM — MINIMAL XLSX WRITER
 * No library, no CDN, no server round trip: builds a real .xlsx (a stored-entry ZIP of
 * SpreadsheetML) straight in the browser, so it works inside the Apps Script web app too.
 *
 *   TaxiXlsx.save('name.xlsx', [
 *     { name:'Sheet 1', cols:[24,14,14], rows:[ ['Header','A','B'], ['Row', 12.5, {v:3, b:true}] ] }
 *   ]);
 *
 * A cell is a string, a number, or { v:value, b:bold, m:money, t:'title' }.
 * Numbers carry the 2-decimal money format unless m:false is passed.
 * ===================================================================================== */
(function () {
  'use strict';

  var enc = new TextEncoder();
  function bytes(s) { return enc.encode(s); }

  /* ---- CRC32 ---- */
  var TBL = (function () {
    var t = new Uint32Array(256), c, n, k;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;

      var ent = Number(r.enov) + Number(r.fees);
      if (Number(r.pending) > 0) {
        if (r.confirmed && Number(r.variance) !== 0) blocked += Number(r.pending);
        else pending += Number(r.pending);
      } else if (Number(r.net) === 0) carried += ent;
    });
    var total = Number(k.carried || 0) + Number(k.pending || 0);
    var ready = Math.max(0, total - pending - blocked);
    return { total: total, pending: pending, blocked: blocked, carried: carried, ready: ready };
  }
  function nextTransferDay() {
    var t = iso(new Date());
    return isWorkDay(t) ? t : nextWorkDay(t);
  }
  function carriedFrom() {
    /* the non-working days whose cash rolls into the next transfer */
    var day = nextTransferDay(), out = [], x = prevWorkDay(day);
    var g = 0, cur = addD(day, -1);
    while (cur > x && g++ < 10) { out.push(cur); cur = addD(cur, -1); }
    return out.reverse();
  }
  function landedPayments() {
    var d = S.data;
    if (!d || !d.payments) return [];
    return d.payments.filter(function (p) { return p.landed; });
  }
  function driverIndex() {
    var m = {};
    ((S.data && S.data.drivers) || []).forEach(function (r) { m[r.id] = r; });
    return m;
  }
  function badCount() {
    var d = S.data;
    if (!d) return 0;
    var k = d.kpi || {};
    return ((d.checks || []).filter(function (c) { return !c.pass; }).length) +
      Number(k.badDate || 0) + Number(k.noRate || 0) + Number(k.badTrip || 0) + Number(k.dupLinks || 0) +
      (Number(k.variance || 0) !== 0 ? 1 : 0);
  }

  /* ------------------------------------------------------------------ chrome */
  function drawRail() {
    var logo = window.TAXI_LOGO || 'assets/logo.png';
    var bad = badCount(), pool = poolTotals(), nd = nextTransferDay(), carry = carriedFrom();
    var nav = PAGES.map(function (p, i) {
      var tail = (p.k === 'recon' && bad) ? '<span class="cnt">' + bad + '</span>'
        : '<span class="kb">' + (i + 1) + '</span>';
      return '<a data-go="' + p.k + '" class="' + (S.page === p.k ? 'on' : '') + '">' + ic(p.ic) +
        '<span class="tx">' + p.nav + '</span>' + tail + '</a>';
    }).join('');
    var note = 'on ' + dow(nd) + ' ' + dm(nd) +
      (carry.length ? ' \u00b7 carries ' + carry.map(function (x) { return dow(x); }).join(' + ') : '') +
      ' \u00b7 one ACH fee';
    return '<aside class="rail">' +
      '<button class="railBtn" data-act="rail" title="Collapse">' + ic('left') + '</button>' +
      '<div class="brand"><span class="plate" data-act="home"><img src="' + esc(logo) + '" alt="Taxi Sharm"></span>' +
      '<span class="wordmark"><b>Taxi Sharm</b><span>Settlement</span></span></div>' +
      '<nav>' + nav + '</nav>' +
      '<div class="railFoot" data-go="pool"><div class="l">Ready to send</div>' +
      '<div class="v num">' + fmt(pool.ready) + '</div><div class="n">' + esc(note) + '</div></div>' +
      '</aside>';
  }

  function headerControls(p) {
    var h = '';
    var d = S.data || {};
    if (p.k === 'today') {
      var day = (d.focus && d.focus.date) || iso(new Date());
      h += '<div class="rangebox" style="display:flex;gap:6px;align-items:center">' +
        '<button class="btn btn-ghost" data-act="dayprev" title="Previous day">' + ic('left') + '</button>' +
        '<button class="rangebtn" data-act="dayreset"><span class="rl"><b>' + esc(dow(day) + ' ' + dm(day)) +
        '</b><i>' + (day === iso(new Date()) ? 'Today' : 'Selected day') + '</i></span></button>' +
        '<button class="btn btn-ghost" data-act="daynext" title="Next day">' + ic('right') + '</button></div>';
    } else if (p.dated) {
      var cfg = S.rng[p.k];
      h += '<div class="rangebox"><button class="rangebtn' + (S.pop ? ' act' : '') + '" data-act="pop">' +
        ic('cal') + '<span class="rl"><b>' + esc(rangeText()) + '</b><i>' + esc(rangeLabel()) + '</i></span>' +
        ic('down') + '</button>' +
        (S.pop ? '<div class="pop">' + PRESETS.map(function (x) {
          var r = rangeFor(x[0], p.k);
          return '<div class="opt' + (cfg.preset === x[0] ? ' on' : '') + '" data-preset="' + x[0] + '">' +
            esc(x[1]) + '<span>' + (r.start === r.end ? dm(r.start) : dm(r.start) + ' \u2013 ' + dm(r.end)) + '</span></div>';
        }).join('') + '<div class="cust"><input type="date" value="' + esc(activeRange().start) +
          '" data-date="start"><span style="color:' + C.muted + '">\u2192</span><input type="date" value="' +
          esc(activeRange().end) + '" data-date="end"></div></div>' : '') + '</div>';
    } else {
      h += '<span class="pill">' + ic(p.ic) + (p.k === 'drivers' ? 'As of today' : 'Whole book') + '</span>';
    }
    if (S.driver !== 'all') h += '<button class="chip on" data-act="cleardriver">' + esc(S.driver) + ' \u2715</button>';
    h += '<button class="btn btn-accent" data-act="export">' + ic('exp') + 'Export ' + exportName(p.k) + '</button>';
    return h;
  }
  function exportName(k) {
    return { today: 'today', pool: 'the pool', history: 'history', drivers: 'drivers',
      links: 'links', remit: 'for eNovate', recon: 'checks' }[k] || '';
  }
  function headerSub(p) {
    var d = S.data, k = K();
    if (!d) return p.sub;
    if (p.k === 'pool') {
      var pl = poolTotals();
      return 'Held for eNovate right now: ' + fmt(pl.total) + ' EGP. Next transfer day is ' +
        dow(nextTransferDay()) + ' ' + dm(nextTransferDay()) + '.';
    }
    if (p.k === 'drivers') {
      return int((d.drivers || []).length) + ' drivers \u00b7 ' + fmt(k.outstanding) +
        ' outstanding \u00b7 ' + int(k.blocked) + ' blocked.';
    }
    if (p.k === 'links') {
      var l = d.payments || [], landed = l.filter(function (x) { return x.landed; }).length;
      return int(l.length) + ' paid links in range \u00b7 ' + landed + ' in the bank \u00b7 ' +
        (l.length - landed) + ' in transit.';
    }
    if (p.k === 'remit') {
      var lp = landedPayments();
      return int(lp.length) + ' payments landed in range \u00b7 eNovate share ' + fmt(k.enovRel) +
        ' + fees ' + fmt(k.enovFees) + '.';
    }
    if (p.k === 'history') {
      return int((d.days || []).length) + ' days \u00b7 ' + int(k.transfers || 0) + ' transfers sent \u00b7 ' +
        fmt(k.transferred) + ' to eNovate.';
    }
    if (p.k === 'recon') {
      var bad = (d.checks || []).filter(function (c) { return !c.pass; }).length;
      return bad ? bad + ' identity check(s) failing — do not transfer until they close at 0.00.'
        : 'All ' + (d.checks || []).length + ' identities close at 0.00.';
    }
    if (p.k === 'today') {
      var f = d.focus;
      return f ? (f.isToday ? 'Today, ' : '') + dow(f.date) + ' ' + dm(f.date) +
        (isWorkDay(f.date) ? ' is a working day \u2014 a transfer can go out.'
          : ' is not a working day \u2014 its cash carries to ' + dow(nextWorkDay(f.date)) + ' ' + dm(nextWorkDay(f.date)) + '.')
        : p.sub;
    }
    return p.sub;
  }
  function drawHeader() {
    var p = PAGEMAP[S.page];
    var el = q('hdr');
    if (!el) return;
    el.innerHTML = '<div class="ht"><div class="eyebrow">' + esc(p.eb) + '</div><h1>' + esc(p.t) + '</h1>' +
      '<p class="sub">' + esc(headerSub(p)) + '</p></div><div class="hr">' + headerControls(p) + '</div>';
  }

  /* ------------------------------------------------------------------ pages */
  function panel(title, inner, note) {
    return '<section class="panel"><h2>' + esc(title) + (note ? '<em>' + esc(note) + '</em>' : '') + '</h2>' + inner + '</section>';
  }
  function empty(title, msg) {
    return '<section class="panel"><h2>' + esc(title) + '</h2><div class="loading" style="padding:26px">' +
      esc(msg) + '</div></section>';
  }
  function noteLine(txt) { return '<p class="note">' + ic('info') + '<span>' + txt + '</span></p>'; }

  /* ---- TODAY ---- */
  function pgToday(d) {
    var t = d.focus;
    if (!t) return empty('Today', 'Nothing on this day.');
    var work = isWorkDay(t.date), cls, st;
    if (!t.hasRow && Number(t.pending) === 0) { cls = 'hold'; st = 'No paid link landed on this day.'; }
    else if (!t.confirmed) { cls = 'hold'; st = 'Type the bank deposit below \u2014 ' + fmt(t.pending) + ' is waiting on it.'; }
    else if (Number(t.variance) !== 0) { cls = 'stop'; st = 'The deposit is off by ' + fmt(t.variance) + '. Fix it before sending anything.'; }
    else if (!work) { cls = 'hold'; st = dow(t.date) + ' is not a working day. This money leaves on ' + dow(nextWorkDay(t.date)) + ' ' + dm(nextWorkDay(t.date)) + ', with one ACH fee.'; }
    else if (Number(t.net) === 0) { cls = 'hold'; st = 'Under the ' + fmt(minTransfer()) + ' minimum after the ' + fmt(achFee()) + ' bank charge. Carried forward.'; }
    else if (t.loggedAt) { cls = 'go'; st = 'Already sent \u00b7 ' + esc(t.ref); }
    else { cls = 'go'; st = 'Clear to send.'; }

    var lines = [['Trips', int(t.trips), 0], ['Rider fares', fmt(t.gross), 0], ['Debt earned', fmt(t.debt), 1],
      ['In the bank', fmt(t.deposit), 0], ['Collected', fmt(t.matched), 0], ['Driver credit', fmt(t.credit), 1],
      ['We keep', fmt(t.kept), 0], ['eNovate share', fmt(t.enov), 0], ['eNovate fee', fmt(t.fees), 0],
      ['ACH fee', '\u2212 ' + fmt(t.ach), 0]];

    var ticket = '<section class="ticket"><div class="stub">' +
      '<div class="eb">' + (t.isToday ? 'Today' : 'Selected day') + ' \u00b7 ' + esc(dow(t.date) + ' ' + t.date) + '</div>' +
      '<div class="amt num">' + fmt(t.net) + '<sup>EGP</sup></div>' +
      '<div class="st ' + cls + '">' + ic(cls === 'go' ? 'tick' : 'bang') + '<span>' + st + '</span></div>' +
      '<div class="acts">' +
      (Number(t.net) > 0 ? '<button class="btn btn-accent" data-act="copy" data-v="' + Number(t.net).toFixed(2) + '">' +
        ic('copy') + 'Copy amount</button>' : '') +
      '<button class="btn btn-ghost" data-go="pool">' + ic('pool') + 'Open the pool</button></div></div>' +
      '<div class="side"><div class="eb" style="color:#8DBABC">How it adds up</div>' +
      '<div class="meter" style="margin-top:10px">' + lines.map(function (l) {
        return '<div class="ln' + (l[2] ? ' gap' : '') + '"><span class="k">' + l[0] + '</span><span class="v num">' + l[1] + '</span></div>';
      }).join('') + '<div class="ln key"><span class="k">Send to eNovate</span><span class="v num">' + fmt(t.net) +
      '</span></div></div></div></section>';

    var okDep = t.confirmed && Number(t.variance) === 0;
    var settle = panel('Match the bank \u00b7 ' + t.date,
      '<div class="frm"><div class="fld"><label>Bank deposit \u00b7 expected ' + fmt(t.expected) + '</label>' +
      '<input id="depAmt" type="number" step="0.01" inputmode="decimal" placeholder="' + fmt(t.expected) + '" value="' +
      (t.confirmed ? Number(t.deposit).toFixed(2) : '') + '"></div>' +
      '<button class="btn btn-primary" data-act="savedep" data-day="' + esc(t.date) + '"' + (S.busy ? ' disabled' : '') + '>Save deposit</button>' +
      '<button class="btn btn-ghost" data-act="useexp" data-v="' + Number(t.expected).toFixed(2) + '">Use expected</button>' +
      (t.confirmed ? '<span class="tag ' + (okDep ? 'ok' : 'no') + '" style="height:37px;display:inline-flex;align-items:center">' +
        (okDep ? 'Variance 0.00' : 'Off by ' + fmt(t.variance)) + '</span>' : '') + '</div>' +
      (t.canSend ? '<div class="frm" style="margin-top:14px;padding-top:14px;border-top:1px dashed ' + C.line + '">' +
        '<div class="fld"><label>Amount actually sent · suggested ' + fmt(t.net) + '</label>' +
        '<input id="trAmt" type="number" step="0.01" inputmode="decimal" value="' + Number(t.net).toFixed(2) + '"></div>' +
        '<div class="fld"><label>Bank reference</label>' +
        '<input id="trRef" type="text" placeholder="ACH-' + t.date.replace(/-/g, '') + '-01" value="' + esc(t.ref || '') + '"></div>' +
        '<button class="btn btn-primary" data-act="logtr" data-day="' + esc(t.date) + '" data-net="' +
        Number(t.net).toFixed(2) + '"' + (S.busy ? ' disabled' : '') + '>' +
        ic('send') + 'Confirm &amp; log</button></div>' : '') +
      noteLine('Paymob deposits the <b>link amounts</b> (debt + ' + fmt(settings().linkFee || 1.5) +
        ' per link), not the bare debt. That is why the expected figure is higher than what the drivers owed.'));

    return ticket + '<div class="g2">' + settle + weekStrip() + '</div>' + trend(d);
  }

  function weekStrip() {
    var t = iso(new Date()), ws = weekStart(t), days = [], i;
    for (i = 0; i < 7; i++) days.push(addD(ws, i));
    var byDay = {};
    ((S.data && S.data.days) || []).forEach(function (r) { byDay[r.date] = r; });
    return panel('This work week', '<div class="wk">' + days.map(function (x) {
      var r = byDay[x], work = isWorkDay(x);
      var cl = (work ? 'pay' : 'off') + (x === t ? ' today' : '');
      var v = r ? (Number(r.net) > 0 ? fmt(r.net) : (Number(r.enov) + Number(r.fees) > 0 ? '\u00b7' : '\u2014')) : '\u2014';
      return '<div class="' + cl + '" title="' + esc(x + (work ? ' \u2014 working day' : ' \u2014 no transfer')) + '">' +
        '<div class="d">' + dow(x) + '</div><div class="m">' + v + '</div></div>';
    }).join('') + '</div>' +
      noteLine('Working week: <b>' + esc(weekText(S.week)) + '</b>. Friday and Saturday cash is collected but ' +
        'carried \u2014 it leaves with Sunday\u2019s single transfer, so we pay one ' + fmt(achFee()) + ' bank charge, not three.'));
  }

  function trend(d) {
    var s = (d.series || []).slice(-21);
    if (!s.length) return '';
    var defs = [['gross', 'Rider fares', C.tealBright], ['matched', 'Collected', C.navy], ['net', 'Sent to eNovate', C.tealDeep]];
    return panel('Day by day', legend(defs) + barChart(s, defs));
  }

  /* ---- POOL ---- */
  function pgPool(d) {
    var pl = poolTotals(), nd = nextTransferDay(), carry = carriedFrom();
    var ach = achFee();
    var net = Math.max(0, pl.ready - ach);
    var segs = [[pl.ready, C.tealDeep, 'Confirmed \u00b7 ready'], [pl.pending, C.orange, 'Waiting on a bank deposit'],
      [pl.blocked, C.red, 'Held by a variance']];
    var card = '<section class="poolcard"><div><div class="eyebrow" style="font-size:8.5px;font-weight:700;' +
      'letter-spacing:.16em;text-transform:uppercase;color:' + C.teal + '">Collected, not yet sent</div>' +
      '<div class="big num">' + fmt(pl.total) + '<sup>EGP</sup></div>' +
      '<div class="keys">' + segs.map(function (x) {
        return '<div><i style="background:' + x[1] + '"></i>' + x[2] + ' <b>' + fmt(x[0]) + '</b></div>';
      }).join('') + '</div></div>' +
      '<div><div class="bar">' + segs.map(function (x) {
        return '<i style="width:' + w(x[0], pl.total || 1) + ';background:' + x[1] + '"></i>';
      }).join('') + '</div>' +
      '<div class="nextbox" style="margin-top:14px">' +
      '<div class="eb" style="color:' + C.teal + '">Next transfer \u00b7 ' + esc(dow(nd) + ' ' + dm(nd)) + '</div>' +
      '<div class="row"><span class="k">Confirmed and ready</span><span class="v num">' + fmt(pl.ready) + '</span></div>' +
      '<div class="row"><span class="k">ACH bank charge \u00b7 one per transfer</span><span class="v num">\u2212 ' + fmt(ach) + '</span></div>' +
      '<div class="row tot"><span class="k">Leaves the account</span><span class="v num">' + fmt(net) + '</span></div>' +
      (carry.length ? '<p class="note" style="margin-top:9px">' + ic('info') + '<span>Includes ' +
        carry.map(function (x) { return dow(x) + ' ' + dm(x); }).join(' and ') +
        ' \u2014 non-working days, so their cash rides along on one fee.</span></p>' : '') +
      '<div class="acts" style="margin-top:12px">' +
      (net > 0 ? '<button class="btn btn-accent" data-act="copy" data-v="' + net.toFixed(2) + '">' + ic('copy') + 'Copy ' + fmt(net) + '</button>' : '') +
      '<button class="btn btn-primary" data-act="gotoday" data-day="' + esc(nd) + '">' + ic('send') + 'Settle ' + dow(nd) + '</button>' +
      '</div></div></div></section>';

    var rows = poolRows();
    var tbl = rows.length ? '<div class="scroll list"><table class="data"><thead><tr>' +
      th('Day') + th('Working day') + th('Bank deposit', 1) + th('Expected', 1) + th('Variance', 1) +
      th('eNovate held', 1) + th('Why it is still here') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        var ent = Number(r.enov) + Number(r.fees), work = isWorkDay(r.date);
        var why, bd;
        if (!r.confirmed) { why = 'No bank deposit saved yet'; bd = 'wait'; }
        else if (Number(r.variance) !== 0) { why = 'Deposit off by ' + fmt(r.variance) + ' \u2014 held back'; bd = 'bad'; }
        else if (!work) { why = 'Non-working day \u2014 leaves on ' + dow(nextWorkDay(r.date)) + ' ' + dm(nextWorkDay(r.date)); bd = 'mute'; }
        else { why = 'Below the ' + fmt(minTransfer()) + ' minimum after the fee'; bd = 'wait'; }
        return '<tr><td class="num"><a class="lk" data-act="gotoday" data-day="' + esc(r.date) + '" style="color:' +
          C.tealDeep + ';font-weight:600">' + esc(r.date) + '</a></td>' +
          '<td>' + dow(r.date) + (work ? '' : ' <span class="bdg mute">off</span>') + '</td>' +
          '<td class="right num">' + (r.confirmed ? fmt(r.deposit) : '\u2014') + '</td>' +
          '<td class="right num" style="color:' + C.muted + '">' + fmt(r.expected) + '</td>' +
          '<td class="right num" style="font-weight:600;color:' + (r.confirmed && Number(r.variance) !== 0 ? C.bad : C.ok) + '">' +
          (r.confirmed ? fmt(r.variance) : '\u2014') + '</td>' +
          '<td class="right num" style="font-weight:600">' + fmt(ent) + '</td>' +
          '<td><span class="bdg ' + bd + '">' + esc(why) + '</span></td></tr>';
      }).join('') + '</tbody></table></div>'
      : '<div class="loading" style="padding:24px">Nothing is being held back. Every confirmed day has been settled.</div>';

    var src = panel('Where the pool came from',
      '<div class="scroll"><table class="data"><tbody>' +
      [['Debt collected from drivers (matched)', K().matched], ['Driver credit we hold', K().credit],
       ['eNovate share of that cash', K().enovRel], ['eNovate half of the link fees', K().enovFees],
       ['eNovate entitlement from landed cash', K().enovEnt], ['Already sent to eNovate', K().transferred],
       ['ACH fees paid to the bank', K().ach]].map(function (r, i) {
        var key = i === 4 || i === 5;
        return '<tr' + (key ? '' : ' class="dim"') + '><td' + (key ? ' style="font-weight:600"' : '') + '>' + esc(r[0]) +
          '</td><td class="right num"' + (key ? ' style="font-weight:600"' : '') + '>' + fmt(r[1]) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      noteLine('The transfer is always derived as <b>cumulative entitlement \u2212 already sent</b>. That is why a ' +
        'backdated trip or a corrected fare can never double-pay: the next transfer simply picks up the difference.'));

    return card + panel('Days still holding eNovate money', tbl, rows.length + ' day(s)') +
      '<div class="g2">' + src + weekStrip() + '</div>';
  }

  /* ---- HISTORY ---- */
  function pgHistory(d) {
    var k = K();
    var strip = '<div class="strip">' + [['Trips', int(k.trips), ''], ['Rider fares', fmt(k.gross), 'EGP'],
      ['Collected', fmt(k.matched), 'from drivers'], ['We kept', fmt(k.zedsCash), 'our side'],
      ['Sent to eNovate', fmt(k.transferred), int(k.transfers || 0) + ' transfers'],
      ['ACH fees', fmt(k.ach), 'bank charges']].map(function (c) {
      return '<div><div class="l">' + esc(c[0]) + '</div><div class="v num">' + c[1] + '</div><div class="n">' + esc(c[2]) + '</div></div>';
    }).join('') + '</div>';
    if (!d.days.length) return strip + empty('Settlement history', 'No settlement day in this range.');
    var t = { dep: 0, x: 0, m: 0, kp: 0, e: 0, f: 0, a: 0, n: 0 };
    var rows = d.days.map(function (r) {
      t.dep += +r.deposit; t.x += +r.expected; t.m += +r.matched; t.kp += +r.kept;
      t.e += +r.enov; t.f += +r.fees; t.a += +r.ach; t.n += +r.net;
      var sent = Number(r.net) > 0, work = isWorkDay(r.date);
      var bd = sent ? 'good' : (r.confirmed ? (Number(r.variance) !== 0 ? 'bad' : 'wait') : 'wait');
      return '<tr' + (work ? '' : ' class="dim"') + '><td class="num"><a class="lk" data-act="gotoday" data-day="' +
        esc(r.date) + '" style="color:' + C.tealDeep + ';font-weight:600">' + esc(r.date) + '</a>' +
        '<span style="color:' + C.muted + ';font-size:10.5px;margin-left:7px">' + dow(r.date) + '</span></td>' +
        '<td class="right num">' + (r.confirmed ? fmt(r.deposit) : '\u2014') + '</td>' +
        '<td class="right num" style="color:' + C.muted + '">' + fmt(r.expected) + '</td>' +
        '<td class="right num" style="font-weight:600;color:' + (Number(r.variance) === 0 ? C.ok : C.bad) + '">' +
        (r.confirmed ? fmt(r.variance) : '\u2014') + '</td>' +
        '<td class="right num">' + fmt(r.matched) + '</td>' +
        '<td class="right num" style="font-weight:600">' + fmt(r.kept) + '</td>' +
        '<td class="right num" style="font-weight:600">' + fmt(r.enov) + '</td>' +
        '<td class="right num" style="color:' + C.muted + '">' + fmt(r.fees) + '</td>' +
        '<td class="right num">' + fmt(r.ach) + '</td>' +
        '<td class="right num" style="font-weight:600;color:' + C.tealDeep + '">' + fmt(r.net) + '</td>' +
        '<td><span class="bdg ' + bd + '">' + esc(r.state) + '</span></td>' +
        '<td class="num" style="color:' + C.muted + ';font-size:11px">' + esc(r.ref || '\u2014') + '</td></tr>';
    }).join('');
    var tbl = '<div class="scroll list"><table class="data"><thead><tr>' +

  /* ---- DRIVERS ---- */

      '</td><td></td></tr></tbody></table></div>');

        w(r.outstanding, max) + ';background:' + col + '"></div></div><div class="vl">' + fmt(r.outstanding) + '</div></div>';

  /* ---- eNOVATE REMITTANCE ---- */
  function pgRemit(d) {
    var lp = landedPayments(), idx = driverIndex(), k = K();
    var r = activeRange();
    var tot = { base: 0, link: 0, enov: 0, zeds: 0, credit: 0 };
    lp.forEach(function (l) { tot.base += +l.base; tot.link += +l.link; tot.enov += +l.enov; tot.zeds += +l.zeds; tot.credit += +l.credit; });
    var head = '<div class="strip">' + [
      ['Payments landed', int(lp.length), 'links'],
      ['Cash in our bank', fmt(tot.link), 'link amounts'],
      ['Debt cleared', fmt(tot.base), 'driver debt'],
      ['eNovate side', fmt(tot.enov), 'of the landed cash'],
      ['Our side', fmt(tot.zeds), 'stays with us'],
      ['Sent to eNovate', fmt(k.transferred), 'in this range']

    }).join('') + '</div>';

    var byDriver = {};

    });
    var groups = Object.keys(byDriver).map(function (x) { return byDriver[x]; })

    var rows = lp.map(function (l) {

        '<td class="num" style="color:' + C.soft + '">' + esc(l.driver) + '</td>' +
        '<td style="font-weight:500">' + esc(l.name || '\u2014') + '</td>' +

        '<td class="right num" style="color:' + C.muted + '">' + fmt(l.credit) + '</td></tr>';
    }).join('');

    var sheet = panel('Who paid, and what landed in our bank',
      tools('remSearch', 'tblRemit', 'Driver, link or date\u2026', null) +
      '<div class="scroll list"><table class="data" id="tblRemit"><thead><tr>' +
      th('In bank on') + th('Driver ID') + th('Driver') + th('Mobile') + th('Link / Ref') + th('Paid on') +
      th('Debt paid', 1) + th('Cash landed', 1) + th('eNovate share', 1) + th('Our share', 1) + th('Credit', 1) +
      '</tr></thead><tbody>' + rows +
      '<tr class="tot"><td>TOTAL</td><td></td><td>' + lp.length + ' payments</td><td></td><td></td><td></td>' +
      '<td class="right num">' + fmt(tot.base) + '</td><td class="right num">' + fmt(tot.link) + '</td>' +
      '<td class="right num">' + fmt(tot.enov) + '</td><td class="right num">' + fmt(tot.zeds) + '</td>' +
      '<td class="right num">' + fmt(tot.credit) + '</td></tr></tbody></table></div>' +
      noteLine('This is the sheet to send with the transfer: every driver whose cash actually reached our account ' +
        'between <b>' + esc(r.start) + '</b> and <b>' + esc(r.end) + '</b>. Money still in transit is deliberately ' +
        'excluded \u2014 eNovate is only paid out of cash we are holding.'));

    var per = panel('By driver', '<div class="scroll"><table class="data"><thead><tr>' +
      th('Driver') + th('Payments', 1) + th('Debt paid', 1) + th('Cash landed', 1) + th('eNovate share', 1) +
      '</tr></thead><tbody>' + groups.map(function (g) {
        return '<tr><td style="font-weight:500">' + esc(g.name) + '<span class="num" style="color:' + C.muted +

    return head + sheet + per;
  }

  /* ---- RECONCILIATION ---- */

        ['eNovate of platform fee', pct(m.eShareFixed)], ['SSG of platform fee', pct(m.ssgShareFixed)],

  function tools(inputId, tableId, placeholder, chips) {

  function acc(id, title, tag, tagCls, inner) {
    return '<details class="acc" id="' + id + '"' + (S.open[id] ? ' open' : '') + '><summary>' + esc(title) +
      '<span class="tag ' + tagCls + '">' + esc(tag) + '</span><span class="caret">' + ic('down') +
      '</span></summary><div class="in">' + inner + '</div></details>';
  }
  function legend(defs) {
    return '<p class="lg">' + defs.map(function (d) {
      return '<b><i style="background:' + d[2] + '"></i>' + esc(d[1]) + '</b>';
    }).join('') + '</p>';
  }
  function niceMax(v) {
    if (!(v > 0)) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    var m = n <= 1 ? 1 : (n <= 2 ? 2 : (n <= 2.5 ? 2.5 : (n <= 5 ? 5 : 10)));
    return m * p;
  }
  function barChart(rows, defs) {
    var W = 760, H = 232, L = 56, R = 12, T = 12, B = 32;
    var iw = W - L - R, ih = H - T - B, max = 0;
    rows.forEach(function (r) { defs.forEach(function (d) { max = Math.max(max, Math.abs(Number(r[d[0]]) || 0)); }); });
    var top = niceMax(max);
    var lab = top >= 100000 ? function (v) { return Math.round(v / 1000).toLocaleString('en-US') + 'k'; }
      : function (v) { return Math.round(v).toLocaleString('en-US'); };
    var gw = iw / rows.length, bw = Math.max(5, Math.min(16, (gw - 8) / defs.length));
    var span = bw * defs.length + (defs.length - 1) * 2, grid = '';
    [0, .25, .5, .75, 1].forEach(function (f) {
      var yy = T + ih - f * ih;
      grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) +
        '" stroke="' + (f === 0 ? C.line : C.grid) + '" stroke-width="1"/><text x="' + (L - 9) + '" y="' +
        (yy + 3.4).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="' + C.muted + '" font-family="IBM Plex Mono,monospace">' +
        lab(top * f) + '</text>';
    });
    var bars = rows.map(function (r, i) {
      var x0 = L + i * gw + gw / 2 - span / 2;
      return defs.map(function (d, j) {
        var v = Number(r[d[0]]) || 0, hh = Math.max((Math.abs(v) / top) * ih, v > 0 ? 1.5 : 0);
        return '<rect x="' + (x0 + j * (bw + 2)).toFixed(1) + '" y="' + (T + ih - hh).toFixed(1) + '" width="' +
          bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="2.5" fill="' + d[2] + '"><title>' + esc(r.date) +
          ' \u00b7 ' + esc(d[1]) + ' ' + fmt(v) + '</title></rect>';
      }).join('');
    }).join('');
    var every = rows.length > 10 ? Math.ceil(rows.length / 9) : 1;
    var xlab = rows.map(function (r, i) {
      return i % every ? '' : '<text x="' + (L + i * gw + gw / 2).toFixed(1) + '" y="' + (T + ih + 17) +
        '" text-anchor="middle" font-size="9.5" fill="' + C.muted + '" font-family="IBM Plex Mono,monospace">' +
        esc(dm(r.date)) + '</text>';
    }).join('');
    return '<div class="cw"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + grid + bars + xlab + '</svg></div>';
  }

  /* ------------------------------------------------------------------ tables */
  function applyFilter(tableId) {
    var t = root.querySelector('#' + tableId);
    if (!t || !t.tBodies[0]) return;
    var qq = t.getAttribute('data-q') || '', chip = t.getAttribute('data-chip') || 'all';
    var terms = qq.split(/\s+/).filter(function (x) { return x; });
    var rows = t.tBodies[0].rows, shown = 0, total = 0;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.className.indexOf('tot') >= 0 || r.className.indexOf('sep') >= 0) continue;
      total++;
      var key = (r.getAttribute('data-k') || r.textContent).toLowerCase(), ok = true;
      for (var j = 0; j < terms.length; j++) if (key.indexOf(terms[j]) < 0) { ok = false; break; }
      if (ok && chip !== 'all') ok = (r.getAttribute('data-s') || '') === chip;
      r.style.display = ok ? '' : 'none';
      if (ok) shown++;
    }
    var hh = root.querySelector('#hits-' + tableId);
    if (hh) hh.textContent = shown === total ? total + ' rows' : shown + ' of ' + total + ' rows';
  }
  function sortTable(th2) {
    var t = th2;
    while (t && t.tagName !== 'TABLE') t = t.parentNode;
    if (!t) return;
    var idx = th2.cellIndex, dir = th2.classList.contains('asc') ? -1 : 1, hs = th2.parentNode.cells, i;
    for (i = 0; i < hs.length; i++) { hs[i].classList.remove('asc'); hs[i].classList.remove('desc'); }
    th2.classList.add(dir === 1 ? 'asc' : 'desc');
    var body = t.tBodies[0], rows = [], keep = [];
    for (i = 0; i < body.rows.length; i++) {
      var row = body.rows[i];
      if (row.className.indexOf('tot') >= 0 || row.className.indexOf('sep') >= 0) keep.push(row); else rows.push(row);
    }
    var val = function (row) {
      var txt = (row.cells[idx] ? row.cells[idx].textContent : '').replace(/,/g, '').trim();
      var n = parseFloat(txt);
      return (txt !== '' && !isNaN(n) && /^[-+\u2212]?[0-9.]+%?$/.test(txt.replace('\u2212', '-'))) ? n : txt.toLowerCase();
    };
    rows.sort(function (a, b) {
      var x = val(a), y = val(b);
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
      return String(x).localeCompare(String(y)) * dir;
    });
    rows.forEach(function (r) { body.appendChild(r); });
    keep.forEach(function (r) { body.appendChild(r); });
  }

  /* ------------------------------------------------------------------ events */
  function bind() {

      var el = e.target;

      var actEl = el.closest ? el.closest('[data-act]') : null;

      }
      if (chipEl) {
        var tid = chipEl.getAttribute('data-table');
        var box = chipEl.parentNode.querySelectorAll('.chip');
        for (var i = 0; i < box.length; i++) box[i].classList.remove('on');
        chipEl.classList.add('on');
        var tb = root.querySelector('#' + tid);
        if (tb) tb.setAttribute('data-chip', chipEl.getAttribute('data-chip'));
        applyFilter(tid);
        return;
      }
      if (thEl) { sortTable(thEl); return; }
      if (actEl) {
        var a = actEl.getAttribute('data-act');
        if (a === 'rail') { S.tight = !S.tight; root.classList.toggle('tight', S.tight); persist(); return; }
        if (a === 'home') { S.focus = ''; S.driver = 'all'; go('today'); return; }
        if (a === 'pop') { S.pop = !S.pop; drawHeader(); return; }
        if (a === 'export') { exportPage(); return; }

          var v = actEl.getAttribute('data-v');

        if (a === 'savedep') {
          var amt = q('depAmt') ? q('depAmt').value : '';
          act('apiSetDeposit', [actEl.getAttribute('data-day'), amt, opts()]);
          return;

      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
      load(true);
    }, SYNC_MS);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) load(true); });
  }

  /* ------------------------------------------------------------------ mount */
  function boot(el) {
    root = el;
    root.className = 'tp' + (S.tight ? ' tight' : '');
    root.innerHTML =
      '<div class="shell"><div id="rail" style="display:contents"></div><main>' +
      '<div class="weave"><i style="background:#C40202"></i><i style="background:#EB9F0B"></i>' +
      '<i style="background:#F2C230"></i><i style="background:#35939A"></i><i style="background:#182643"></i>' +
      '<i style="background:#1F6E74"></i></div>' +
      '<header id="hdr"></header><div class="body"><div id="content"><div class="loading">Loading\u2026</div></div></div>' +
      '</main></div><div class="toast" id="toast"></div>';
    root.querySelector('#rail').innerHTML = drawRail();
    drawHeader();
    bind();
    load();
  }

  if (!document.getElementById('taxi-portal-css')) {
    var s = document.createElement('style');
    s.id = 'taxi-portal-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }
  if (typeof customElements !== 'undefined' && !customElements.get('taxi-portal')) {
    customElements.define('taxi-portal', class extends HTMLElement {
      connectedCallback() { if (!this._up) { this._up = 1; boot(this); } }
    });
  }
})();
</script>
</body>
</html>
