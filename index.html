            '<td class="right num' + (l[3] ? ' chg' : '') + '"' +
            (l[2] ? ' style="font-weight:600;color:' + C.tealDeep + '"' : '') + '>' +
            fmt(l[1]) + '</td></tr>';

        '— <b>never add it again</b>. This is also exactly what Paymob deposits, which is ' +
        'what the Daily Settlement variance compares against.') +
      '<div class="scroll" style="margin-top:12px"><table class="data"><tbody>' +
      [['Paymob charges the DRIVER, on top', fmt(egp(pmFee)),
        'reference only — it never reduces our deposit'],
       ['Trips at this fare before he is blocked', String(trips),
        'at ' + fmt(block) + ' owed in total. This count is commission, fees & VAT only, because a ' +
        'calculator cannot know what change he is carrying — any Remaining Amount on his ' +
        'trips brings the block forward']].map(function (l) {
        return '<tr class="dim"><td>' + esc(l[0]) +
          '<div style="font-size:10.5px;color:' + C.muted + ';margin-top:2px">' +
          l[2] + '</div></td><td class="right num">' + l[1] + '</td></tr>';

      hardNote('<b>Only two parties ever receive money from us.</b> The Governorate and the ' +
        'Traffic Department are shown because you are entitled to know what is inside the ' +
        'eNovate amount — but they are eNovate\u2019s to distribute, and a separate transfer ' +
        'to either would be paying twice.') + link +
      (p.ok ? '' : '<div class="alert">This fare fails the per-trip check — it is too small ' +
        'to carry the fixed fee. Treat it as invalid.</div>');

  /* ============================ READING AN UPLOADED FILE ============================
     CSV and TSV are plain text. An .xlsx is a ZIP of XML, so it is unzipped here with the
     browser's own DecompressionStream — no library, no upload to a server, nothing leaves
     the machine. A spreadsheet exported straight out of Google Sheets is the normal case,
     so it has to work without asking anyone to convert anything first.

     This is the ONLY way rows get in. The paste-in textareas are gone: two ways in meant
     two parsers to trust for the one action that can put fifty wrong rows into the book in
     a single click.
  ================================================================================= */
  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('This browser cannot open .xlsx here. Save the sheet as CSV and ' +
        'upload that instead.');
    }
    var ds = new DecompressionStream('deflate-raw');
    var wr = ds.writable.getWriter();
    wr.write(bytes); wr.close();
    var chunks = [], rd = ds.readable.getReader();
    for (;;) {
      var r = await rd.read();
      if (r.done) break;
      chunks.push(r.value);
    }
    var len = chunks.reduce(function (s2, c) { return s2 + c.length; }, 0);
    var out = new Uint8Array(len), at = 0;
    chunks.forEach(function (c) { out.set(c, at); at += c.length; });
    return out;
  }

  async function unzip(buf) {
    var b = new Uint8Array(buf), files = {}, i = 0, dec = new TextDecoder();
    while (i < b.length - 3) {
      if (!(b[i] === 0x50 && b[i + 1] === 0x4B && b[i + 2] === 0x03 && b[i + 3] === 0x04)) {
        i++; continue;
      }
      var method = u16(b, i + 8), csize = u32(b, i + 18), usize = u32(b, i + 22);
      var nlen = u16(b, i + 26), elen = u16(b, i + 28);
      var name = dec.decode(b.subarray(i + 30, i + 30 + nlen));
      var start = i + 30 + nlen + elen;
      if (csize === 0 && usize === 0) { i = start; continue; }   // streamed entry, skip
      var data = b.subarray(start, start + csize);
      try {
        files[name] = method === 0 ? data : await inflateRaw(data);
      } catch (e) { /* an entry we do not need may fail; the ones we want are checked below */ }
      i = start + csize;
    }
    return files;
  }

  /* Excel keeps a date as a day count from 30 Dec 1899. */
  function serialToIso(n) {
    var ms = Math.round((Number(n) - 25569) * 86400000);
    var d0 = new Date(ms);
    if (isNaN(d0.getTime())) return '';
    return d0.getUTCFullYear() + '-' + ('0' + (d0.getUTCMonth() + 1)).slice(-2) + '-' +
      ('0' + d0.getUTCDate()).slice(-2);
  }

  /*
    A REAL DELIMITED READER, because a naive split on commas is not safe here.

    Splitting each line on "," was fine for a sheet we exported ourselves and wrong for
    anything else: a quoted field holding a comma (a client name, an address, a bank
    message) silently shifted every column after it by one, which on a money import means
    the amount is read out of the wrong column. Quoted fields, doubled quotes inside them,
    and newlines inside them are all handled here, and the delimiter is sniffed once.
  */
  function parseDelimited(text) {
    var t = String(text || '').replace(/^\uFEFF/, '');
    var first = t.split(/\r?\n/)[0] || '';
    var delim = first.indexOf('\t') >= 0 ? '\t' : ',';
    var rows = [], row = [], field = '', inQ = false, i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      if (inQ) {
        if (ch === '"') {
          if (t.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === delim) { row.push(field.trim()); field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      if (ch === '\n') { row.push(field.trim()); rows.push(row); row = []; field = ''; i++; continue; }
      field += ch; i++;
    }
    row.push(field.trim());
    if (row.length > 1 || row[0] !== '') rows.push(row);
    return rows;
  }
  function splitCells(line) {
    return (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(','))
      .map(function (x2) { return String(x2).trim(); });
  }

  async function readWorkbook(file) {
    var name = String(file.name || '').toLowerCase();
    if (/\.(csv|tsv|txt)$/.test(name)) {
      return parseDelimited(await file.text());
    }
    if (!/\.xlsx$/.test(name)) throw new Error('Upload a .xlsx, .csv or .tsv file.');
    var files = await unzip(await file.arrayBuffer());
    var dec = new TextDecoder();
    var shared = [];
    if (files['xl/sharedStrings.xml']) {
      var sx = dec.decode(files['xl/sharedStrings.xml']);
      var si = sx.split('<si>').slice(1);
      shared = si.map(function (chunk) {
        var t = chunk.split('</si>')[0].match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
        return t.map(function (x2) {
          return x2.replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
            .replace(/&quot;/g, '"').replace(/&amp;/g, '&');
        }).join('');
      });
    }
    var key = Object.keys(files).filter(function (k) {
      return /^xl\/worksheets\/sheet\d+\.xml$/.test(k);
    }).sort()[0];
    if (!key) throw new Error('No worksheet found inside that file.');
    var xml = dec.decode(files[key]);
    var rows = [];
    (xml.match(/<row[\s\S]*?<\/row>|<row[^>]*\/>/g) || []).forEach(function (rowXml) {
      var cells = [];
      (rowXml.match(/<c[\s\S]*?<\/c>|<c[^>]*\/>/g) || []).forEach(function (cx) {
        var ref = (cx.match(/r="([A-Z]+)\d+"/) || [])[1] || '';
        var cno = 0;
        for (var j = 0; j < ref.length; j++) cno = cno * 26 + (ref.charCodeAt(j) - 64);
        var type = (cx.match(/t="([^"]+)"/) || [])[1] || 'n';
        var val = '';
        if (type === 'inlineStr') {
          val = (cx.match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1] || '';
        } else {
          var v = (cx.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
          if (v === undefined) v = '';
          val = (type === 's') ? (shared[Number(v)] || '') : v;
        }
        val = String(val).replace(/&lt;/g, '<').replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"').replace(/&amp;/g, '&').trim();
        while (cells.length < cno - 1) cells.push('');
        cells.push(val);
      });
      if (cells.some(function (c) { return c !== ''; })) rows.push(cells);
    });
    return rows;
  }

  /* =============================== BULK IMPORT ===============================
     Read the file, review, then commit. The review step is the point: an import is the one
     action that can put fifty wrong rows into the book at once, and a settlement built on
     them will not balance for reasons nobody can see afterwards. So nothing is written
     until the rows have been shown priced, with the bad ones named.
  ========================================================================== */
  /*
    A DATE IS ONLY A DATE IF IT EXISTS.  (v26.4)

    "30/9/2026" read month-first is month 30. It used to come out as "2026-30-09", which the
    browser's date maths rolls into 2028 without complaint. ymd() refuses anything that does
    not read back as written, and the two readers below swap day and month when — and only
    when — the order they expect is impossible (a "month" over 12), which is what Excel does
    to a CSV when it re-saves it in a day-first locale.
  */
  function ymd(y, m, d) {
    y = Number(y); m = Number(m); d = Number(d);
    var dt = new Date(y, m - 1, d);

      var r = { linkId: c[0] || '', driverId: c[1] || '', driverName: c[2] || '',
        linkAmount: num(c[3]), sent: normDate(c[4]), ref: c[5] || '',
        status: (c[6] || 'Sent').trim(), paid: normDate(c[7]),
        depositOverride: normDate(c[8]), err: [] };
      // A reason carried in from a remapper (a Paymob row that collected nothing, a mobile
      // no driver is on). It is shown in the review and the row is skipped.
      if (c[9]) r.err.push(String(c[9]));
      if (c[10]) { r.warn = String(c[10]); r.warnShort = /Description/.test(c[10]) ? 'check the driver' : 'check the name'; }
      if (c[11] !== undefined && c[11] !== '' && isFinite(Number(c[11]))) r.kept = Number(c[11]);
      if (r.driverId && !r.driverName) r.driverName = driverName(r.driverId);
      if (!String(r.linkId).trim()) r.err.push('no Link ID');
      if (!r.driverId && !c[9]) r.err.push('driver');
      if (r.linkAmount === null || r.linkAmount <= 0) r.err.push('link amount');
      else if (r.linkAmount <= fee) {
        r.err.push('at or below the ' + fmt(fee) + ' fee — no cash in it');
      }
      if (!/^(sent|paid|failed|expired)$/i.test(r.status)) r.err.push('status');
      if (/^paid$/i.test(r.status) && !r.paid) r.err.push('no date paid');
      if (c[4] && !r.sent) r.err.push('date sent');
      // The fee depends on when the link was sent: 2.00 from the new terms, 1.50 before. (v26.19)
      if (!r.err.length) r.cash = Math.round((r.linkAmount - feeOn(r.sent || r.paid)) * 100) / 100;
      /*
        WHAT MATTERS IS THE DAY THE CASH LANDS, NOT THE DAY IT WAS PAID.

        A link paid the evening before a transfer is deposited T+1, which is AFTER that
        transfer — it re-opens nothing. Warning on the paid date flagged those as dangerous
        and sent people looking for a problem that was not there. The deposit day is not in
        the file, but it is not a guess either: it is the same rule the engine uses, out of
        the same two settings.
      */
      if (!r.err.length && lw && r.paid && !r.warn) {
        var lands = X.nextWorkDay(X.addD(r.paid, Number(settings().lag || 0)));
        if (lands && lands <= lw) {
          r.warnShort = 'after a sent transfer';
          r.warn = 'the cash lands ' + lands + ', on or before ' + lw + ', which has ' +
            'already been transferred \u2014 the transfer that went stays as it is, and ' +
            'this cash goes out with the next one';
        }
      }
      out.push(r);
    });
    return out;
  }

  /* ------------------------------------------------------------------ TRIPS */
  function pgTrips(d) {
    /*
      Three different things can leave this page with no rows, and only ONE of them means
      "there are no trips":
        1. the cached copy had to drop the trip list to fit  -> `_noTrips`
        2. the payload on hand was fetched for another range -> dataKey !== optsKey()
        3. the book really has no trip in this range
      Saying "No trip in this range yet" for 1 or 2 is a false statement about the book, and
      it is what made the list look like it had vanished until a manual refresh.
      A live payload ALWAYS carries a trips array, empty or not, so a missing key means an
      incomplete copy — never an empty range.
    */
    var listMissing = !!d._noTrips || !d.trips;
    var wrongRange = S.dataKey !== X.optsKey();
    var pending = listMissing || wrongRange;
    var tr = (d.trips || []).slice().reverse();
    if (!tr.length && pending) {
      return stripTrips(d, wrongRange) + panel('Trips',
        '<div class="loading" style="padding:30px">' + brandWord() +
        '<div style="font-size:11.5px;margin-top:16px">' +
        (wrongRange ? 'The range just changed, so this list is being fetched again.'
          : 'The saved copy did not carry the trip list \u2014 the live one is on its way.') +
        '</div></div>');
    }
    if (!tr.length) {
      return stripTrips(d, false) + empty('Trips',
        'No trip in this range yet. Use Import a file in the header to bring trips in from ' +
        'an .xlsx or .csv.');
    }
    var table = panel('Trips',
      tools('tSearch', 'tblTrips', 'Trip, driver or date\u2026', null, 'exportSearchedTrips',

          '<td class="num">' + esc(x2.id) + '</td>' +
          '<td class="num">' + esc(x2.date) + '</td>' +
          '<td>' + esc(x2.name || x2.driver) + '<span class="num" style="color:' + C.muted +
          ';font-size:10.5px;margin-left:7px">' + esc(x2.driver) + '</span></td>' +
          '<td class="right num">' + fmt(x2.gross) + '</td>' +
          '<td class="right num" style="color:' + C.muted + '">' + fmt(x2.meter) + '</td>' +
          '<td class="right num" style="color:' + C.muted + '">' + fmt(x2.comm) + '</td>' +
          '<td class="right num" style="color:' + C.muted + '">' + fmt(x2.fixed) + '</td>' +
          '<td class="right num" style="color:' + C.muted + '">' + fmt(x2.vat) + '</td>' +
          '<td class="right num" style="font-weight:600">' + fmt(x2.debt) + '</td>' +
          '<td class="right num chg">' +
          (Number(x2.rem) > 0 ? fmt(x2.rem) : '\u2014') +
          (x2.remBad ? ' <span class="bdg bad">?</span>' : '') + '</td>' +
          '<td class="right num" style="font-weight:600">' + fmt(x2.owed) + '</td>' +
          '<td class="right num">' + fmt(x2.zeds) + '</td>' +
          '<td class="right num">' + fmt(x2.enov) + '</td>' +
          '<td><span class="bdg ' + (x2.dispute ? 'bad'
            : (x2.status === 'Settled' ? 'good' : 'wait')) + '">' +
          (x2.dispute ? 'On hold' : esc(x2.status)) + '</span></td>' +
          '<td class="right" style="white-space:nowrap">' +

      }).join('') + '</tbody></table></div>' +

    h += acc('a2', 'Data quality',
      hard ? hard + ' to fix' : (soft ? soft + ' to look at' : 'Clean'),
      hard ? 'no' : (soft ? 'mid' : 'ok'),

      }).join('') + '</tbody></table></div>');

    h += acc('a3', 'Bank variance', Number(k.variance) === 0 ? '0.00' : fmt(k.variance),
      Number(k.variance) === 0 ? 'ok' : 'no',
      '<div class="scroll"><table class="data"><tbody>' +
      [['Link amounts as sent, on paid links', fmt(k.charged)],
       ['  of which is the link fee', fmt(k.linkFeesInside)],
       ['  cash against the drivers', fmt(k.collected)],
       ['In the bank', fmt(k.deposit)],
       ['In transit — not landed yet', fmt(k.transit)],
       ['Days with no deposit saved', int(k.unconfirmed)],
       ['Days held back by a variance', int(k.varianceBlocked || 0)]].map(function (r) {
        return '<tr><td' + (String(r[0]).charAt(0) === ' '
          ? ' style="color:' + C.muted + ';padding-left:15px"' : '') + '>' + esc(r[0]) +
          '</td><td class="right num" style="font-weight:600">' + r[1] + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      hardNote('The deposit is compared against the <b>link amounts as sent</b>, fee ' +
        'inside — that is what Paymob pays in. A shortfall of exactly ' + fmt(linkFee()) +
        ' per link means the bare debt was typed into Payments column D.'));

    h += acc('a4', "The Remaining Amount", fmt(k.remOpen) + ' still owed',
      Number(k.remOpen) > 0 ? 'mid' : 'ok',
      '<div class="scroll"><table class="data"><tbody>' +
      [['Advanced to riders', k.remEarned], ['Recovered from the drivers', k.remRecovered],
       ['Still owed', k.remOpen], ['Held on disputed trips', k.remHeld]].map(function (r) {
        return '<tr><td>' + esc(r[0]) + '</td><td class="right num chg" ' +

  }

  /* ==================================================================== HOLIDAYS
    A holiday behaves exactly like a Friday: no transfer leaves on it, and cash that would
    have landed on it rolls to the next working day and goes out with that day's wire on a
    single bank fee. All of that already worked — what was missing was a way to say which
    days they are without opening the sheet, which is the kind of thing that gets forgotten
    until a deposit lands on a day the book thinks is a working day.

    The whole list is saved in one go. It is short, it is read as a set, and a calendar that
    is half applied is worse than one that is rewritten.
  */

    if (S.holForm === null) {
      S.holForm = (d.holidayRows || (d.settings && d.settings.holidays) || [])
        .map(function (r) {

      return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);

    var ahead = list.filter(function (r) { return r.date >= today; }).length;
    var junk = Number((d.settings && d.settings.holidayJunk) || 0);

    var rows = list.length
      ? list.map(function (r, i) {
          var past = r.date < today;

          return '<tr' + (past ? ' class="dim"' : '') + '>' +
            '<td class="num" style="font-weight:600">' + esc(r.date) + '</td>' +
            '<td>' + esc(dow(r.date)) + '</td>' +
            '<td>' + esc(r.note || '\u2014') + '</td>' +
            '<td>' + (onWeekend
              ? '<span class="bdg mute">already a day off</span>'
              : (past ? '<span class="bdg mute">past</span>'
                : '<span class="bdg good">nothing goes out</span>')) + '</td>' +
            '<td class="right">' + (past
              /* A past holiday decided which day the cash around it landed on, and that
                 cash has been matched. Removing it now would move it. (v26.4) */
              ? '<span style="font-size:11px;color:' + C.muted + '">stays</span>'
              : '<button class="btn btn-danger" style="height:28px;' +
                'padding:0 10px;font-size:11.5px" data-act="holdel" data-i="' + i + '"' +

        'set. Every day of the working week is treated as a transfer day.</td></tr>';

    /*
      IS WHAT IS ON SCREEN WHAT IS IN THE SHEET?

      Add and Remove only change the list here; nothing is written until Save. That is the
      right design — a calendar is edited as a set — but it is invisible, so removing a day
      and walking away looked exactly like removing a day and saving it. The page says which
      state it is in, where it cannot be missed.
    */

      return typeof r === 'string' ? r + '|' : r.date + '|' + (r.note || '');

    var mine = list.map(function (r) { return r.date + '|' + (r.note || ''); }).sort().join(';');

    var out = strip([
      ['HOLIDAYS SET', int(list.length), dirty ? 'on screen \u2014 NOT SAVED YET'
        : 'in the whole calendar', 0],
      ['STILL AHEAD', int(ahead), 'today or later', 0],
      ['WORKING WEEK', weekText(S.week).replace(/, /g, ' '), 'transfer days', 0],
      ['UNREADABLE ROWS', int(junk), junk ? 'fix them on Control &amp; Checks' : 'none', 0]
    ]);

    out += (dirty
      ? '<div class="alert warn"><b>These changes are not in the book yet.</b> Adding and ' +
        'removing only changes the list on this page \u2014 press <b>Save the calendar</b> ' +
        'below to write it. Leaving the page without saving throws the changes away.</div>'
      : '');

    out += panel('The days nothing goes out on',
      '<div class="scroll"><table class="data"><thead><tr>' +
      '<th>Date</th><th>Day</th><th>What it is</th><th>Effect</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (canWrite()
        ? '<div class="frm" style="margin-top:16px">' +
          '<div class="fld"><label>Date</label>' +
          '<input id="holDate" type="date" style="width:170px"></div>' +
          '<div class="fld"><label>To \u00b7 optional, for a feast</label>' +
          '<input id="holTo" type="date" style="width:170px"></div>' +
          '<div class="fld"><label>What it is \u00b7 optional</label>' +
          '<input id="holNote" type="text" style="width:260px;font-family:inherit" ' +
          'placeholder="Prophet\u2019s Birthday"></div>' +
          '<button class="btn btn-ghost" data-act="holadd"' +
          (S.acting ? ' disabled' : '') + '>Add to the list</button>' +
          '<button class="btn btn-primary" data-act="holsave"' +
          (S.acting ? ' disabled' : '') + '>Save the calendar \u00b7 ' +
          int(list.length) + ' day(s)</button>' +
          '</div>' +
          '<p class="note" style="margin-top:10px">' + ic('info') +
          '<span>You can press <b>Save</b> straight after typing a date \u2014 it takes ' +
          'whatever is in the boxes as well as the list above. <b>Add to the list</b> is ' +
          'for entering several at once.</span></p>'
        : '') +
      hardNote('A holiday is treated exactly like a Friday. A payment link whose cash would ' +
        'have reached the bank on it is deposited on the <b>next working day</b> instead, ' +
        'no transfer leaves on the day itself, and what accrued goes out with the next ' +
        'wire \u2014 on <b>one</b> bank fee, not one per day.') +
      hardNote('Only today and later can change. A day that has passed stays as it is: ' +
        'whether it was a holiday decided which day the payments around it reached the ' +
        'bank, and those deposits have already been matched.') +
      hardNote('Nothing is written until you press <b>Save the calendar</b>, and saving ' +
        'replaces the whole list with what is shown above. Adding a holiday recalculates ' +
        'the book, so deposit days already in the future move with it.'),
      list.length + ' day(s)');

    return out;
  }

  var PAGEFN = { today: pgSettle, trips: pgTrips, change: pgChange, revenue: pgRevenue,
    calc: pgCalc, history: pgHistory, drivers: pgDrivers, links: pgLinks, remit: pgRemit,
    recon: pgRecon, holidays: pgHolidays, users: pgUsers, logs: pgLogs };

  X.chrome = { drawRail: drawRail, updateRail: updateRail, drawHeader: drawHeader,
    visiblePages: visiblePages, canWrite: canWrite, sanitizePageForRole: sanitizePageForRole,
    PAGEFN: PAGEFN,
    pool: pool, poolRows: poolRows, readyNow: readyNow, nextTransferDay: nextTransferDay,
    carriedFrom: carriedFrom, landedPayments: landedPayments, driverIndex: driverIndex,
    sentDays: sentDays, dueDays: dueDays, sum: sum, achFee: achFee, linkFee: linkFee,
    feeInside: feeInside, K: K, settings: settings,
    tripSplit: tripSplit, riderFromMeter: riderFromMeter, rateFrom: rateFrom, toP: toP,
    egp: egp, parseTrips: parseTrips, parseLinks: parseLinks, readWorkbook: readWorkbook,
    depCheck: depCheck, fmt: fmt, hideRemaining: hideRemaining,
    modalHtml: modalHtml, hardNote: hardNote, panel: panel, empty: empty,
    brandWord: brandWord };
})();

<script>
/* ==================== PART 3 — LOADER, RENDER, EXPORT, EVENTS ==================== */
(function () {
  'use strict';
  var X = window.__TAXI, CH = X.chrome;
  var S = X.S, C = X.C, PAGES = X.PAGES, PAGEMAP = X.PAGEMAP;

  var iso = X.iso, dow = X.dow, dm = X.dm, weekText = X.weekText;

  /* Every table that applyFilter is ever asked to narrow. tblRemit was in this list for

  function root() { return X.getRoot(); }

  /*
    IS THIS PAGE INSIDE AN IFRAME. It normally is: the portal is embedded on GitHub Pages.
    An iframe is sized by its parent, so the page must not also try to size itself to the
    frame — that loop is what clipped the bottom of a long page on a phone — and sticky
    positioning against a viewport that IS the whole document pins nothing while taking the
    header out of flow. Both are handled by the .framed rules in the CSS.
  */
  var FRAMED = (function () { try { return window.parent !== window; } catch (e) { return true; } })();
  function shellClass(extra) { return 'tp' + (extra || ''); }

  /* The scrolling area is main, not the document — see the CSS. Everything that used to
     read or set window.scrollY goes through these two instead, or a background refresh
     would silently jump a half-read table back to the top. */
  /*
    THE APP SHELL IS NOT ALWAYS ON SCREEN.

    #content exists only once bootApp has built the shell. The login screen, the forced
    password screen and everything after a sign-out replace the whole root with something
    that has no #content at all — and three places wrote innerHTML straight onto it with no
    check, so anything that painted in one of those states took the page down with
    "Cannot set properties of null". A background poll landing a moment after a sign-out was
    enough to do it.

    a crash.
  */
  function contentEl() { var r = root(); return r ? r.querySelector('#content') : null; }

    THE READING STATE, PAINTED BY WHOEVER NEEDS IT.

    already in flight — so switching to a range with no copy left the PREVIOUS page's body
    sitting there, sometimes for seconds, until the earlier read finished and the deferred
    one finally started. Showing one page's figures under another page's heading is the one
    thing this portal must never do, so the paint is done at the moment of the switch and
    does not depend on a request having started.
  */
  function paintReading() {

    if (!host) return;

      '<div style="font-size:11.5px;margin-top:16px">' +

          'the script up.') + '</div></div>';

  function mainEl() { return root() ? root().querySelector('main') : null; }

    Deliberately NOT d.sig. That signature describes the whole book and is identical across
    different date ranges and across a server-cached reply — which is precisely how a
    payload with 100 trips could be dismissed as "unchanged" while 10 were displayed. These

    screen is out of date by definition.

      (d.trips || []).length, (d.payments || []).length,
      (d.drivers || []).length, (d.days || []).length,
      k.trips, k.debt, k.gross, k.remEarned, k.remOpen, k.outstanding,
      k.matched, k.dueNet, k.dueCount, k.transfers, k.blocked,
      d.tripsShown, d.range && d.range.start, d.range && d.range.end,
      /* The two stamps are the only things a page shows that no total above would move:

        return a + (r.loggedAt ? 2 : 0) + (r.approvalAt ? 1 : 0);
      }, 0),
      /*

        single figure: the same amount is due, one transfer, one fee — only the DATE moves.

        left "Sun 20 Sep" on screen until somebody reloaded the page. The dates of what is

    // already moved on is never mistaken for having painted the new page.

  function load(silent) {

      A load asked for while another is in flight must NOT be thrown away.

      Dropping it meant the page that needed data never received it: the request vanished,
      and the screen sat empty or showed a different range's figures until some later
      navigation happened to trigger a fetch. That is exactly the "the Settle panel was
      missing, then appeared once I moved between pages" symptom — nothing was broken in
      the data, the request for it was simply discarded.

      So the intent is remembered and honoured when the current call returns.
    */
    /*
      Signed out means signed out. The poll and the visibility handler below are on timers
      that outlive a sign-out, and a read fired from the login screen has no token, no shell
      to paint onto, and nothing useful to do — it only ends in a refusal that signs the
      person out again.
    */

    /*
      NOT WHILE A WRITE IS IN FLIGHT.  (v26.4)

      The settle, import or save that is running answers with the fresh book itself, and
      act() warms every other range straight after. A read issued in the meantime sees the
      sheet half-way through being rewritten — and the poll WAS issuing them: a read already
      in the air when Settle was pressed came back, cleared `busy`, and from then on the
      two-second poll ran all the way through the settle. That is what made the transfer
      screen flicker between "sent", "not sent" and "every day needs a deposit".
    */

    S.loadAgain = false;

    usually only two or three distinct ones, and the server answers a repeat request out of
    its own cache without touching a cell.

    flight, never while a box is open, and never while the tab is hidden. The effect is that

  /* Click a Send/Settle/Save button and it should look different in the same frame, not a

    `disabled` on EVERY button, so a background poll landing mid-parse re-enabled Import and

  function act(fn, args) {

    // lands. A background read sets busy alone and leaves the page usable — this used to
    // guard on S.busy instead, which a routine poll (or the page's own initial load) also

      // paints instantly and corrects itself a moment later instead of going blank.

      // straight away rather than on the next beat, or the first page opened after a settle

      'align-items:center;gap:9px">' + ic('bang') + 'Cannot read the sheet</div>' +

  function render() {

    var snap = snapshotInteraction();
    var body = '';
    body += welcomeHtml(d);
    /*
      No banner for the cached state. Painting instantly from the last good copy while the
      fresh read lands is how this feels immediate rather than blank — announcing it as a
      warning framed the normal case as a fault, and inserting a full-width alert for one
      second only to remove it shifted the whole page down and back up again. The header's
      quiet "Updating…" cue already says a fetch is in flight, for anyone who looks.
    */
    if (S.err) body += '<div class="alert">Last refresh failed: ' + esc(S.err) + '</div>';
    if (d.rateWarn) body += '<div class="alert">' + esc(d.rateWarn) + '</div>';
    var fn = CH.PAGEFN[S.page] || CH.PAGEFN.today;
    body += fn(d);

      '<div class="body' + (S.navPaint ? ' nav' : '') + '">' + body + '</div>' +
      CH.modalHtml();
    CH.updateRail();
    CH.drawHeader();
    TABLES.forEach(applyFilter);
    // Tag what just got painted with the key of the DATA it came from — not the key the
    // current page would like to show. Right after a page switch these two can differ for a
    // moment; that is what tells load()'s callback that a still-pending fetch for the new
    // key must repaint even if the sheet's own "sig" turns out unchanged.
    S.renderedKey = S.dataKey;
    S.navPaint = false;   // consumed: only the paint caused by the navigation animates
    restoreInteraction(snap);
    try { CH.hideRemaining(root()); } catch (eHR) {}
    /* The frame is sized by the parent, so every repaint has to say how tall the page now
       is — otherwise a page that just grew (a table filling in, a modal opening) stays

    reportHeight();

  /* Switching pages does NOT hit the network unless the range actually changed. An old
     build called load() on every switch, which is most of what "lag" felt like. */
  function go(k) {
    if (!PAGEMAP[k]) return;
    if (PAGEMAP[k].roles && S.auth && PAGEMAP[k].roles.indexOf(S.auth.role) < 0) return;
    if (k !== 'today') S.justSettled = '';
    S.page = k; S.pop = false;
    S.navPaint = true;
    X.persist();
    /*
      THE PAGE'S OWN RANGE IS ADOPTED BEFORE ANYTHING IS PAINTED.  *** THE TAB-SWITCH BUG ***

      Every page carries its own date range, so moving between two pages almost always
      changes optsKey(). This used to render() straight away with S.data still holding the
      PREVIOUS page's range, and then (below) skip the fetch entirely whenever a copy of the
      new range happened to be under three minutes old. Nothing ever swapped S.data, so the
      new page sat showing the old page's figures until the 120-second poll or a manual
      refresh — which is exactly the "I have to refresh every time I move tab" fault.

      Each range is already cached under its own key. Reading the matching one FIRST is what
      makes the switch land on the right numbers; the confirmation read below keeps them
      true. A range never seen before paints nothing at all rather than someone else's
      totals — load() puts a spinner there instead.
    */
    var navKey = optsKey();
    var navCached = X.cacheLoad(navKey);
    var haveThisRange = !!navCached || navKey === S.dataKey;
    if (navCached && navKey !== S.dataKey) adopt(navCached, true, navKey);
    if (haveThisRange) render();
    else {
      // Nothing for this range yet. Clear the previous page off the screen HERE — load()
      // below may not get as far as painting anything if a read is already in flight.
      CH.updateRail();
      CH.drawHeader();
      paintReading();
    }
    scrollTo(0);
    if (k === 'users') loadUsers();
    if (k === 'logs') loadLogs();
    /*
      Confirm against the sheet unless what was just painted is only seconds old. Three
      minutes was far too long to trust a figure somebody is about to act on, and the read
      is now cheap: with the book-revision cache key (bookRev_ in Code.gs) the engine
      answers a repeat request out of its own cache without rebuilding the model, so this
      costs one round trip and no sheet work at all.
    */
    /*
      Sixty seconds, and silently. Twenty meant a confirming read on nearly every move
      between pages, and redrawing the header to spin the refresh icon announced each one —
      so a portal that was painting instantly from cache still LOOKED like it was loading
      all day. Any write clears the cache outright and the background poll runs anyway, so
      what this interval protects against is only a change somebody else made, and a minute
      is soon enough for that.
    */
    var navAge = (navCached && navCached._at) ? Date.now() - navCached._at : Infinity;
    if (!haveThisRange || navAge > 60000) load(true);
  }

    if (!t || !t.tBodies[0]) return;
    var qq = t.getAttribute('data-q') || '', chip = t.getAttribute('data-chip') || 'all';
    var dtFrom = t.getAttribute('data-tfrom') || '', dtTo = t.getAttribute('data-tto') || '';
    var terms = qq.split(/\s+/).filter(function (x2) { return x2; });
    var rows = t.tBodies[0].rows, shown = 0, total = 0;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.className.indexOf('tot') >= 0) continue;
      total++;
      var key = (r.getAttribute('data-k') || r.textContent).toLowerCase(), ok = true;
      for (var j = 0; j < terms.length; j++) if (key.indexOf(terms[j]) < 0) { ok = false; break; }
      if (ok && chip !== 'all') ok = (r.getAttribute('data-s') || '') === chip;
      if (ok && (dtFrom || dtTo)) {
        var rd = r.getAttribute('data-dt') || '';
        ok = !!rd && (!dtFrom || rd >= dtFrom) && (!dtTo || rd <= dtTo);
      }
      r.style.display = ok ? '' : 'none';
      if (ok) shown++;
    }
    var hh = root().querySelector('#hits-' + tableId);
    if (hh) hh.textContent = shown === total ? total + ' rows' : shown + ' of ' + total + ' rows';
  }
  function sortTable(th2) {
    var t = th2;
    while (t && t.tagName !== 'TABLE') t = t.parentNode;
    if (!t) return;
    var idx = th2.cellIndex, dir = th2.classList.contains('asc') ? -1 : 1;
    var hs = th2.parentNode.cells, i;
    for (i = 0; i < hs.length; i++) { hs[i].classList.remove('asc'); hs[i].classList.remove('desc'); }
    th2.classList.add(dir === 1 ? 'asc' : 'desc');
    var bodyEl = t.tBodies[0], rows = [], keep = [];
    for (i = 0; i < bodyEl.rows.length; i++) {
      var row = bodyEl.rows[i];
      if (row.className.indexOf('tot') >= 0) keep.push(row); else rows.push(row);
    }
    var val = function (row) {
      var txt = (row.cells[idx] ? row.cells[idx].textContent : '').replace(/,/g, '').trim();
      var n = parseFloat(txt);
      return (txt !== '' && !isNaN(n) &&
        /^[-+\u2212]?[0-9.]+%?$/.test(txt.replace('\u2212', '-'))) ? n : txt.toLowerCase();
    };
    rows.sort(function (a, b) {
      var x2 = val(a), y = val(b);
      if (typeof x2 === 'number' && typeof y === 'number') return (x2 - y) * dir;
      return String(x2).localeCompare(String(y)) * dir;
    });
    rows.forEach(function (r) { bodyEl.appendChild(r); });
    keep.forEach(function (r) { bodyEl.appendChild(r); });
  }

  /* ------------------------------------------------------------------ events */
  function bind() {
    var el0 = root();
    // bootApp() (and so bind()) can now run more than once in a single page life — sign
    // out, then sign back in, with no actual reload in between — and re-adding every
    // listener on each run stacked a full duplicate set on top of the last, firing every
    // click/keydown/action as many times as bootApp() had run.
    if (el0._appBound) return;
    el0._appBound = true;
    el0.addEventListener('click', function (e) {
      var el = e.target;
      var goEl = el.closest ? el.closest('[data-go]') : null;
      var actEl = el.closest ? el.closest('[data-act]') : null;
      var chipEl = el.closest ? el.closest('[data-chip]') : null;
      var presetEl = el.closest ? el.closest('[data-preset]') : null;
      var thEl = el.closest ? el.closest('th[data-sort]') : null;

      if (presetEl) {
        var cfg = S.rng[S.page];
        if (cfg) { cfg.preset = presetEl.getAttribute('data-preset'); cfg.start = ''; cfg.end = ''; }
        S.pop = false; X.persist(); CH.drawHeader(); load();
        return;
      }
      if (chipEl) {
        var tid = chipEl.getAttribute('data-table');
        var box0 = chipEl.parentNode.querySelectorAll('.chip');
        for (var i = 0; i < box0.length; i++) box0[i].classList.remove('on');
        chipEl.classList.add('on');
        var tb = root().querySelector('#' + tid);
        if (tb) tb.setAttribute('data-chip', chipEl.getAttribute('data-chip'));
        applyFilter(tid);
        return;
      }
      if (thEl) { sortTable(thEl); return; }
      if (actEl) {
        var a = actEl.getAttribute('data-act');
        if (a === 'signout') { signOut(); return; }
        /*
          THE CLIENT-SIDE HALF OF THE WRITE GUARD. The server refuses every one of these on
          its own via requireRole_ — this only stops the round trip and says why, so a
          viewer or support user gets an immediate, clear answer instead of a delayed
          server rejection for a button that should not have been clickable at all.
        */
        var WRITE_ACTIONS = { settle: 1, confirmsettle: 1, savedeps: 1, fillexpected: 1,
          remitask: 1, unlogask: 1, pmfee: 1, depfix: 1, holadd: 1, holdel: 1,
          thold: 1, impcommit: 1, import: 1, remitsend: 1, confirmunlog: 1,
          createuser: 1, setuserstatus: 1, resetpw: 1, holsave: 1 };
        if (WRITE_ACTIONS[a] && !CH.canWrite()) {
          toast('Your role is read-only — ask an admin for this.', 'warn');
          return;
        }
        if (a === 'rail') {
          S.tight = !S.tight; root().classList.toggle('tight', S.tight); X.persist(); return;
        }
        if (a === 'home') { S.focus = ''; S.driver = 'all'; go('today'); return; }
        if (a === 'pop') { S.pop = !S.pop; CH.drawHeader(); return; }
        if (a === 'export') { exportPage(); return; }
        if (a === 'exportSearchedTrips') { exportSearchedTrips(); return; }

        cfg.start = t.getAttribute('data-date') === 'start' ? t.value : r.start;
        cfg.end = t.getAttribute('data-date') === 'end' ? t.value : r.end;
        cfg.preset = 'custom';
        X.persist(); CH.drawHeader(); load();
      }
    });
    el0.addEventListener('toggle', function (e) {
      if (e.target && e.target.className === 'acc' && e.target.id) {
        S.open[e.target.id] = e.target.open;
      }
    }, true);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && (S.modal || S.imp)) {
        S.modal = null; S.imp = null; render(); return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var a = document.activeElement;
      if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
      var n = parseInt(e.key, 10);
      if (n >= 1 && n <= CH.visiblePages().length) { go(CH.visiblePages()[n - 1].k); e.preventDefault(); }
      else if (e.key === 'e') exportPage();
      else if (e.key === 'r') load();
    });

    /* A poll is skipped when the tab is hidden, when one is already running, when a menu or
       a field is open, while a file is being parsed, and when the last successful read is
       still fresh. Between them an idle tab costs nothing and a busy one never fights
       itself. */
    setInterval(function () {
      if (!S.auth) return;
      if (document.hidden || S.busy || S.pop || S.modal || S.imp || S.impBusy) return;
      var a = document.activeElement;
      if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
      if (S.lastOk && Date.now() - S.lastOk < X.MIN_GAP_MS) return;
      load(true);
    }, X.SYNC_MS);
    setInterval(prefetchTick, X.PREFETCH_MS);
    document.addEventListener('visibilitychange', function () {
      if (!S.auth) return;
      if (document.hidden || S.modal || S.imp || S.impBusy) return;
      /*
        Coming back to the tab is not the same as sitting on it. MIN_GAP_MS exists to stop
        the background poll fighting itself over minutes; applying it here meant returning
        after a minute away showed a minute-old figure with no read issued at all. Fifteen
        seconds is enough to stop a tab-flick storm and short enough that what you are
        looking at is current.
      */
      /* Coming back to the portal — from the sheet, say, after deleting rows there — is
         exactly when its figures are most likely to be out of date, so it reads at once.
         (v26.6: the 15-second floor here is what kept deleted trips on screen.) */
      if (S.lastOk && Date.now() - S.lastOk < 1500) return;
      load(true);
    });
    window.addEventListener('focus', function () {
      if (!S.auth || document.hidden || S.modal || S.imp || S.impBusy) return;
      if (S.lastOk && Date.now() - S.lastOk < 1500) return;
      load(true);
    });
  }

  /* ------------------------------------------------------------------ mount */
  var AUTH_LS = 'taxisharm.auth.v1';
  /*
    THE TOKEN IS KEPT WHEREVER THE BROWSER WILL KEEP IT.

    This portal is served inside an iframe, and a browser may refuse localStorage there
    outright — the same refusal that used to wipe the data cache. When that happens the
    token is never written, and every reload lands on the login screen. sessionStorage is
    usually still allowed in the same position, so it is tried next; it lasts for the life
    of the tab, which is the difference between signing in once a day and signing in every
    time the page is refreshed.
  */
  function authStores() {
    var out = [];
    try { if (window.localStorage) out.push(window.localStorage); } catch (e) {}
    try { if (window.sessionStorage) out.push(window.sessionStorage); } catch (e2) {}
    return out;
  }
  function saveAuth(a) {
    var raw = JSON.stringify(a);
    authStores().forEach(function (st) {
      try { st.setItem(AUTH_LS, raw); } catch (e) {}
    });
  }
  /*
    WHEN THE SESSION WAS LAST USED, kept beside the token.  (v26.4)

    The engine ends a session after 8 hours without use. The portal did not know that, so
    opening it the next morning built the whole app around yesterday's token, asked the sheet
    for figures, was told the session had expired, and only THEN showed the sign-in — the
    "portal for a few seconds, then log in" flash. With the last-use time stored, a token that
    has certainly expired goes straight to the sign-in screen. The engine only refreshes its
    own clock every 30 minutes of use, hence the half-hour margin.
  */
  var SESSION_IDLE_MS = 8 * 3600000 - 30 * 60000;
  var touchedAt = 0;
  function touchAuth() {
    if (!S.auth || Date.now() - touchedAt < 60000) return;
    touchedAt = Date.now();
    S.auth.used = touchedAt;
    saveAuth(S.auth);
  }
  function loadAuth() {
    var found = null;
    authStores().forEach(function (st) {
      if (found) return;
      try {
        var raw = st.getItem(AUTH_LS);
        if (raw) found = JSON.parse(raw);
      } catch (e) {}
    });
    return found;
  }
  function clearAuth() {
    authStores().forEach(function (st) {
      try { st.removeItem(AUTH_LS); } catch (e) {}
    });
  }

  function loginHtml() {
    var logo = X.CFG.logo || 'favicon-512x512.png';
    return '<div class="loginWrap"><div class="loginCard">' +
      '<img src="' + esc(logo) + '" alt="Taxi Sharm" class="loginLogo">' +
      '<p class="loginTitle">Taxi Sharm</p>' +
      '<p class="loginSub">Settlement</p>' +
      (S.loginErr ? '<div class="alert" style="margin:16px 0 0">' + esc(S.loginErr) + '</div>' : '') +
      '<div class="loginFld"><label>Email or username</label>' +
      '<input id="loginUser" type="text" autocomplete="username" placeholder="name@zedshub.com" value="' +
      esc(S.loginUser) + '"' + (S.loginBusy ? ' disabled' : '') + '></div>' +
      '<div class="loginFld"><label>Password</label>' +
      '<input id="loginPass" type="password" autocomplete="current-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" value="' +
      esc(S.loginPass) + '"' + (S.loginBusy ? ' disabled' : '') + '></div>' +
      '<button class="btn btn-accent loginBtn' + (S.loginBusy ? ' busy' : '') + '" ' +
      'data-act="do-login"' + (S.loginBusy ? ' disabled' : '') + '>' +
      (S.loginBusy ? '<span class="spin"></span>Signing in\u2026' : 'Sign in') + '</button>' +
      '<p class="loginNote">' + ic('info') +
      '<span>Your role decides what you can see. Ask an admin if you need an account.</span></p>' +
      '</div></div>';
  }

  function showLogin(el) {
    X.setRoot(el);
    el.className = shellClass();
    el.innerHTML = loginHtml();
    var userEl = el.querySelector('#loginUser');
    // focus the password once a username is already remembered from a previous attempt,
    // so the person can go straight to fixing what was actually wrong
    var toFocus = (S.loginUser && !S.loginBusy) ? el.querySelector('#loginPass') : userEl;
    if (toFocus) { toFocus.focus(); var v = toFocus.value; toFocus.value = ''; toFocus.value = v; }
    // Guarded so this only ever runs once per root element: showLogin can be called many
    // times across one page's life (a failed attempt, signing out and landing back here
    // without a reload) and re-adding these on every call stacked up duplicate listeners,
    // firing doLogin() more than once per single click or Enter press.
    if (el._loginBound) return;
    el._loginBound = true;
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.target.id === 'loginUser' || e.target.id === 'loginPass')) {
        e.preventDefault();
        doLogin(el);
      }
    });
    el.addEventListener('input', function (e) {
      if (e.target.id === 'loginUser') S.loginUser = e.target.value;
      if (e.target.id === 'loginPass') S.loginPass = e.target.value;
    });
    el.addEventListener('click', function (e) {
      var actEl = e.target.closest ? e.target.closest('[data-act="do-login"]') : null;
      if (actEl) doLogin(el);
    });
  }

  function forcedPwHtml() {
    var logo = X.CFG.logo || 'favicon-512x512.png';
    return '<div class="loginWrap"><div class="loginCard">' +
      '<img src="' + esc(logo) + '" alt="Taxi Sharm" class="loginLogo">' +
      '<p class="loginTitle">Set your password</p>' +
      '<p class="loginSub">One-time step</p>' +
      '<p class="note" style="text-align:left;margin:14px 0 0">' + ic('lock') +
      '<span>The password you signed in with was temporary. Choose your own before ' +
      'continuing \u2014 you will be asked to sign in again with it right after.</span></p>' +
      (S.pwChangeErr ? '<div class="alert" style="margin:14px 0 0">' + esc(S.pwChangeErr) +
        '</div>' : '') +
      '<div class="loginFld" style="margin-top:16px"><label>New password</label>' +
      '<input id="pwNew1" type="password" autocomplete="new-password" placeholder="8+ characters"' +
      (S.pwChangeBusy ? ' disabled' : '') + '></div>' +
      '<div class="loginFld"><label>Confirm new password</label>' +
      '<input id="pwNew2" type="password" autocomplete="new-password" placeholder="type it again"' +
      (S.pwChangeBusy ? ' disabled' : '') + '></div>' +
      '<button class="btn btn-accent loginBtn' + (S.pwChangeBusy ? ' busy' : '') + '" ' +
      'data-act="do-pwchange"' + (S.pwChangeBusy ? ' disabled' : '') + '>' +
      (S.pwChangeBusy ? '<span class="spin"></span>Saving\u2026' : 'Save and continue') +
      '</button></div></div>';
  }

  function showForcedPasswordChange(el) {
    X.setRoot(el);
    el.className = shellClass();
    el.innerHTML = forcedPwHtml();
    var f1 = el.querySelector('#pwNew1');
    if (f1) f1.focus();
    if (el._pwChangeBound) return;
    el._pwChangeBound = true;
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.target.id === 'pwNew1' || e.target.id === 'pwNew2')) {
        e.preventDefault();
        doForcedPwChange(el);
      }
    });
    el.addEventListener('click', function (e) {
      var actEl = e.target.closest ? e.target.closest('[data-act="do-pwchange"]') : null;
      if (actEl) doForcedPwChange(el);
    });
  }

  function doForcedPwChange(el) {
    var f1 = el.querySelector('#pwNew1'), f2 = el.querySelector('#pwNew2');
    var pw1 = f1 ? f1.value : '', pw2 = f2 ? f2.value : '';
    if (!pw1 || pw1.length < 8) {
      S.pwChangeErr = 'Password must be at least 8 characters.';
      showForcedPasswordChange(el);
      return;
    }
    if (pw1 !== pw2) {
      S.pwChangeErr = 'The two passwords do not match.';
      showForcedPasswordChange(el);
      return;
    }
    S.pwChangeBusy = true; S.pwChangeErr = '';
    showForcedPasswordChange(el);
    X.callOnce('apiChangeOwnPassword', [S.auth.token, pw1], function (d) {
      S.pwChangeBusy = false;
      if (!d || !d.ok) {
        S.pwChangeErr = (d && d.message) || 'Could not save the new password.';
        showForcedPasswordChange(el);
        return;
      }
      // Deliberately sign out rather than continue straight in: the person asked for their
      // own password to be the one they actually use going forward, confirmed by typing it
      // to sign in again — not simply trusted because the change call happened to succeed.
      // No #toast element exists on this screen (there is no app shell yet), so the
      // confirmation has to be this screen's own content, shown briefly before signOut()
      // reloads the page.
      el.innerHTML = '<div class="loginWrap"><div class="loginCard" style="text-align:center">' +
        '<p class="loginTitle">Password set</p>' +
        '<p class="loginSub" style="margin-bottom:18px">Signing you out to sign back in with it\u2026</p>' +
        '</div></div>';
      setTimeout(function () { signOut(); }, 1400);
    }, function (e) {
      S.pwChangeBusy = false;
      S.pwChangeErr = (e && e.message) ? e.message : String(e);
      showForcedPasswordChange(el);
    });
  }

  function doLogin(el) {
    var u = el.querySelector('#loginUser'), p = el.querySelector('#loginPass');
    var username = u ? u.value.trim() : '', password = p ? p.value : '';
    S.loginUser = username;
    if (!username || !password) {
      S.loginErr = 'Type your email and password.';
      showLogin(el);
      return;
    }
    S.loginBusy = true; S.loginErr = '';
    showLogin(el);
    X.callOnce('apiLogin', [username, password], function (d) {
      S.loginBusy = false;
      if (!d || !d.ok) {
        S.loginErr = (d && d.message) || 'Could not sign in.';
        showLogin(el);
        return;
      }
      S.auth = { token: d.token, username: d.username, role: d.role, used: Date.now() };
      saveAuth(S.auth);
      S.loginUser = ''; S.loginPass = ''; S.loginErr = '';
      S.welcome = { name: d.username, at: Date.now() };
      if (d.mustChangePassword) { showForcedPasswordChange(el); return; }
      bootApp(el);
    }, function (e) {
      S.loginBusy = false;
      S.loginErr = (e && e.message) ? e.message : String(e);
      showLogin(el);
    });
  }

  function signOut() {
    var t = S.auth && S.auth.token;
    if (t) { try { X.callOnce('apiLogout', [t], function () {}, function () {}); } catch (e) {} }
    clearAuth();
    try { X.cacheClear(); } catch (e) {}
    // Reset every piece of state the previous session left behind, so the next sign-in —
    // by the same person or someone else on the same browser — starts genuinely clean,
    // with nothing left over to accidentally reuse or leak between accounts.
    S.auth = null; S.data = null; S.sig = ''; S.cached = false; S.err = '';
    S.usersData = null; S.logsData = null; S.userForm = null;
    S.modal = null; S.imp = null; S.impBusy = false; S.calc = null;
    S.driver = 'all'; S.focus = ''; S.justSettled = ''; S.pop = false; S.typed = {};
    S.busy = false; S.acting = false; S.loadedKey = ''; S.renderedKey = ''; S.dataKey = '';
    S.page = 'today';
    try { X.persist(); } catch (e) {}
    showLogin(X.getRoot());
  }

  function boot(el) {
    var saved = loadAuth();
    if (!saved || !saved.token) { showLogin(el); return; }
    if (!saved.used || Date.now() - Number(saved.used) > SESSION_IDLE_MS) {
      clearAuth();
      showLogin(el);
      return;
    }
    // No separate "is this token still good" round trip before building the app: that used
    // to cost a full extra request on EVERY normal page open, for a check getDashboardData
    // was about to do anyway the moment load() ran. If the saved token has gone stale, that
    // very first dashboard fetch fails with the same "session has expired" message, and
    // isAuthError() (already wired into load()'s failure handler) bounces back to the
    // login screen exactly as before — just without the wait beforehand on every good visit.
    S.auth = { token: saved.token, username: saved.username, role: saved.role };
    bootApp(el);
  }

  function bootApp(el) {
    CH.sanitizePageForRole();
    X.setRoot(el);
    el.className = shellClass(S.tight ? ' tight' : '');
    el.innerHTML =
      '<div class="shell"><div id="rail" style="display:contents"></div><main>' +
      '<div class="weave"><i style="background:#C40202"></i><i style="background:#EB9F0B"></i>' +
      '<i style="background:#F2C230"></i><i style="background:#35939A"></i>' +
      '<i style="background:#182643"></i><i style="background:#1F6E74"></i></div>' +
      '<header id="hdr"></header><div id="content"></div></main></div>' +
      '<div class="toast" id="toast"></div>';
    var railHost = el.querySelector('#rail');
    if (railHost) railHost.innerHTML = CH.drawRail();
    CH.drawHeader();
    bind();
    // A restored (or default) starting page of 'users'/'logs' is legitimate for an owner —
    // but that page's data is never part of the normal dashboard payload, and until now
    // only go() ever triggered its fetch. Landing there straight from boot needs the same
    // trigger go() gives it, or it sits on "Loading…" forever.
    if (S.page === 'users') loadUsers();
    if (S.page === 'logs') loadLogs();
    load();
  }

  if (!document.getElementById('taxi-portal-css')) {
    var st = document.createElement('style');
    st.id = 'taxi-portal-css';
    st.textContent = X.CSS;
    document.head.appendChild(st);
  }

  /* Any uncaught error goes on the screen. A blank white page tells you nothing, and this
     portal is mostly read on a phone where there is no console to open. */
  window.addEventListener('error', function (ev) {
    var el = document.querySelector('taxi-portal');
    if (!el || el.getAttribute('data-crashed')) return;
    el.setAttribute('data-crashed', '1');
    el.innerHTML = '<div style="font:14px/1.6 system-ui,sans-serif;color:#C40202;' +
      'padding:40px 22px;max-width:680px;margin:0 auto">' +
      '<b style="font-size:17px">The portal hit an error</b>' +
      '<p style="color:#111d1c">' + String(ev.message || ev.error || 'unknown') + '</p>' +
      '<p style="color:#6E7A79;font-size:12px">' + String((ev.filename || '') + ' line ' +
      (ev.lineno || '?')) + '</p><p style="color:#6E7A79;font-size:12px">Send this text on ' +
      'and reload the page.</p></div>';
  });

  /* Mount. Custom elements are the normal path; the direct call is the safety net for an
     older in-app browser or WebView where customElements is missing, because without it the
     page would sit on "Loading" forever with no clue why. */
  function mountAll() {
    var list = document.querySelectorAll('taxi-portal');
    for (var i = 0; i < list.length; i++) {
      if (!list[i]._up) { list[i]._up = 1; boot(list[i]); }
    }
  }
  /* ------------------------------------------------------- iframe height ------------
     This page is served inside an iframe on the GitHub Pages wrapper, and an iframe
     never sizes itself to its content — the parent has to be told what height to use.
     With nothing reporting it, the frame kept its fixed height and everything taller was
     clipped: on a phone that showed as a sentence cut in half with blank space below it.

     The parent listens for these messages and sets the frame's height. If the wrapper is
     an older version that does not listen, the messages are simply ignored — nothing
     breaks, so this is safe to send unconditionally.
  */
  /*
    THE FRAME IS NO LONGER SIZED TO THE CONTENT, AND MUST NOT BE.

    The portal used to measure itself and ask the parent to make the iframe that tall. That
    is what broke every sticky thing on the page: an iframe as tall as its content has no
    scrollport of its own, so the rail, the page header and the frozen table row all had
    nothing to stick to, and the parent page scrolled them away. It also raced its own
    measurement, which is what clipped the bottom on a phone.

    The frame is a fixed viewport now — `height:100dvh` in wrapper.html — and the scrolling
    happens INSIDE here, in main. Nothing needs reporting, so nothing is reported; these two
    stay as no-ops so the call sites do not have to know.
  */
  function reportHeight() { /* deliberately does nothing — see above */ }

  function watchHeight() {
    /* Nothing to watch: see reportHeight above. Kept so the two mount paths below can go on
       calling it without either of them having to change. */
  }

  if (typeof customElements !== 'undefined' && customElements.define) {
    if (!customElements.get('taxi-portal')) {
      try {
        customElements.define('taxi-portal', class extends HTMLElement {
          connectedCallback() { if (!this._up) { this._up = 1; boot(this); } }
        });
      } catch (e) { mountAll(); }
    }
    // If the upgrade never ran, mount by hand rather than leaving a dead page.
    setTimeout(mountAll, 400);
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountAll);
  } else {
    mountAll();
  }

  /*
    Start reporting the height once, regardless of which mount path ran. Attaching it
    inside the branches above missed the custom-elements path — the one actually taken —
    so no height was ever reported and the frame stayed clipped.
  */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', watchHeight);
  } else {
    watchHeight();
  }
})();
</script>

<noscript><div id="boot">This portal needs JavaScript.</div></noscript>
<script>
  /* The service worker only where this page is the site itself (GitHub Pages) — never inside
     Apps Script's frame. It caches nothing; it is there so the browser offers "Install". */
  if ('serviceWorker' in navigator && !(typeof google !== 'undefined' && google.script) &&
      /github\.io$/.test(location.hostname)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
</body>
