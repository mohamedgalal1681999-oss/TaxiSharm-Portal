<script>
/* =====================================================================================
 * TAXI SHARM — MINIMAL XLSX WRITER
 * No library, no CDN, no server round trip: builds a real .xlsx (a stored-entry ZIP of
 * SpreadsheetML) in the browser.
 *
 *   TaxiXlsx.save('name.xlsx', [
 *     { name:'Sheet 1', cols:[24,14], rows:[ ['Header','A'], ['Row', {v:3, b:true}] ] }
 *   ]);
 *
 * A cell is a string, a number, or { v:value, b:bold, m:money, t:'title'|'head' }.
 * Numbers carry the 2-decimal money format unless m:false is passed.
 * ===================================================================================== */
(function () {
  'use strict';

  var enc = new TextEncoder();
  function bytes(s) { return enc.encode(s); }

  /* The XML declaration is assembled at runtime. Apps Script's HTML templating reads an
     angle-bracket-question-mark pair as a SCRIPTLET, so a literal declaration anywhere in
     a file it serves is parsed as JavaScript and throws. Splitting the two characters
     means that sequence never appears in the source while the string produced is
     byte-identical. Never write that sequence literally in this file — not even inside a
     comment, because the template engine scans the raw text and does not know what a
     JavaScript comment is. */
  var XMLHEAD = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?' + '>';

  var TBL = (function () {
    var t = new Uint32Array(256), c, n, k;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(buf) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = TBL[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function zip(files) {
    var parts = [], central = [], offset = 0;
    function u16(n) { return [n & 0xFF, (n >>> 8) & 0xFF]; }
    function u32(n) { return [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]; }
    files.forEach(function (f) {
      var name = bytes(f.name), data = bytes(f.data), crc = crc32(data);
      var local = [].concat([0x50, 0x4B, 0x03, 0x04], u16(20), u16(0x0800), u16(0), u16(0),
        u16(0), u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
      parts.push(new Uint8Array(local), name, data);
      central.push({ name: name, crc: crc, len: data.length, off: offset });
      offset += local.length + name.length + data.length;
    });
    var cd = [], cdLen = 0;
    central.forEach(function (c) {
      var head = [].concat([0x50, 0x4B, 0x01, 0x02], u16(20), u16(20), u16(0x0800), u16(0),
        u16(0), u16(0), u32(c.crc), u32(c.len), u32(c.len), u16(c.name.length), u16(0),
        u16(0), u16(0), u16(0), u32(0), u32(c.off));
      cd.push(new Uint8Array(head), c.name);
      cdLen += head.length + c.name.length;
    });
    var end = new Uint8Array([].concat([0x50, 0x4B, 0x05, 0x06], u16(0), u16(0),
      u16(central.length), u16(central.length), u32(cdLen), u32(offset), u16(0)));
    return new Blob(parts.concat(cd, [end]),
      { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function x(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  }
  function col(n) {
    var s = '';
    while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
    return s;
  }

  /* style ids: 0 text · 1 bold text · 2 money · 3 bold money · 4 title · 5 header */
  var STYLES = XMLHEAD +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00"/></numFmts>' +
    '<fonts count="4">' +
    '<font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="14"/><color rgb="FF12474C"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF12474C"/>' +
    '<bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="6">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="3" fillId="2" borderId="0" xfId="0" applyFill="1"/>' +
    '</cellXfs><cellStyles count="1">' +
    '<cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';

  function cellXml(ref, cell) {
    if (cell === null || cell === undefined || cell === '') return '';
    var v = cell, bold = false, money = null, kind = '';
    if (typeof cell === 'object') {
      v = cell.v; bold = !!cell.b; money = cell.m; kind = cell.t || '';
    }
    if (v === null || v === undefined || v === '') return '';
    var isNum = typeof v === 'number' && isFinite(v);
    var s;
    if (kind === 'title') s = 4;
    else if (kind === 'head') s = 5;
    else if (isNum && money !== false) s = bold ? 3 : 2;
    else s = bold ? 1 : 0;
    if (isNum) return '<c r="' + ref + '" s="' + s + '"><v>' + v + '</v></c>';
    return '<c r="' + ref + '" s="' + s + '" t="inlineStr"><is>' +
      '<t xml:space="preserve">' + x(v) + '</t></is></c>';
  }

  function sheetXml(sh) {
    var cols = '';
    if (sh.cols && sh.cols.length) {
      cols = '<cols>' + sh.cols.map(function (wd, i) {
        return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + (wd || 14) +
          '" customWidth="1"/>';
      }).join('') + '</cols>';
    }
    var rows = (sh.rows || []).map(function (r, i) {
      var cells = (r || []).map(function (c, j) {
        return cellXml(col(j + 1) + (i + 1), c);
      }).join('');
      return '<row r="' + (i + 1) + '">' + cells + '</row>';
    }).join('');
    return XMLHEAD +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView workbookViewId="0"' +
      (sh.freeze ? '><pane ySplit="' + sh.freeze + '" topLeftCell="A' + (sh.freeze + 1) +
        '" activePane="bottomLeft" state="frozen"/></sheetView>' : '/>') +
      '</sheetViews>' + cols + '<sheetData>' + rows + '</sheetData></worksheet>';
  }

  function build(sheets) {
    var names = sheets.map(function (s, i) {
      return String(s.name || ('Sheet' + (i + 1))).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31);
    });
    var files = [
      { name: '[Content_Types].xml', data: XMLHEAD +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        sheets.map(function (s, i) {
          return '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
            '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
        }).join('') +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
      { name: '_rels/.rels', data: XMLHEAD +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', data: XMLHEAD +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
        'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
        names.map(function (n, i) {
          return '<sheet name="' + x(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
        }).join('') + '</sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: XMLHEAD +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        sheets.map(function (s, i) {
          return '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
        }).join('') +
        '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/styles.xml', data: STYLES }
    ];
    sheets.forEach(function (s, i) {
      files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXml(s) });
    });
    return zip(files);
  }

  function save(filename, sheets) {
    var blob = build(sheets);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  window.TaxiXlsx = { build: build, save: save };
})();
</script>

<script>
/* =====================================================================================
 * TAXI SHARM — SETTLEMENT PORTAL  ·  v26.22  (needs engine v25.28)
 *
 *  (v26.22) If a POST cannot be completed (an engine without doPost), the call is asked again
 *  by GET; when neither works the message says what to deploy, not "Failed to fetch".
 *
 *  (v26.21) THIS FILE IS NOW ALSO THE GITHUB PAGES PAGE ITSELF — no frame around Apps Script.
 *  It opens at once from GitHub, paints the last figures it kept, and talks to the engine by
 *  POST (doPost). The same file still runs inside Apps Script (google.script.run) too.
 *
 *  (v26.20) A deposit row for a day that has not come yet is shut, and says when it opens.
 *
 *  (v26.19) The links review works out each row's cash with the fee in force on the day the
 *  link was sent (1.50 before 12 Oct, 2.00 from), as the engine does.
 *
 *  (v26.18) The terms from 12 Oct: link fee 2.00 (declared 1.50 split, 0.50 ours), Paymob's
 *  3.00 on each payout in "should land", no ACH margin. Revenue reads as one statement —
 *  commission, link fees, gross, Paymob's costs, net. The Remaining Amount is gone: its page,
 *  and every column and card while the book holds none.
 *
 *  (v26.17) A payment is matched to its driver by the Driver ID in Description AND the mobile:
 *  either one is enough, and when they name two different drivers the row is refused.
 *
 *  (v26.16) Paymob's payment-link report (xlsx, header on row 7): link amount from CAF, the
 *  VAT Paymob keeps on its fee recorded per payment, the driver from the Driver ID in
 *  Description. Settle shows what should land — links less that VAT less the account charge —
 *  and works it out again as the charge is typed.
 *
 *  (v26.15) Paymob's real 78-column export: its own account charge (payment method
 *  SUBSCRIPTION, "Key Account Bundle Fees") is named and skipped, not read as a payment.
 *
 *  (v26.14) The import review asks the book which IDs it already has and shows those rows as
 *  "already in the book — skipped"; only new rows are sent.
 *
 *  (v26.13) Sign-in gets the long timeout: the first sign-in on an older account re-hashes
 *  its password, which can run past the 30 seconds a read is given.
 *
 *  (v26.12) The "after a sent transfer" warning on imported trips shows only for drivers who
 *  have already paid something — a new driver's trips cannot touch a transfer that went.
 *
 *  (v26.11) iPhone: focusing the sign-in fields zoomed the page in and it stayed zoomed.
 *  Every field is 16px on a phone (iOS zooms below that), and the frame's viewport
 *  forbids the automatic zoom.
 *
 *  (v26.10) iPhone: the page did not fit the screen when the app opened — iOS text
 *  inflation inside the frame. text-size-adjust:100%, no sideways scroll, 100% not 100vw.
 *
 * WHAT v26.9 CHANGES — found by walking every page as every role
 * -------------------
 *  A. Read-only roles saw live write buttons: Settle, Save these deposits, Import, Undo,
 *     Advice. The sheet refused them, but nothing on screen said so. They are disabled (or,
 *     for Import, not shown) for viewer and support; the deposit boxes are read-only.
 *  B. Support saw the "Ready to send" money in the rail; it now shows only to roles that
 *     can open Settle.
 *  C. The rail dates the next wire as the Settle card does (the engine's pending date), not
 *     from the browser's clock — they disagreed on holidays.
 *
 *  (v26.8) "Should be" on Fix these first is what the BANK should show — the link amounts
 *  less what Paymob kept — not the link total, which read as "type the full amount".
 *
 * WHAT v26.8 CHANGES
 * -------------------
 *  A. SAVE SAVED THE OLD FIGURE. A refresh landing between typing a deposit and pressing
 *     Save rebuilt the boxes from the sheet, so Save sent the old value back: "1 deposit(s)
 *     saved" and nothing changed. What is typed is now kept until it is saved.
 *  B. The first background refresh after opening no longer blanks the page to "reading".
 *
 * WHAT v26.7 CHANGES
 * -------------------
 *  A. The deposit boxes say which is which ("In the bank · statement" / "Paymob kept · if
 *     any") and check "bank + Paymob kept = expected" while you type.
 *  B. A day over by exactly the deduction (full amount typed AND the deduction) is named,
 *     with two one-click answers: the bank got less, or Paymob kept nothing.
 *
 * WHAT v26.6 CHANGES
 * -------------------
 *  A. PAYMOB'S PAYOUT DEDUCTION can be typed beside each deposit, and a shortfall of exactly
 *     that size gets a one-click "Record as Paymob's". Settlement History shows it.
 *  B. Coming back to the portal (from the sheet, another tab) reads at once.
 *
 * WHAT v26.5 CHANGES — the dispatch trips export and Paymob's export, as they really come
 * -------------------
 *  A. Phones are cleaned by the engine's own rule (+20, 0020, 20, apostrophe, spaces,
 *     dashes, a lost leading 0). One Excel turned into 2.01016E+11 is named, not guessed.
 *  B. Dates: an impossible date is refused, and day/month are swapped only when the order
 *     the file normally uses is impossible (Excel re-saving in a day-first locale).
 *  C. Paymob rows that are not cash are skipped with the reason: refunded, voided, failed,
 *     another service's order, a phone on two drivers, a phone nobody has. A card holder
 *     whose name shares nothing with the driver on that phone is flagged for a look.
 *  D. The review shows each trip's cleaned mobile and each driver's name.
 *
 * WHAT v26.4 CHANGES
 * -------------------
 *  A. NO READ RUNS WHILE A WRITE IS IN FLIGHT, AND NO ANSWER FROM BEFORE ONE IS USED. A read
 *     already in the air when Settle was pressed came back, cleared `busy`, and the poll
 *     then ran through the whole settle, painting the sheet half-rewritten — the transfer
 *     appearing, vanishing, and every day asking for its deposit. S.epoch moves at the start
 *     and end of every write; an answer issued under another epoch is dropped.
 *  B. A REFRESH THAT FINDS NOTHING NEW COSTS A FEW BYTES. Each payload carries the engine's
 *     tag for it; the portal sends the tag back and an unchanged book answers "unchanged" —
 *     nothing parsed, stored or painted. With engine v25.12 caching the real payload, the
 *     re-read is every 3 seconds and the other pages' ranges every 20.
 *  C. If somebody else's write holds the book, an action says so and leaves the screen and
 *     anything typed on it alone.
 *  D. Holidays: a past day cannot be added or removed any more (the engine refuses it too),
 *     and "Drop the past days" is gone — it moved cash that had already been matched.
 *
 * WHAT v26.3 CHANGES
 * -------------------
 *  A. THE SHEET IS RE-READ EVERY FIVE SECONDS, SILENTLY, and the ranges the other pages use
 *     are kept warm in the background — several at a time, and immediately after any write.
 *     Nothing about it shows on screen: a repaint happens only when a figure actually
 *     moved. Moving between pages paints from memory.
 *  B. An empty work-week map from the engine now falls back instead of drawing seven
 *     dashes.
 *
 * WHAT v26.2 CHANGES
 * -------------------
 *  A. EVERY PAGE SWITCH STILL RE-READ THE SHEET, and the cache was the reason. cacheSave
 *     ended a failed localStorage write by calling cacheClear(), which wipes MEM too —
 *     and inside a cross-origin iframe localStorage.setItem THROWS. So every successful
 *     read finished by deleting the in-memory copy it had just made, and the portal went
 *     back to Apps Script for figures it already held. A storage refusal now drops only
 *     the stored copies, and is remembered so it is not retried on every save.
 *
 *  B. THE LAYOUT: the app is now exactly one viewport tall and scrolls inside itself, so
 *     the rail cannot move, the page header sticks, and a table's header row freezes. The
 *     frame is no longer grown to fit the content — that is what left nothing for any of
 *     them to stick to, and it is why the bottom was cut off on a phone. wrapper.html sets
 *     the frame to 100dvh and must be updated with this file.
 *
 * WHAT v26.1 CHANGES
 * -------------------
 *  A. MOVING BETWEEN TABS SHOWED THE PREVIOUS TAB'S FIGURES.  ***THE REPORTED FAULT***
 *     Every page carries its own date range, so a switch almost always changes optsKey().
 *     go() rendered immediately with S.data still holding the PREVIOUS page's range, and
 *     then skipped the fetch entirely whenever any copy of the new range was under three
 *     minutes old. Nothing ever swapped S.data, so the new page sat showing the old page's
 *     numbers with no read issued to correct it — until the 120-second poll or a manual
 *     refresh. It now adopts this range's own cached copy BEFORE painting, paints nothing
 *     stale for a range it has never seen, and always confirms in the background unless the
 *     copy is only seconds old.
 *
 *  B. THE SCREEN IS CUT OFF INSIDE THE IFRAME. An iframe is sized by its parent, so
 *     min-height:100vh made the page and the frame chase each other and lose the bottom of

  function niceMax(v) {
    if (!(v > 0)) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
    return (n <= 1 ? 1 : (n <= 2 ? 2 : (n <= 2.5 ? 2.5 : (n <= 5 ? 5 : 10)))) * p;
  }
  function barChart(rows, defs) {
    var W = 760, H = 232, L = 56, R = 12, T = 12, B = 32;
    var iw = W - L - R, ih = H - T - B, max = 0;
    rows.forEach(function (r) {
      defs.forEach(function (d) { max = Math.max(max, Math.abs(Number(r[d[0]]) || 0)); });
    });
    var top = niceMax(max);
    var lab = top >= 100000
      ? function (v) { return Math.round(v / 1000).toLocaleString('en-US') + 'k'; }
      : function (v) { return Math.round(v).toLocaleString('en-US'); };
    // A 2px surface gap between adjacent bars: touching fills read as one wide mark, which
    // is what made two dark series look like a single block.
    var GAP = 2;
    var gw = iw / rows.length;
    var bw = Math.max(5, Math.min(16, (gw - 8 - (defs.length - 1) * GAP) / defs.length));
    var span = bw * defs.length + (defs.length - 1) * GAP, grid = '';
    [0, .25, .5, .75, 1].forEach(function (f) {
      var yy = T + ih - f * ih;
      grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy.toFixed(1) + '" y2="' +
        yy.toFixed(1) + '" stroke="' + (f === 0 ? C.line : C.grid) + '" stroke-width="1"/>' +
        '<text x="' + (L - 9) + '" y="' + (yy + 3.4).toFixed(1) + '" text-anchor="end" ' +
        'font-size="9.5" fill="' + C.muted + '" font-family="IBM Plex Mono,monospace">' +
        lab(top * f) + '</text>';

    var bars = rows.map(function (r, i) {
      var x0 = L + i * gw + gw / 2 - span / 2;
      return defs.map(function (d, j) {
        var v = Number(r[d[0]]) || 0, hh = Math.max((Math.abs(v) / top) * ih, v > 0 ? 1.5 : 0);
        // Rounded data-end only, anchored square to the baseline: a bar rounded at BOTH
        // ends floats off its own axis and reads a couple of pixels short.
        var rx = Math.min(4, bw / 2, hh);
        var x = x0 + j * (bw + GAP), y = T + ih - hh, ww = bw;
        var path = hh <= rx
          ? 'M' + x.toFixed(1) + ' ' + y.toFixed(1) + 'h' + ww.toFixed(1) +
            'v' + hh.toFixed(1) + 'h' + (-ww).toFixed(1) + 'Z'
          : 'M' + x.toFixed(1) + ' ' + (y + hh).toFixed(1) +
            'V' + (y + rx).toFixed(1) +
            'q0 ' + (-rx).toFixed(1) + ' ' + rx.toFixed(1) + ' ' + (-rx).toFixed(1) +
            'h' + (ww - 2 * rx).toFixed(1) +
            'q' + rx.toFixed(1) + ' 0 ' + rx.toFixed(1) + ' ' + rx.toFixed(1) +
            'V' + (y + hh).toFixed(1) + 'Z';
        return '<path d="' + path + '" fill="' + d[2] + '"><title>' + esc(r.date) +
          ' \u00b7 ' + esc(d[1]) + ' ' + fmt(v) + '</title></path>';
      }).join('');
    }).join('');
    var every = rows.length > 10 ? Math.ceil(rows.length / 9) : 1;
    var xlab = rows.map(function (r, i) {
      return i % every ? '' : '<text x="' + (L + i * gw + gw / 2).toFixed(1) + '" y="' +
        (T + ih + 17) + '" text-anchor="middle" font-size="9.5" fill="' + C.muted +
        '" font-family="IBM Plex Mono,monospace">' + esc(dm(r.date)) + '</text>';
    }).join('');
    return '<div class="cw"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
      grid + bars + xlab + '</svg></div>';
  }

  /* ------------------------------------------------------------------ SETTLE

    last Sunday's money sat unsent and invisible.
